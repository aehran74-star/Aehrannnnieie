function categoryMatch(p,type){if(type==='all')return true;const cols=Array.isArray(p.collections)?p.collections:[];if(cols.length)return cols.includes(type)||(type==='sale'&&p.old>p.price);if(['new','men'].includes(type))return true;if(type==='sale')return p.old>p.price;if(type==='wedding')return ['wedding','sherwani','jacket','groom-gold'].includes(p.cat)||['sherwani','jacket'].includes(p.cat);if(type==='reception')return ['sherwani','minimal','sangeet'].includes(p.cat);if(type==='groom')return ['sherwani','jacket'].includes(p.cat);if(type==='groomsman')return ['jacket','kurta','sangeet'].includes(p.cat);if(type==='father-son')return cols.includes('father-son')||cols.includes('father')||['kurta','jacket','minimal'].includes(p.cat);if(type==='father'||type==='brother')return ['kurta','jacket','minimal'].includes(p.cat);if(type==='ready')return p.stock>0;return p.cat===type}

function filterPrice(el,type,range){document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');let list=products.filter(p=>categoryMatch(p,type));if(range==='under5')list=list.filter(p=>p.price<5000);if(range==='5to10')list=list.filter(p=>p.price>=5000&&p.price<=10000);if(range==='10plus')list=list.filter(p=>p.price>10000);document.getElementById('collectionGrid').innerHTML=list.map(pc).join('');safeImg()}

function totals(){const sub=cart.reduce((s,x)=>s+x.price*x.qty,0),mrp=cart.reduce((s,x)=>(Number(x.old||x.price)||0)*x.qty,0);let discount=0;if(coupon?.code){const r=discountRule(coupon.code);if(r&&sub>=Number(r.min||0)){discount=r.type==='percent'?sub*Number(r.value||0)/100:Number(r.value||0);if(Number(r.max||0)>0)discount=Math.min(discount,Number(r.max))}}const o=(typeof aeProductOfferConfig==='function'?aeProductOfferConfig():(cms.productOffers||{})),b=o.bundle||{},pp=o.prepaid||{},qty=cart.reduce((s,x)=>s+Number(x.qty||0),0);let bundle=0,bundlePercent=0;if(o.enabled!==false&&b.enabled!==false){if(qty>=Number(b.buy3Qty||3))bundlePercent=Number(b.buy3Percent||15);else if(qty>=Number(b.buy2Qty||2))bundlePercent=Number(b.buy2Percent||10);bundle=sub*bundlePercent/100}const pay=String(aeSelectedPayment()||'').toLowerCase(),isCod=/\bcod\b|cash on delivery/.test(pay);let prepaid=0;if(o.enabled!==false&&pp.enabled!==false&&!isCod)prepaid=sub*Number(pp.percent||5)/100;const totalDiscount=Math.min(sub,discount+bundle+prepaid),settings=aeGSTSettings(),calc=window.AEHRAN_GST?.calculateCart(cart,settings,totalDiscount,settings.businessState,aeGSTCustomerState())||{taxableAmount:Math.max(0,sub-totalDiscount),gstEnabled:false,gstRate:0,gstAmount:0,cgstAmount:0,sgstAmount:0,igstAmount:0,taxType:'NONE',grandTotal:Math.max(0,sub-totalDiscount)};const shippingAmount=Math.max(0,Number(cms.checkout?.shippingAmount)||0),withShip=window.AEHRAN_GST?.withShipping(calc,shippingAmount)||{...calc,shippingAmount,grandTotal:calc.grandTotal+shippingAmount};return {sub,mrp,save:Math.max(0,mrp-sub),coupon:discount,bundle,bundlePercent,prepaid,prepaidPercent:(!isCod?Number(pp.percent||5):0),discount:totalDiscount,taxableAmount:withShip.taxableAmount,gstEnabled:withShip.gstEnabled,gstRate:withShip.gstRate,gstAmount:withShip.gstAmount,cgstAmount:withShip.cgstAmount,sgstAmount:withShip.sgstAmount,igstAmount:withShip.igstAmount,taxType:withShip.taxType,shippingAmount:withShip.shippingAmount,total:withShip.grandTotal,mode:withShip.mode}}

function orderCard(o){const rr=returnRequests.filter(r=>r.orderId===o.id);return `<div class="order-card"><div class="order-top"><b>${o.id}</b><span class="order-status">${escapeHTML(o.status||'Placed')}</span></div><div class="order-lines">${new Date(o.date).toLocaleString()} · ${o.items.length} item(s) · ${money(o.total)}<br>${o.items.map(i=>`${escapeHTML(i.name)} × ${i.qty} · ${escapeHTML(i.size||'')}`).join('<br>')}<br>Payment: ${escapeHTML(o.payment||'')}</div>${rr.length?`<span class="return-request-chip">Return: ${escapeHTML(rr[0].status)}</span>`:''}<div class="order-actions"><button onclick="trackSavedOrder('${o.id}')">Track order</button><a href="#returns/${o.id}">Return / Exchange</a></div></div>`}
function orderHistoryPage(){const mine=customerOrders();return `<section class="page"><div class="wrap"><div class="history-panel"><div class="history-head"><div><div class="eyebrow">AEHRAN account</div><h2>Order History</h2></div><p>View orders saved in this browser, track their current status, or start a return request for an eligible item.</p></div>${mine.length?mine.slice().reverse().map(orderCard).join(''):`<div class="empty">No orders found yet.<br><br><a class="text-link" href="#collection/new">Start shopping</a></div>`}</div></div></section>${footer()}`}
function returnOrderPage(preselectedId=''){const mine=customerOrders(),selected=mine.find(o=>o.id===preselectedId)||mine[mine.length-1]||null,reqs=returnRequests.filter(r=>!profile||orders.find(o=>o.id===r.orderId)?.email===profile.email);if(!mine.length)return `<section class="page"><div class="wrap" style="max-width:760px"><div class="check-card"><div class="eyebrow">Returns & exchanges</div><h2>No order available to return</h2><p class="return-lead">Place an order first, or sign in with the same email used at checkout. Once an order is available, you can request a return or exchange from here.</p><a class="btn" href="#orders">Open Order History</a></div></div></section>${footer()}`;return `<section class="page"><div class="wrap"><div class="return-shell"><div class="return-panel"><div class="eyebrow">AEHRAN returns</div><h2>Return an Order</h2><p class="return-lead">Select the order and item you want to return. Your request will be saved and shown in Order History.</p><form class="return-form" onsubmit="submitReturnRequest(event)"><div class="field"><label>Order ID</label><select id="returnOrderId" onchange="populateReturnItems()">${mine.slice().reverse().map(o=>`<option value="${o.id}" ${selected&&o.id===selected.id?'selected':''}>${o.id} · ${new Date(o.date).toLocaleDateString('en-IN')}</option>`).join('')}</select></div><div class="field"><label>Item to return</label><select id="returnItemIndex">${selected?selected.items.map((i,idx)=>`<option value="${idx}">${escapeHTML(i.name)} · Size ${escapeHTML(i.size||'')}</option>`).join(''):''}</select></div><div class="grid2"><div class="field"><label>Reason for return</label><select id="returnReason" required><option value="">Choose a reason</option><option>Size / fit issue</option><option>Wrong item received</option><option>Damaged or defective item</option><option>Quality issue</option><option>Item different from expectation</option><option>Other</option></select></div><div class="field"><label>Preferred resolution</label><select id="returnResolution" required><option>Refund to original payment method</option><option>Exchange for another size</option></select></div></div><div class="field"><label>More details (optional)</label><textarea id="returnDetails" rows="4" placeholder="Tell us what went wrong or which size you need."></textarea></div><label class="return-check"><input id="returnConfirm" type="checkbox" required><span>I confirm the item is unused, unwashed, with original tags and accessories, except when the item arrived damaged or incorrect.</span></label><button class="btn">Submit Return Request</button></form>${reqs.length?`<div class="return-history"><h4>Recent return requests</h4>${reqs.slice(0,4).map(r=>`<div class="return-request"><div class="return-request-top"><b>${r.id}</b><span>${escapeHTML(r.status)}</span></div><p>${escapeHTML(r.itemName)} · ${escapeHTML(r.reason)}<br>Order ${r.orderId} · ${new Date(r.date).toLocaleString()}</p></div>`).join('')}</div>`:''}</div><aside class="return-rules"><div class="eyebrow">Return requirements</div><h3>Before you request a return</h3><div class="return-rule"><i>1</i><div><b>Request within 5 days</b><span>Start the request within 5 days of delivery for eligible products.</span></div></div><div class="return-rule"><i>2</i><div><b>Keep the product unused</b><span>The item should be unworn, unwashed and in its original condition.</span></div></div><div class="return-rule"><i>3</i><div><b>Keep tags & packaging</b><span>Original tags, packaging and included accessories should be available at pickup.</span></div></div><div class="return-rule"><i>4</i><div><b>Choose a valid reason</b><span>Select the correct reason. For damaged or wrong items, the team may ask for supporting photos during verification.</span></div></div><div class="return-rule"><i>5</i><div><b>Some items may be excluded</b><span>Altered, customized, used, washed, or specifically marked non-returnable items may not qualify.</span></div></div><div class="return-steps"><div class="return-step"><small>Step 01</small><b>Submit request</b><p>Choose your order, item, reason and refund or exchange preference.</p></div><div class="return-step"><small>Step 02</small><b>Pickup & check</b><p>Eligible returns are picked up and checked against the return conditions.</p></div><div class="return-step"><small>Step 03</small><b>Refund / exchange</b><p>After approval, the refund or exchange is processed according to the selected option.</p></div></div></aside></div></div></section>${footer()}`}
function populateReturnItems(){const id=document.getElementById('returnOrderId')?.value,o=orders.find(x=>x.id===id),sel=document.getElementById('returnItemIndex');if(!sel||!o)return;sel.innerHTML=o.items.map((i,idx)=>`<option value="${idx}">${escapeHTML(i.name)} · Size ${escapeHTML(i.size||'')}</option>`).join('')}
function submitReturnRequest(e){e.preventDefault();const orderId=document.getElementById('returnOrderId').value,o=orders.find(x=>x.id===orderId),idx=Number(document.getElementById('returnItemIndex').value),item=o?.items?.[idx];if(!o||!item){toast('Select a valid order and item');return}const active=returnRequests.find(r=>r.orderId===orderId&&r.itemId===item.id&&r.status!=='Rejected'&&r.status!=='Completed');if(active){toast('A return request already exists for this item');return}const req={id:'RET'+Math.floor(100000+Math.random()*900000),orderId,itemId:item.id,itemName:item.name,size:item.size||'',reason:document.getElementById('returnReason').value,resolution:document.getElementById('returnResolution').value,details:document.getElementById('returnDetails').value.trim(),status:'Requested',date:new Date().toISOString()};returnRequests.unshift(req);o.returnStatus='Return requested';persist();toast('Return request submitted');location.hash='orders'}
function trackSavedOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;openModal(`<button class="icon-btn close" onclick="closeModal()">✕</button><div class="eyebrow">Order tracking</div><h3>${o.id}</h3><div class="order-card"><div class="order-top"><b>${o.id}</b><span class="order-status">${escapeHTML(o.status||'Placed')}</span></div><div class="order-lines">Placed ${new Date(o.date).toLocaleString()}<br>${escapeHTML(o.address||'')}</div></div><a class="btn full" href="#returns/${o.id}" onclick="closeModal()">Return / Exchange</a>`)}
function accountTab(tab){const c=document.getElementById('accountContent');if(tab==='orders')c.innerHTML=accountOrdersHTML();if(tab==='wishlist'){const list=products.filter(p=>wishlist.includes(p.id));c.innerHTML=`<div class="eyebrow">Saved styles</div><h2 class="serif" style="font-weight:400">Wishlist</h2><div class="products">${list.length?list.map(pc).join(''):'<p>Your wishlist is empty.</p>'}</div>`;safeImg()}if(tab==='address')c.innerHTML=`<div class="eyebrow">Saved delivery</div><h2 class="serif" style="font-weight:400">Address book</h2><div class="admin-form"><textarea id="acctAddr" rows="5" placeholder="Full address">${escapeHTML(profile.address||'')}</textarea><button class="btn" onclick="saveAddress()">Save address</button></div>`;if(tab==='profile')c.innerHTML=`<div class="eyebrow">Account details</div><h2 class="serif" style="font-weight:400">Profile</h2><div class="admin-form"><input id="editName" value="${escapeAttr(profile.name||'')}"><input id="editEmail" type="email" value="${escapeAttr(profile.email||'')}"><input id="editPhone" value="${escapeAttr(profile.phone||'')}"><button class="btn" onclick="updateProfile()">Save profile</button></div>`}
function adminPage(){if(sessionStorage.getItem('aehran_admin')!=='1')return `<section class="admin"><div class="wrap" style="max-width:600px"><div class="admin-main"><div class="eyebrow">Store Manager</div><h2 class="serif" style="font-weight:400">AEHRAN admin access</h2><p style="font-size:10px;color:var(--muted)">Manage products, orders and all configurable storefront settings from one place.</p><form class="loginform" onsubmit="adminLogin(event)"><input id="adminPin" type="password" required placeholder="Admin PIN"><button class="btn">Open Store Manager</button></form><p style="font-size:8px;color:var(--muted)">Default demo PIN: 2026. Change it in the source before publishing.</p></div></div></section>${footer()}`;return `<section class="admin"><div class="wrap"><div class="admin-shell"><aside class="admin-side"><div class="brand-mini">AEHRAN Manager</div><div class="eyebrow">CMS + store engine</div><button onclick="adminTab('dashboard')">Dashboard</button><button onclick="adminTab('settings')">Site Settings</button><button onclick="adminTab('orders')">Orders</button><button onclick="adminTab('inventory')">Inventory</button><button onclick="adminTab('products')">Add product</button><button onclick="adminTab('customers')">Customers</button><button onclick="adminLogout()">Lock manager</button></aside><div id="adminMain" class="admin-main">${adminDashboardHTML()}</div></div></div></section>`}
function adminDashboardHTML(){const revenue=orders.reduce((s,o)=>s+o.total,0),low=products.filter(p=>p.stock<10).length;return `<div class="eyebrow">Store overview</div><h2 class="serif" style="font-weight:400;margin-top:6px">Dashboard</h2><div class="stats"><div class="stat"><span>Orders</span><b>${orders.length}</b></div><div class="stat"><span>Revenue</span><b>${money(revenue)}</b></div><div class="stat"><span>Products</span><b>${products.length}</b></div><div class="stat"><span>Low stock</span><b>${low}</b></div></div><h3 class="serif" style="font-weight:400">Recent orders</h3>${orders.length?`<table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>${orders.slice().reverse().slice(0,8).map(o=>`<tr><td>${o.id}</td><td>${escapeHTML(o.name)}</td><td>${money(o.total)}</td><td>${o.status}</td></tr>`).join('')}</tbody></table>`:'<p style="font-size:10px;color:var(--muted)">No orders yet.</p>'}`}
function adminSettingsHTML(){
 const b=cms.branding||{},t=cms.theme||{},h={},seo=cms.seo||{},f=cms.footer||{},p=cms.policies||{},co=cms.checkout||{},po=cms.productOffers||{};
 const nav=Array.isArray(cms.nav)?cms.nav:[];
 return `<div class="eyebrow">CMS</div><h2 class="serif" style="font-weight:400">Site Settings</h2><p style="font-size:9px;color:var(--muted)">These controls write to the existing AEHRAN CMS object and Firebase/localStorage bridge. Saved values are not replaced by storefront defaults.</p>
 <div class="admin-grid">
 <div class="admin-form"><h3>Navigation</h3><p style="font-size:8px;color:var(--muted)">Edit labels, targets, desktop visibility, mobile visibility and order.</p><div id="adminNavRows">${nav.map((x,i)=>`<div class="admin-nav-row" data-index="${i}" style="display:grid;grid-template-columns:1fr 1fr 70px 70px 36px;gap:6px;margin-bottom:6px"><input class="an-label" value="${escapeAttr(x.label||'') }" placeholder="Label"><input class="an-target" value="${escapeAttr(x.target||'') }" placeholder="Target"><label style="font-size:8px"><input class="an-visible" type="checkbox" ${x.visible!==false?'checked':''}> Desktop</label><label style="font-size:8px"><input class="an-mobile" type="checkbox" ${x.mobileVisible!==false?'checked':''}> Mobile</label><button type="button" onclick="this.closest('.admin-nav-row').remove()">×</button></div>`).join('')}</div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn ghost" type="button" onclick="adminAddNavRow()">Add item</button><button class="btn" type="button" onclick="adminSaveNavigation()">Save navigation</button></div></div>
 <div class="admin-form"><h3>Branding</h3><input id="setBrandName" value="${escapeAttr(b.brandName||'')}" placeholder="Brand name"><input id="setTagline" value="${escapeAttr(b.tagline||'')}" placeholder="Tagline"><input id="setLogo" value="${escapeAttr(b.logo||'')}" placeholder="Round logo URL/path"><input id="setWordmark" value="${escapeAttr(b.wordmarkLogo||'')}" placeholder="Wordmark URL/path"><input id="setFooterLogo" value="${escapeAttr(b.footerLogo||'')}" placeholder="Footer logo URL/path"><input id="setWordmarkWidth" type="number" value="${Number(b.wordmarkWidth)||258}" placeholder="Wordmark width"><button class="btn" onclick="adminSaveBranding()">Save branding</button></div>
 <div class="admin-form"><h3>Theme</h3><div class="grid2"><input id="setNavy" value="${escapeAttr(t.navy||'')}" placeholder="Navy"><input id="setNavy2" value="${escapeAttr(t.navy2||'')}" placeholder="Navy 2"><input id="setNavy3" value="${escapeAttr(t.navy3||'')}" placeholder="Navy 3"><input id="setCream" value="${escapeAttr(t.cream||'')}" placeholder="Cream"><input id="setGold" value="${escapeAttr(t.gold||'')}" placeholder="Gold"><input id="setBg" value="${escapeAttr(t.background||'')}" placeholder="Background"></div><button class="btn" onclick="adminSaveTheme()">Save theme</button></div>
 <div class="admin-form"><h3>Hero</h3><input id="setHeroImage" value="${escapeAttr(h.image||'')}" placeholder="Hero image URL/path"><input id="setHeroLink" value="${escapeAttr(h.link||'new')}" placeholder="Hero target"><button class="btn" onclick="adminSaveHero()">Save hero</button></div>
 <div class="admin-form"><h3>SEO</h3><input id="setSeoTitle" value="${escapeAttr(seo.title||'')}" placeholder="Page title"><textarea id="setSeoDesc" rows="4" placeholder="Meta description">${escapeHTML(seo.description||'')}</textarea><button class="btn" onclick="adminSaveSEO()">Save SEO</button></div>
 <div class="admin-form"><h3>Footer</h3><input id="setNewsTitle" value="${escapeAttr(f.newsletterTitle||'')}" placeholder="Newsletter title"><textarea id="setNewsText" rows="3" placeholder="Newsletter text">${escapeHTML(f.newsletterText||'')}</textarea><textarea id="setAbout" rows="3" placeholder="Footer about">${escapeHTML(f.about||'')}</textarea><input id="setEmail" value="${escapeAttr(f.contactEmail||'')}" placeholder="Contact email"><input id="setInstagram" value="${escapeAttr(f.instagram||'')}" placeholder="Instagram"><input id="setCopyright" value="${escapeAttr(f.copyright||'')}" placeholder="Copyright"><button class="btn" onclick="adminSaveFooter()">Save footer</button></div>
 <div class="admin-form"><h3>Policies</h3><textarea id="setShipping" rows="3" placeholder="Shipping">${escapeHTML(p.shipping||'')}</textarea><textarea id="setReturns" rows="3" placeholder="Returns">${escapeHTML(p.returns||'')}</textarea><textarea id="setPrivacy" rows="3" placeholder="Privacy">${escapeHTML(p.privacy||'')}</textarea><textarea id="setTerms" rows="3" placeholder="Terms">${escapeHTML(p.terms||'')}</textarea><textarea id="setSize" rows="3" placeholder="Size guide">${escapeHTML(p.size||'')}</textarea><button class="btn" onclick="adminSavePolicies()">Save policies</button></div>
 <div class="admin-form"><h3>Checkout</h3><input id="setCheckoutTitle" value="${escapeAttr(co.title||'')}" placeholder="Checkout title"><input id="setShippingLabel" value="${escapeAttr(co.shippingLabel||'')}" placeholder="Shipping label"><input id="setOrderButton" value="${escapeAttr(co.orderButton||'')}" placeholder="Order button"><button class="btn" onclick="adminSaveCheckout()">Save checkout</button></div>
 <div class="admin-form"><h3>Offers</h3><label style="font-size:9px"><input id="setOffersEnabled" type="checkbox" ${po.enabled!==false?'checked':''}> Offers enabled</label><input id="setBundle2" type="number" value="${Number(po.bundle?.buy2Percent)||10}" placeholder="Buy 2 %"><input id="setBundle3" type="number" value="${Number(po.bundle?.buy3Percent)||15}" placeholder="Buy 3 %"><input id="setPrepaid" type="number" value="${Number(po.prepaid?.percent)||5}" placeholder="Prepaid %"><input id="setDeliveryMin" type="number" value="${Number(po.delivery?.minDays)||3}" placeholder="Delivery min days"><input id="setDeliveryMax" type="number" value="${Number(po.delivery?.maxDays)||7}" placeholder="Delivery max days"><button class="btn" onclick="adminSaveOffers()">Save offers</button></div>
 <div class="admin-form"><h3>Safe reset</h3><p style="font-size:8px;color:var(--muted)">Reset only the CMS configuration to the current defaults. Existing products, orders and customer data are not deleted.</p><button class="btn ghost" onclick="adminResetCMS()">Reset CMS settings</button></div>
 </div>`;
}
function adminPersistCMS(message='Settings saved'){try{localStorage.setItem('aehran_cms',JSON.stringify(cms));localStorage.setItem('aehran_last_update',String(Date.now()))}catch(e){};try{window.__aehranFirebasePushCMS?.(cms)}catch(e){};try{applyCMSStatic();window.__aehranApplyLatestAdminLayout?.()}catch(e){};toast(message)}
function adminAddNavRow(){const w=document.getElementById('adminNavRows');if(!w)return;w.insertAdjacentHTML('beforeend',`<div class="admin-nav-row" style="display:grid;grid-template-columns:1fr 1fr 70px 70px 36px;gap:6px;margin-bottom:6px"><input class="an-label" placeholder="Label"><input class="an-target" placeholder="Target"><label style="font-size:8px"><input class="an-visible" type="checkbox" checked> Desktop</label><label style="font-size:8px"><input class="an-mobile" type="checkbox" checked> Mobile</label><button type="button" onclick="this.closest('.admin-nav-row').remove()">×</button></div>`)}
function adminSaveNavigation(){const rows=[...(document.querySelectorAll('#adminNavRows .admin-nav-row'))];cms.nav=rows.map(r=>({label:r.querySelector('.an-label')?.value.trim()||'Untitled',target:r.querySelector('.an-target')?.value.trim()||'home',visible:!!r.querySelector('.an-visible')?.checked,mobileVisible:!!r.querySelector('.an-mobile')?.checked}));adminPersistCMS('Navigation saved')}
function adminSaveBranding(){cms.branding={...(cms.branding||{}),brandName:document.getElementById('setBrandName').value,tagline:document.getElementById('setTagline').value,logo:document.getElementById('setLogo').value,wordmarkLogo:document.getElementById('setWordmark').value,footerLogo:document.getElementById('setFooterLogo').value,wordmarkWidth:Number(document.getElementById('setWordmarkWidth').value)||258};adminPersistCMS('Branding saved')}
function adminSaveTheme(){cms.theme={...(cms.theme||{}),navy:document.getElementById('setNavy').value,navy2:document.getElementById('setNavy2').value,navy3:document.getElementById('setNavy3').value,cream:document.getElementById('setCream').value,gold:document.getElementById('setGold').value,background:document.getElementById('setBg').value};adminPersistCMS('Theme saved')}
function adminSaveSEO(){cms.seo={...(cms.seo||{}),title:document.getElementById('setSeoTitle').value,description:document.getElementById('setSeoDesc').value};adminPersistCMS('SEO saved')}
function adminSaveFooter(){cms.footer={...(cms.footer||{}),newsletterTitle:document.getElementById('setNewsTitle').value,newsletterText:document.getElementById('setNewsText').value,about:document.getElementById('setAbout').value,contactEmail:document.getElementById('setEmail').value,instagram:document.getElementById('setInstagram').value,copyright:document.getElementById('setCopyright').value};adminPersistCMS('Footer saved')}
function adminSavePolicies(){cms.policies={...(cms.policies||{}),shipping:document.getElementById('setShipping').value,returns:document.getElementById('setReturns').value,privacy:document.getElementById('setPrivacy').value,terms:document.getElementById('setTerms').value,size:document.getElementById('setSize').value};adminPersistCMS('Policies saved')}
function adminSaveCheckout(){cms.checkout={...(cms.checkout||{}),title:document.getElementById('setCheckoutTitle').value,shippingLabel:document.getElementById('setShippingLabel').value,orderButton:document.getElementById('setOrderButton').value};adminPersistCMS('Checkout saved')}
function adminSaveOffers(){cms.productOffers={...(cms.productOffers||{}),enabled:document.getElementById('setOffersEnabled').checked,bundle:{...(cms.productOffers?.bundle||{}),buy2Percent:Number(document.getElementById('setBundle2').value)||0,buy3Percent:Number(document.getElementById('setBundle3').value)||0},prepaid:{...(cms.productOffers?.prepaid||{}),percent:Number(document.getElementById('setPrepaid').value)||0},delivery:{...(cms.productOffers?.delivery||{}),minDays:Number(document.getElementById('setDeliveryMin').value)||0,maxDays:Number(document.getElementById('setDeliveryMax').value)||0}};adminPersistCMS('Offers saved')}
function adminResetCMS(){if(!confirm('Reset CMS settings to defaults? Products, orders and customers will not be deleted.'))return;cms=JSON.parse(JSON.stringify(DEFAULT_CMS_STOREFRONT));adminPersistCMS('CMS settings restored');adminTab('settings')}

function adminTab(tab){const m=document.getElementById('adminMain');if(tab==='settings')m.innerHTML=adminSettingsHTML();if(tab==='dashboard')m.innerHTML=adminDashboardHTML();if(tab==='orders')m.innerHTML=`<div class="eyebrow">Operations</div><h2 class="serif" style="font-weight:400">Orders</h2>${orders.length?`<table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>${orders.slice().reverse().map(o=>`<tr><td>${o.id}<br><small>${new Date(o.date).toLocaleDateString()}</small></td><td>${escapeHTML(o.name)}<br>${escapeHTML(o.email)}</td><td>${money(o.total)}</td><td>${o.payment}</td><td><select onchange="updateOrderStatus('${o.id}',this.value)">${['Placed','Confirmed','Packed','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`:'<p>No orders yet.</p>'}`;if(tab==='inventory')m.innerHTML=`<div class="eyebrow">Catalogue</div><h2 class="serif" style="font-weight:400">Inventory</h2><table class="admin-table"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Category</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.name}</td><td><input type="number" value="${p.price}" onchange="editProduct('${p.id}','price',this.value)"></td><td><input type="number" value="${p.stock}" onchange="editProduct('${p.id}','stock',this.value)"></td><td>${p.cat}</td><td><button onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`;if(tab==='products')m.innerHTML=`<div class="eyebrow">Catalogue</div><h2 class="serif" style="font-weight:400">Add a product</h2><div class="admin-grid"><form class="admin-form" onsubmit="addProductAdmin(event)"><h3>Product details</h3><input id="npName" required placeholder="Product name"><select id="npCat"><option value="kurta">Kurta</option><option value="jacket">Jacket</option><option value="sherwani">Sherwani</option><option value="kids">Kids</option><option value="wedding">Wedding</option><option value="minimal">Minimal</option></select><input id="npPrice" required type="number" placeholder="Price"><input id="npOld" required type="number" placeholder="MRP"><input id="npStock" required type="number" placeholder="Stock"><input id="npColor" placeholder="Colour"><input id="npTag" placeholder="Tag"><input id="npImage" required placeholder="Image URL"><textarea id="npDesc" rows="4" placeholder="Description"></textarea><button class="btn">Add product</button></form><div class="admin-form"><h3>Store notes</h3><p style="font-size:9px;color:var(--muted);line-height:1.8">Products added here are saved in this browser. For a live multi-device store, connect the same catalogue fields to Firebase, Supabase, Shopify or your own API.</p><button class="btn ghost" onclick="resetCatalogue()">Reset demo catalogue</button></div></div>`;if(tab==='customers'){const customers=[...new Map(orders.map(o=>[o.email,o])).values()];m.innerHTML=`<div class="eyebrow">CRM</div><h2 class="serif" style="font-weight:400">Customers</h2>${customers.length?`<table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Last order</th></tr></thead><tbody>${customers.map(c=>`<tr><td>${escapeHTML(c.name)}</td><td>${escapeHTML(c.email)}</td><td>${escapeHTML(c.phone)}</td><td>${c.id}</td></tr>`).join('')}</tbody></table>`:'<p style="font-size:10px;color:var(--muted)">No customer orders yet.</p>'}`}}
function route(){refreshBridge();window.scrollTo(0,0);closeCart();closeModal();const hash=location.hash||'#home';let html;if(hash.startsWith('#product=')){const rawId=hash.slice('#product='.length);let id=rawId;try{id=decodeURIComponent(rawId)}catch(e){}const p=products.find(x=>String(x.id)===String(id));if(!p){html=home()}else{try{html=productPage(p)}catch(err){console.error('AEHRAN product page render failed',err);html=`<section class="page"><div class="wrap"><div class="ae-empty-state"><h2>Unable to open this product</h2><p>Please refresh and try again.</p><a class="btn" href="#collection/all">Continue shopping</a></div></div></section>`}}}else if(hash.startsWith('#collection/'))html=collection(hash.split('/')[1]);else if(hash==='#checkout')html=checkout();else if(hash==='#account')html=accountPage();else if(hash==='#orders')html=orderHistoryPage();else if(hash==='#returns')html=returnOrderPage();else if(hash.startsWith('#returns/'))html=returnOrderPage(hash.split('/')[1]);else if(hash==='#admin')html=adminPage();else html=home();const app=document.getElementById('app');if(app)app.innerHTML=html;applyCMSStatic();syncBadges();safeImg()}

function goProduct(id){const pid=String(id||'').trim();if(!pid)return;const target='product='+encodeURIComponent(pid);if(location.hash===('#'+target)){route();return}location.hash=target}window.addEventListener('hashchange',route);
function chooseSize(el,s){selectedSize=String(s||'');const scope=el?.closest?.('.pinfo')||document;scope.querySelectorAll('.sizes .size').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});el.classList.add('active');el.setAttribute('aria-pressed','true');el.dataset.selected='true';const pId=location.hash.startsWith('#product=')?decodeURIComponent(location.hash.slice(9)):' ';const p=products.find(x=>String(x.id)===String(pId));const variants=Array.isArray(p?.sizeVariants)?p.sizeVariants:(Array.isArray(p?.variants)?p.variants:[]);const v=variants.find(x=>String(x.size||x.name||x.variantSize||'')===selectedSize);if(v){const priceEl=scope.querySelector('[data-pdp-price]');if(priceEl&&Number.isFinite(Number(v.price)))priceEl.textContent=money(Number(v.price));const stockEl=scope.querySelector('[data-pdp-stock]');if(stockEl&&v.stock!=null)stockEl.textContent=Number(v.stock)>0?`${Number(v.stock)} left`:'Out of stock';if(v.stock!=null)el.disabled=Number(v.stock)<=0;document.dispatchEvent(new CustomEvent('aehran:sizechange',{detail:{productId:pId,size:selectedSize,variant:v}}));return}document.dispatchEvent(new CustomEvent('aehran:sizechange',{detail:{productId:pId,size:selectedSize}}))}
function chooseColor(el,c){selectedColor=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));el.classList.add('active');const l=document.getElementById('colorLabel');if(l)l.textContent=c}
function colorMap(c){return {Ivory:'#e9e2d5',Rose:'#b47a78',Mustard:'#c29b31',Black:'#252525',Sage:'#9aa18d',Garnet:'#702f36',Marigold:'#d4a430',Sand:'#b9a58f',Midnight:'#18212c',Rust:'#8c4d36','Antique Gold':'#ae9468','Royal Blue':'#233e65',Cream:'#e6dfcf',Olive:'#6f7359',Yellow:'#d4ad35'}[c]||'#d7cfc4'}
function chooseFatherSize(el,s){selectedFatherSize=s;document.querySelectorAll('.combo-father').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function chooseSonSize(el,s){selectedSonSize=s;document.querySelectorAll('.combo-son').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
document.addEventListener('click',function(e){const b=e.target.closest?.('.pinfo .sizes .size[data-size]');if(!b)return;e.preventDefault();e.stopPropagation();chooseSize(b,b.dataset.size)},true);function addCart(id){const p=products.find(x=>x.id===id);if(!p)return;if(p.stock<1){toast('This style is currently out of stock');return}if(p.isCombo&&(!selectedFatherSize||!selectedSonSize)){toast('Please select both Father Size and Son Size');return}const e=cart.find(x=>x.id===id&&x.size===selectedSize&&x.color===selectedColor&&x.fatherSize===selectedFatherSize&&x.sonSize===selectedSonSize);if(e)e.qty++;else cart.push({...p,qty:1,size:p.isCombo?'Combo':selectedSize,color:selectedColor,fatherSize:p.isCombo?selectedFatherSize:'',sonSize:p.isCombo?selectedSonSize:''});persist();syncBadges();toast('Added to your bag')}
function buyNow(id){addCart(id);location.hash='checkout'}
function syncBadges(){const n=cart.reduce((s,x)=>s+x.qty,0),cb=document.getElementById('cartBadge'),wb=document.getElementById('wishBadge');if(cb){cb.textContent=n;cb.classList.toggle('hide',!n)}if(wb){wb.textContent=wishlist.length;wb.classList.toggle('hide',!wishlist.length)}}
function toggleWish(id,el){wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];persist();syncBadges();if(el){el.classList.toggle('active');el.querySelector('svg')?.setAttribute('fill',el.classList.contains('active')?'currentColor':'none')}toast(wishlist.includes(id)?'Saved to wishlist':'Removed from wishlist')}
function showWishlist(){if(!wishlist.length){toast('Your wishlist is empty');return}const list=products.filter(p=>wishlist.includes(p.id));openModal(`<button class="icon-btn close" onclick="closeModal()">✕</button><h3>Your Wishlist</h3><p>${list.length} saved style${list.length>1?'s':''}</p><div class="modal-menu">${list.map(p=>`<a href="#product=${p.id}" onclick="closeModal()"><span>${p.name}</span><b>${money(p.price)}</b></a>`).join('')}</div>`)}
function openCart(){document.getElementById('cartWrap').classList.add('open');renderCart()}function closeCart(){document.getElementById('cartWrap').classList.remove('open')}
function renderCart(){const body=document.getElementById('cartBody'),foot=document.getElementById('cartFoot');if(!cart.length){body.innerHTML='<div class="empty">Your bag is empty.<br><br><a href="#collection/new" onclick="closeCart()" class="text-link">Shop new arrivals</a></div>';foot.innerHTML='';return}body.innerHTML=cart.map((x,i)=>`<div class="cart-row"><img src="${x.img}"><div><h4>${x.name}</h4><small>${x.isCombo?`Father Size: ${x.fatherSize||'—'} · Son Size: ${x.sonSize||'—'}`:`Size ${x.size||'—'}`} · ${x.color||''}</small><div class="qty"><button onclick="qty(${i},-1)">−</button><span>${x.qty}</span><button onclick="qty(${i},1)">+</button></div></div><div><b style="font-size:10px">${money(x.price*x.qty)}</b><button class="icon-btn" style="width:30px;height:30px;margin-top:36px" onclick="removeCart(${i})">×</button></div></div>`).join('');const ct=totals();foot.innerHTML=`<div class="cart-gst-summary">${totalsHTML(ct)}</div><a class="btn full" href="#checkout" onclick="closeCart()">Secure checkout</a>`;safeImg()}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);persist();syncBadges();renderCart()}function removeCart(i){cart.splice(i,1);persist();syncBadges();renderCart()}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalWrap').classList.add('open')}function closeModal(){document.getElementById('modalWrap').classList.remove('open')}
function renderMobileMenu(){const nav=Array.isArray(cms?.nav)?cms.nav.filter(x=>x&&x.visible!==false):[];const primaryTargets=new Set(['home','new','wedding','minimal','sale']);const primary=nav.filter(x=>x.mobileVisible!==false&&primaryTargets.has(String(x.target||'')));const secondary=nav.filter(x=>!primaryTargets.has(String(x.target||'')) && x.visible!==false);const link=x=>{const t=String(x.target||'home'),href=t==='home'?'#home':'#collection/'+t;return `<a class="mobile-menu-link" href="${escapeAttr(href)}" onclick="closeMobileMenu()"><span>${escapeHTML(x.label||t)}</span><span>›</span></a>`};const p=document.getElementById('mobilePrimaryNav'),q=document.getElementById('mobileSecondaryNav');if(p)p.innerHTML=primary.map(link).join('');if(q)q.innerHTML=secondary.length?secondary.map(link).join(''):'<div class="mobile-menu-empty">More categories will appear here from your saved navigation.</div>'}

async function aeHandleSecureOrderResult(result){const order=result?.order;if(!order)return;orders.push(order);if(Array.isArray(order.items)){order.items.forEach(it=>{const p=products.find(p=>String(p.id)===String(it.id));if(p)p.stock=Math.max(0,p.stock-Number(it.qty||0))})}if(document.getElementById('saveAddr')?.checked){profile=profile||{name:order.name,email:order.email,phone:order.phone};profile.address=order.address;profile.addressArea=order.addressArea||'';profile.city=order.city||'';profile.state=order.state||'';profile.pincode=order.pincode||'';profile.addressType=order.addressType||document.querySelector('input[name="addrtype"]:checked')?.value||'Home'}cart=[];coupon=null;persist();syncBadges();openModal(`<div class="order-success"><div class="success-pop"><div class="success-mark"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="success-circle" cx="50" cy="50" r="41"></circle><path class="success-check" d="M29 51.5 43.5 66 72 36"></path></svg></div></div><div class="eyebrow">Order confirmed</div><h3>Thank you, ${escapeHTML(order.name||'Customer')}.</h3><div class="order-id-pill">${escapeHTML(order.id)}</div><p>Your order is confirmed. GST and the final payable amount have been saved with this order.</p><div class="modal-menu"><a href="#orders" onclick="closeModal()"><span>View Order History</span><span>→</span></a><a href="#home" onclick="closeModal()"><span>Continue shopping</span><span>→</span></a></div></div>`)}
function aeSecurePayload(){return {cart:cart.map(x=>({id:x.id,qty:x.qty,size:x.size||'',color:x.color||'',fatherSize:x.fatherSize||'',sonSize:x.sonSize||''})),couponCode:coupon?.code||'',paymentMethod:document.querySelector('input[name="pay"]:checked')?.value||'COD',customer:{name:document.getElementById('name')?.value||'',email:document.getElementById('email')?.value||'',phone:document.getElementById('phone')?.value||'',address:document.getElementById('address')?.value||'',addressArea:document.getElementById('addressArea')?.value||'',city:document.getElementById('city')?.value||'',state:document.getElementById('state')?.value||'',pincode:document.getElementById('pincode')?.value||'',addressType:document.querySelector('input[name="addrtype"]:checked')?.value||'Home'}}}
async function placeOrder(){const ids=['name','phone','email','address','addressArea','city','pincode','state'];for(const id of ids){const el=document.getElementById(id);if(!el?.value?.trim()){el?.focus();toast('Please complete your delivery details');return}}const phone=document.getElementById('phone').value.replace(/\D/g,'');if(!/^\d{10}$/.test(phone)){toast('Enter a valid 10-digit mobile number');return}if(!/^\d{6}$/.test(document.getElementById('pincode').value)){toast('Enter a valid 6-digit pincode');return}if(!cart.length)return toast('Your bag is empty');const selected=document.querySelector('input[name="pay"]:checked')?.value||'COD';const payload=aeSecurePayload();try{if(!window.__aehranSecureReady){toast('Secure checkout is still loading. Please try again.');return}if(selected==='COD'){const result=await window.__aehranCreateCodOrder(payload);await aeHandleSecureOrderResult(result);return}const result=await window.__aehranCreateRazorpayOrder(payload);if(!result?.orderId||!result?.amount){toast('Secure payment order could not be created');return}if(typeof Razorpay==='undefined'){toast('Payment gateway could not load');return}const rz=new Razorpay({key:result.keyId,amount:result.amount,currency:result.currency||'INR',name:cms.branding?.brandName||'AEHRAN',description:'AEHRAN order payment',order_id:result.orderId,prefill:{name:payload.customer.name,email:payload.customer.email,contact:phone},notes:{source:'AEHRAN Storefront',gstRate:String(result.calculation?.gstRate??''),gstAmount:String(result.calculation?.gstAmount??'')},theme:{color:'#0c1825'},handler:async function(resp){try{const verified=await window.__aehranVerifyRazorpayPayment({...payload,razorpayOrderId:resp.razorpay_order_id||result.orderId,razorpayPaymentId:resp.razorpay_payment_id||'',razorpaySignature:resp.razorpay_signature||''});await aeHandleSecureOrderResult(verified)}catch(e){console.error(e);toast(e?.message||'Payment verification failed. Your order was not created.')}}});rz.on('payment.failed',function(){toast('Payment was not completed. You can retry checkout safely.')});rz.open()}catch(e){console.error(e);toast(e?.message||'Secure checkout failed. Please try again.')}}
function trackOrderModal(){openModal(`<button class="icon-btn close" onclick="closeModal()">✕</button><div class="eyebrow">Order tracking</div><h3>Track your AEHRAN order</h3><form class="loginform" onsubmit="trackOrder(event)"><input id="trackId" required placeholder="Order ID e.g. AHR123456"><button class="btn">Track order</button></form><div id="trackResult"></div>`)}

route();

<script>
(function(){
  /* Normalize audience/category data so kids never leak into Men's Kurta Sets. */
  function classifyClientProduct(p){
    const name=String(p.name||'').toLowerCase();
    const id=String(p.id||'').toLowerCase();
    const cols=Array.isArray(p.collections)?p.collections:[];
    const isKids=p.cat==='kids'||cols.includes('kids')||id.startsWith('kids-');
    const isKidsJacket=isKids&&(cols.includes('kids-jacket')||/jacket|nehru|brocade/.test(name));
    const isKidsKurta=isKids&&!isKidsJacket;
    const isMenJacket=!isKids&&(p.cat==='jacket'||cols.includes('jacket'));
    return {isKids,isKidsJacket,isKidsKurta,isMenJacket};
  }

  products.forEach(p=>{
    if(!Array.isArray(p.collections))p.collections=[];
    const c=classifyClientProduct(p);
    if(c.isKids){
      p.collections=p.collections.filter(x=>x!=='men'&&x!=='men-jacket');
      if(!p.collections.includes('kids'))p.collections.push('kids');
      const specific=c.isKidsJacket?'kids-jacket':'kids-kurta';
      if(!p.collections.includes(specific))p.collections.push(specific);
      if(c.isKidsJacket&&!p.collections.includes('jacket'))p.collections.push('jacket');
    }else if(c.isMenJacket){
      if(!p.collections.includes('men'))p.collections.push('men');
      if(!p.collections.includes('men-jacket'))p.collections.push('men-jacket');
      if(!p.collections.includes('jacket'))p.collections.push('jacket');
    }
  });
  try{localStorage.setItem('aehran_products',JSON.stringify(products))}catch(e){}

  const originalCategoryMatch=categoryMatch;
  categoryMatch=function(p,type){
    const c=classifyClientProduct(p);
    const cols=Array.isArray(p.collections)?p.collections:[];
    if(type==='kids') return c.isKids;
    if(type==='kids-kurta') return c.isKidsKurta;
    if(type==='kids-jacket') return c.isKidsJacket;
    if(type==='men-jacket') return c.isMenJacket;
    /* Main Jackets page deliberately contains both men's and kids' jackets. */
    if(type==='jacket') return c.isMenJacket||c.isKidsJacket;
    /* Keep Wedding populated with proper wedding-ready men's and kids' products. */
    if(type==='wedding') return cols.includes('wedding')||['wedding','sherwani','jacket'].includes(p.cat)||c.isKidsJacket;
    if(type==='men'&&c.isKids) return false;
    if(type==='kurta'&&c.isKids) return false;
    return originalCategoryMatch(p,type);
  };

  const originalCollection=collection;
  collection=function(type){
    let html=originalCollection(type);
    let switcher='';
    if(type==='jacket'){
      html=html.replace(/Kurta Jacket Sets/g,'Jackets — Men & Kids');
      switcher='<div class="client-cat-switch"><a class="active" href="#collection/jacket">All Jackets</a><a href="#collection/men-jacket">Men Jackets</a><a href="#collection/kids-jacket">Kids Jackets</a></div><div class="client-collection-note">This section now includes both men’s jacket sets and kids’ Nehru jacket sets, as requested.</div>';
    }else if(type==='men-jacket'){
      html=html.replace(/>Collection</g,'>Men Jackets<').replace(/\/ Collection</g,'/ Men Jackets<');
      switcher='<div class="client-cat-switch"><a href="#collection/jacket">All Jackets</a><a class="active" href="#collection/men-jacket">Men Jackets</a><a href="#collection/kids-jacket">Kids Jackets</a></div>';
    }else if(type==='kids-jacket'){
      html=html.replace(/>Collection</g,'>Kids Jackets<').replace(/\/ Collection</g,'/ Kids Jackets<');
      switcher='<div class="client-cat-switch"><a href="#collection/kids-kurta">Kids Kurta Sets</a><a class="active" href="#collection/kids-jacket">Kids Jackets</a></div>';
    }else if(type==='kids-kurta'){
      html=html.replace(/>Collection</g,'>Kids Kurta Sets<').replace(/\/ Collection</g,'/ Kids Kurta Sets<');
      switcher='<div class="client-cat-switch"><a class="active" href="#collection/kids-kurta">Kids Kurta Sets</a><a href="#collection/kids-jacket">Kids Jackets</a></div><div class="client-collection-note">Only kids’ kurta sets appear here — no men’s products are mixed into this collection.</div>';
    }else if(type==='kids'){
      switcher='<div class="client-cat-switch"><a href="#collection/kids-kurta">Kids Kurta Sets</a><a href="#collection/kids-jacket">Kids Jackets</a></div>';
    }else if(type==='wedding'){
      switcher='<div class="client-cat-switch"><a class="active" href="#collection/wedding">Wedding Edit</a><a href="#collection/jacket">Jackets</a><a href="#collection/sherwani">Sherwanis</a><a href="#collection/kids-jacket">Kids Wedding Jackets</a></div>';
    }
    if(switcher) html=html.replace('<div class="collection-tools">',switcher+'<div class="collection-tools">');
    return html;
  };

  function clientPatchNav(){
    document.querySelectorAll('.nav-item').forEach(item=>{
      const top=item.querySelector(':scope > a');
      const label=(top?.textContent||'').trim().toLowerCase();
      if(label==='kids'){
        const links=[...item.querySelectorAll('.mega a')];
        const kurta=links.find(a=>a.textContent.trim().toLowerCase()==='kurta sets');
        const jacket=links.find(a=>a.textContent.trim().toLowerCase()==='nehru jacket sets');
        if(kurta)kurta.href='#collection/kids-kurta';
        if(jacket)jacket.href='#collection/kids-jacket';
      }
    });
  }
  const originalApplyCMSStatic=applyCMSStatic;
  applyCMSStatic=function(){originalApplyCMSStatic();clientPatchNav()};

  let aehranBannerAutoplaySeconds=Math.max(1,Math.min(20,Number(localStorage.getItem('aehran_banner_manager_v2_settings')?JSON.parse(localStorage.getItem('aehran_banner_manager_v2_settings')).autoplaySeconds:3)||3));
  function applyBannerAutoplaySettings(cfg){
    const n=Math.max(1,Math.min(20,Math.round(Number(cfg?.autoplaySeconds)||3)));
    aehranBannerAutoplaySeconds=n;
    try{localStorage.setItem('aehran_banner_manager_v2_settings',JSON.stringify({autoplaySeconds:n}))}catch(e){}
    startClientHeroTimer();
  }
  function startClientHeroTimer(){
    if(window.__aehranClientSliderTimer)clearInterval(window.__aehranClientSliderTimer);
    const root=document.getElementById('clientHeroSlider');
    if(root&&Number(root.dataset.count||0)>1){
      window.__aehranClientSliderTimer=setInterval(()=>{const r=document.getElementById('clientHeroSlider');if(r&&Number(r.dataset.count||0)>1)clientHeroMove(1)},aehranBannerAutoplaySeconds*1000);
    }else window.__aehranClientSliderTimer=null;
  }

  function clientHeroSlides(){
    const mobile=!!(window.matchMedia&&window.matchMedia('(max-width: 850px)').matches);
    const target=mobile?'mobile':'desktop';
    return (Array.isArray(aehranBannerManager)?aehranBannerManager:[]).filter(b=>b&&b.active!==false&&b.deviceTarget===target&&String(b.image||'').trim()).sort((a,b)=>Number(a.order||0)-Number(b.order||0)).map((b,i)=>({
      id:b.id,image:b.image,deviceTarget:b.deviceTarget,link:b.link||'new',label:b.label||`Banner ${i+1}`
    }));
  }
  function clientHeroHTML(){
    const slides=clientHeroSlides();
    if(!slides.length)return '';
    const many=slides.length>1;
    const slideHTML=slides.map((b,i)=>`<div class="client-hero-slide ${i===0?'active':''}" data-index="${i}" data-link="${escapeAttr(b.link)}"><div class="client-hero-skeleton" aria-hidden="true"></div><a href="#collection/${escapeAttr(b.link)}" aria-label="${escapeAttr(b.label)}"><img src="${escapeAttr(b.image)}" alt="${escapeAttr(b.label)}" width="1920" height="853" loading="${i===0?'eager':'lazy'}" decoding="async" fetchpriority="${i===0?'high':'auto'}" onerror="this.onerror=null;this.closest('.client-hero-slide')?.classList.add('banner-image-failed');this.style.display='none'" onload="this.closest('.client-hero-slide')?.classList.add('loaded')"></a></div>`).join('');
    const controls=many?`<button type="button" class="client-hero-arrow client-hero-prev" onclick="event.stopPropagation();clientHeroMove(-1)" aria-label="Previous banner">‹</button><button type="button" class="client-hero-arrow client-hero-next" onclick="event.stopPropagation();clientHeroMove(1)" aria-label="Next banner">›</button><div class="client-hero-nav">${slides.map((_,i)=>`<button type="button" class="client-hero-dot ${i===0?'active':''}" onclick="event.stopPropagation();clientHeroGo(${i})" aria-label="Banner ${i+1}"></button>`).join('')}</div>`:'';
    return `<section class="hero-user client-hero-slider" id="clientHeroSlider" aria-label="AEHRAN banner slider" data-count="${slides.length}" data-device="${slides[0].deviceTarget}">${slideHTML}${controls}</section>`;
  }
  function clientHeroPreload(){
    const first=clientHeroSlides()[0];if(!first)return;
    const key='aehran-banner-v2-preload-'+first.id;
    if(document.querySelector(`link[data-aehran-banner-preload="${CSS.escape(key)}"]`))return;
    const l=document.createElement('link');l.rel='preload';l.as='image';l.href=first.image;l.setAttribute('data-aehran-banner-preload',key);document.head.appendChild(l);
  }
  const originalHome=home;
  home=function(){
    let html=originalHome();
    return html.replace(/<section class="hero-user"[^>]*>[\s\S]*?<\/section>/,clientHeroHTML());
  };

  function applyClientHeroArtDirection(){clientHeroPreload();}
  window.clientHeroGo=function(index){
    const root=document.getElementById('clientHeroSlider');if(!root)return;
    const slides=[...root.querySelectorAll('.client-hero-slide')],dots=[...root.querySelectorAll('.client-hero-dot')];
    if(slides.length<2)return;
    index=(index+slides.length)%slides.length;
    slides.forEach((x,i)=>x.classList.toggle('active',i===index));
    dots.forEach((x,i)=>x.classList.toggle('active',i===index));
    const active=slides[index],link=active?.querySelector?.('img')?.getAttribute('data-link');
    root.dataset.current=String(index);
  };
  window.clientHeroMove=function(dir){
    const root=document.getElementById('clientHeroSlider');if(!root)return;
    const now=Number(root.dataset.current||0);clientHeroGo(now+dir);
  };
  startClientHeroTimer();

  /* Re-render now so the current page immediately receives the client changes. */
  clientHeroPreload();
  route();
  setTimeout(watchClientHeroArtDirection,0);
  window.addEventListener('resize',()=>setTimeout(applyClientHeroArtDirection,50),{passive:true});
})();
</script>

<script>
(function(){
  /* Add actual Men/Kids jacket shortcuts under the Jackets navigation item. */
  function aehranPatchJacketNav(){
    document.querySelectorAll('.nav-item').forEach(item=>{
      const top=item.querySelector(':scope > a');
      if((top?.textContent||'').trim().toLowerCase()==='jackets'){
        item.classList.add('jacket-nav-parent');
        if(!item.querySelector('.jacket-subnav')){
          item.insertAdjacentHTML('beforeend','<div class="jacket-subnav"><a href="#collection/men-jacket">Men\'s Jackets</a><a href="#collection/kids-jacket">Kids\' Jackets</a></div>');
        }
      }
    });
  }

  /* Replace decorative colour choices on kids PDPs with the real linked variants. */
  const aehranBaseProductPage=productPage;
  productPage=function(p){
    let html=aehranBaseProductPage(p);
    if(p&&p.audience==='kids'){
      const variants=Array.isArray(p.colorVariants)&&p.colorVariants.length?p.colorVariants:[{id:p.id,color:p.color,hex:'#d7d0c8'}];
      const variantHTML=`<div class="option-head"><span>Colour — <b id="colorLabel">${escapeHTML(p.color||'')}</b></span></div><div class="aehran-variant-row">${variants.map(v=>`<a class="aehran-variant-choice ${v.id===p.id?'active':''}" href="#product=${escapeAttr(v.id)}" title="${escapeAttr(v.color)}"><i class="aehran-variant-dot" style="background:${escapeAttr(v.hex||'#d7d0c8')}"></i><span>${escapeHTML(v.color)}</span></a>`).join('')}</div><div class="option-head"><span>Select size</span>`;
      html=html.replace(/<div class="option-head"><span>Colour —[\s\S]*?<div class="option-head"><span>Select size<\/span>/,variantHTML);
    }
    return html;
  };

  /* Touch swipe support for the hero slider (mobile). */
  let touchX=0,touchY=0,touchActive=false;
  document.addEventListener('touchstart',e=>{
    const root=e.target.closest&&e.target.closest('#clientHeroSlider');
    if(!root||!e.touches||!e.touches[0])return;
    touchActive=true;touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!touchActive)return;
    touchActive=false;
    const t=e.changedTouches&&e.changedTouches[0];if(!t)return;
    const dx=t.clientX-touchX,dy=t.clientY-touchY;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.15){
      if(typeof clientHeroMove==='function')clientHeroMove(dx<0?1:-1);
    }
  },{passive:true});

  /* Ensure navigation and banner content are applied after every route render. */
  const finalRoute=route;
  route=function(){
    finalRoute();
    requestAnimationFrame(aehranPatchJacketNav);
  };
  route();
})();
</script>

const safe=s=>String(s).replace(/[.#$\[\]/]/g,'_');

  if(typeof v==='string'){
    if(v.startsWith('data:image/')||v.startsWith('blob:')||v.includes('firebasestorage.googleapis.com'))return '';

  if(!b)throw new Error('Storefront bridge missing');
  const listen=(path,makePatch)=>onValue(ref(db,`${ROOT}/${path}`),snap=>{

    const save=photo=>{const r={name:aeText(document.getElementById('rvName')?.value),title:aeText(document.getElementById('rvTitle')?.value),text:aeText(document.getElementById('rvText')?.value),stars:Math.max(1,Math.min(5,Number(document.getElementById('rvStars')?.value)||5)),photo:photo||'',date:new Date().toISOString()};reviewsDB[id]=[...(reviewsDB[id]||[]),r];persist();window.__aehranFirebasePushReview?.(id,reviewsDB[id]);toast('Review submitted');route()};
    if(!file){save('');return}
    if(!file.type.startsWith('image/')){toast('Please choose an image file.');return}
    if(file.size>1.5*1024*1024){toast('Review photo must be under 1.5 MB.');return}
    const reader=new FileReader();reader.onload=()=>save(String(reader.result||''));reader.onerror=()=>toast('Could not read that photo.');reader.readAsDataURL(file);
  };

<script id="aehran-extra-category-links-js">
(function(){
  try{
    /* Keep both new storefront shortcuts available even when the existing CMS data predates them. */
    const ensureCircles=obj=>{
      if(!obj||typeof obj!=='object')return;
      obj.home=obj.home||{};
      obj.home.circles=Array.isArray(obj.home.circles)?obj.home.circles:[];
      const extras=[
        {label:'Boys Kurta Set',target:'kids-kurta',image:''},
        {label:'Waistcoat',target:'waistcoat-sets',image:''}
      ];
      extras.forEach(x=>{if(!obj.home.circles.some(c=>c&&c.target===x.target))obj.home.circles.push(x);});
    };
    ensureCircles(DEFAULT_CMS_STOREFRONT);
    ensureCircles(cms);
    try{localStorage.setItem('aehran_cms',JSON.stringify(cms))}catch(e){}

    /* The storefront already routes #collection/... to collection(), including these two slugs.
       This adds a small guard so any future CMS nav item cannot lose its collection destination. */
    function normalizeNav(){
      if(!Array.isArray(cms?.nav))return;
      cms.nav.forEach(item=>{
        if(!item||typeof item!=='object')return;
        if(item.target==='waistcoat-sets'&&!item.label)item.label='Waistcoat';
        if(item.target==='father-son'&&!item.label)item.label='Father & Son';
      });
    }

    /* Ensure category clicks always land on the correct collection page. */
    document.addEventListener('click',function(e){
      const a=e.target.closest?.('a[href^="#collection/"]');
      if(!a)return;
      const raw=a.getAttribute('href')||'';
      const target=raw.split('/')[1]||'';
      const allowed=['new','men','kids','kurta','kids-kurta','jacket','men-jacket','kids-jacket','sherwani','wedding','minimal','sale','haldi','sangeet','reception','festive','indowestern','groom','groomsman','father','father-son','brother','ready','waistcoat-sets','nehru-jackets','kurta-pajama','coat-pant'];
      if(allowed.includes(target))return;
      /* Unknown category targets intentionally fall back to All styles rather than dead-linking. */
      if(raw!=='#collection/all')a.setAttribute('href','#collection/all');
    },true);

    /* Re-run the CMS renderer once so the two new circle shortcuts are used immediately. */
    if(typeof applyCMSStatic==='function')applyCMSStatic();
  }catch(e){console.warn('AEHRAN extra storefront category patch',e)}
})();

<script id="aehran-navigation-context-scroll-fix-v2-js">
(function(){
  const routeForLabel=function(label,fallback){
    const v=String(label||'').trim().toLowerCase().replace(/[’']/g,"'").replace(/&/g,' and ').replace(/\s+/g,' ').trim();
    const map=[
      [['home','homepage','home page'],'home'],[['new','new arrivals','new arrival'],'new'],[['men','mens','men collection'],'men'],[['kids','kids collection','children'],'kids'],
      [["men's kurta sets",'mens kurta sets','kurta sets','kurta set'],'kurta'],[['kids kurta sets','boys kurta set','boys kurta sets','kids kurta set'],'kids-kurta'],
      [['jacket sets','jackets','jacket'],'jacket'],[["men's jackets",'mens jackets','men jackets'],'men-jacket'],[["kids' jackets",'kids jackets','kids jacket'],'kids-jacket'],
      [['sherwanis','sherwani'],'sherwani'],[['wedding','weddings','wedding edit'],'wedding'],[['collections','collections / minimal','minimal','minimal edit'],'minimal'],[['sale','sale edit'],'sale'],
      [['haldi','haldi edit'],'haldi'],[['sangeet','sangeet edit'],'sangeet'],[['reception','reception edit'],'reception'],[['festive','festive edit'],'festive'],[['indo-western','indo western'],'indowestern'],
      [['groom','groom edit'],'groom'],[['groomsman','groomsman edit'],'groomsman'],[['father edit','father'],'father'],[['father & son','father and son','father & son matching','father and son matching'],'father-son'],
      [['brother edit','brother'],'brother'],[['ready to ship','ready'],'ready'],[['nehru jackets','nehru jacket'],'nehru-jackets'],[['kurta pajama','kurta-pajama'],'kurta-pajama'],[['coat-pant','coat pant'],'coat-pant'],
      [['waistcoat','waistcoats','waistcoat sets','men waistcoat sets'],'waistcoat-sets']
    ];
    for(const [names,target] of map)if(names.includes(v))return target;
    return fallback||'';
  };
  const repairCmsNav=function(){
    if(!Array.isArray(cms?.nav))return;
    let changed=false;
    cms.nav.forEach(x=>{const t=routeForLabel(x?.label,x?.target||'');if(t&&t!==x.target){x.target=t;changed=true}});
    if(changed)try{localStorage.setItem('aehran_cms',JSON.stringify(cms))}catch(e){}
  };
  const updateArrow=function(){
    const row=document.getElementById('homeCircleRow'),btn=document.getElementById('circleScrollNext');
    if(!row||!btn)return;
    const overflowing=row.scrollWidth-row.clientWidth>4;
    const atEnd=row.scrollLeft+row.clientWidth>=row.scrollWidth-5;
    btn.hidden=!overflowing||atEnd;
  };
  window.scrollCircleStrip=function(dir){
    const row=document.getElementById('homeCircleRow');if(!row)return;
    row.scrollBy({left:(Number(dir)||1)*Math.max(210,Math.round(row.clientWidth*.62)),behavior:'smooth'});
    setTimeout(updateArrow,450);
  };
  const originalApply=applyCMSStatic;
  applyCMSStatic=function(){repairCmsNav();const r=originalApply.apply(this,arguments);setTimeout(updateArrow,0);return r};
  document.addEventListener('click',function(e){
    const a=e.target.closest?.('.nav-inner .nav-item>a');if(!a)return;
    const target=routeForLabel(a.textContent,a.getAttribute('href')?.split('/').pop()||'');if(!target)return;
    e.preventDefault();location.hash=target==='home'?'#home':'#collection/'+target;
  },true);
  document.addEventListener('scroll',function(e){if(e.target?.id==='homeCircleRow')updateArrow()},true);
  window.addEventListener('resize',updateArrow);
  updateArrow();
  repairCmsNav();
  try{applyCMSStatic()}catch(e){}
})();
</script>



<!-- AEHRAN primary navigation v3: exact seven-item navigation, responsive one-line layout -->
<script id="aehran-primary-nav-v3-store-js">
(function(){
  try{
    const PRIMARY_NAV=[
      {label:'Home',target:'home',visible:true,mobileVisible:true},
      {label:'New',target:'new',visible:true,mobileVisible:true},
      {label:'Waistcoat',target:'waistcoat-sets',visible:true,mobileVisible:false},
      {label:'Wedding',target:'wedding',visible:true,mobileVisible:true},
      {label:'Collections',target:'minimal',visible:true,mobileVisible:true},
      {label:'Father & Son',target:'father-son',visible:true,mobileVisible:false},
      {label:'Sale',target:'sale',visible:true,mobileVisible:true}
    ];
    const defaultsByTarget=Object.fromEntries(PRIMARY_NAV.map(x=>[x.target,x]));
    const current=Array.isArray(cms.nav)?cms.nav.filter(Boolean):[];

    /*
      Defaults are only created when navigation is absent.
      Existing CMS/Firebase navigation is preserved rather than reset on every load.
    */
    if(!current.length){
      cms.nav=PRIMARY_NAV.map(x=>({...x}));
      try{localStorage.setItem('aehran_cms',JSON.stringify(cms))}catch(e){}
    }else{
      let changed=false;
      cms.nav=current.map(item=>{
        const target=String(item.target||'').trim();
        const base=defaultsByTarget[target];
        if(!base){
          /* Preserve additional CMS/admin navigation items. */
          const next={...item};
          if(next.mobileVisible===undefined)next.mobileVisible=target==='kids'?false:next.visible!==false;
          if(next.mobileVisible!==item.mobileVisible)changed=true;
          return next;
        }
        const next={
          ...item,
          label:item.label||base.label,
          target:base.target,
          visible:item.visible!==false,
          mobileVisible:item.mobileVisible!==undefined?item.mobileVisible:base.mobileVisible
        };
        if(JSON.stringify(next)!==JSON.stringify(item))changed=true;
        return next;
      });
      if(changed)try{localStorage.setItem('aehran_cms',JSON.stringify(cms))}catch(e){}
    }
    if(typeof applyCMSStatic==='function')applyCMSStatic();
  }catch(e){console.warn('AEHRAN primary storefront navigation setup',e)}
})();
</script>
