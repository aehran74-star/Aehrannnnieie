function dashboard(){const revenue=orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+Number(o.total||0),0),cust=uniqueCustomers(),aov=orders.length?revenue/orders.length:0,low=products.filter(p=>Number(p.stock)<8).length;const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d});const vals=days.map(d=>orders.filter(o=>new Date(o.date).toDateString()===d.toDateString()&&o.status!=='Cancelled').reduce((s,o)=>s+Number(o.total||0),0));const max=Math.max(1,...vals);return `${head('Dashboard','A live overview of your AEHRAN clothing store.',`<button class="btn" onclick="openProduct()">+ Add product</button>`)}<div class="cards"><div class="stat"><label>Total sales</label><strong>${money(revenue)}</strong><small>${orders.length} orders recorded</small></div><div class="stat"><label>Orders</label><strong>${orders.length}</strong><small>${orders.filter(o=>o.status==='Placed').length} waiting to process</small></div><div class="stat"><label>Customers</label><strong>${cust.length}</strong><small>Unique customer emails</small></div><div class="stat"><label>Average order</label><strong>${money(aov)}</strong><small>${low} low-stock products</small></div></div><div class="grid2"><div class="panel"><h2>Sales · last 7 days</h2><div class="chart">${vals.map((v,i)=>`<div class="bar-col"><div class="bar" style="height:${Math.max(5,v/max*170)}px" title="${money(v)}"></div><small>${days[i].toLocaleDateString('en-IN',{weekday:'short'})}</small></div>`).join('')}</div></div><div class="panel"><h2>Recent orders</h2><div class="list">${orders.slice().reverse().slice(0,6).map(o=>`<div class="list-row"><div><b>${esc(o.id)} · ${esc(o.name||'Customer')}</b><small>${new Date(o.date).toLocaleString()} · ${o.items?.length||0} item(s)</small></div><div><b>${money(o.total)}</b><small>${esc(o.status)}</small></div></div>`).join('')||'<div class="empty">No orders yet.</div>'}</div></div></div><div class="grid2"><div class="panel"><h2>Inventory attention</h2><div class="list">${products.slice().sort((a,b)=>a.stock-b.stock).slice(0,6).map(p=>`<div class="list-row"><div><b>${esc(p.name)}</b><small>${esc(p.sku)} · ${esc(p.cat)}</small></div><strong>${p.stock} left</strong></div>`).join('')}</div></div><div class="panel"><h2>Quick actions</h2><div class="head-actions"><button class="btn alt" onclick="show('collections')">Manage collections</button><button class="btn alt" onclick="show('homepage')">Edit homepage</button><button class="btn alt" onclick="show('branding')">Change logo/theme</button><button class="btn alt" onclick="show('discounts')">Discount codes</button></div><p class="mini-note" style="margin-top:15px">Changes are written to the same AEHRAN Local Bridge keys used by the storefront. When both pages are hosted on the same origin, changes sync immediately.</p></div></div>`}

function userCanManageAccounts(){return currentAdminUser()?.role==='Admin'}
function usersPage(){if(!userCanManageAccounts())return `${head('Users & Roles','Only Admin users can manage staff accounts.')}<div class="section-card"><div class="empty">You do not have permission to manage users.</div></div>`;const me=currentAdminUser();return `${head('Users & Roles','Create Admin, Manager and Employee logins without Firebase Authentication.',`<button class="btn" onclick="openAdminUser()">+ Create user</button>`)}<div class="permission-note" style="margin-bottom:14px"><b>Role access:</b> Admin has full access and can manage users. Manager can operate catalogue, orders, storefront, finance and delivery settings. Employee gets day-to-day orders, returns, customers, reviews, products, media and delivery tracking. Accounts sync to Firebase so the same login can be used on another phone or device.</div><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last login</th><th>Created</th><th></th></tr></thead><tbody>${adminUsers.map(u=>`<tr><td><b>${esc(u.name||'User')}</b><br><small>${esc(u.email)}</small>${u.id===me?.id?'<br><small>Current session</small>':''}</td><td><span class="role-pill ${esc(u.role)}">${esc(u.role)}</span></td><td><span class="status ${u.active?'Delivered':'Cancelled'}">${u.active?'Active':'Disabled'}</span></td><td>${u.lastLoginAt?new Date(u.lastLoginAt).toLocaleString('en-IN'):'—'}</td><td>${u.createdAt?new Date(u.createdAt).toLocaleDateString('en-IN'):'—'}</td><td><div class="head-actions"><button class="btn ghost small" onclick="openAdminUser('${u.id}')">Edit</button><button class="btn danger small" onclick="deleteAdminUser('${u.id}')" ${u.id===me?.id?'disabled':''}>Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function openAdminUser(id=''){if(!userCanManageAccounts()){toast('Admin permission required');return}const u=adminUsers.find(x=>x.id===id);openModal(`<div class="modal-head"><div><div class="label">${u?'EDIT USER':'NEW USER'}</div><h2>${u?esc(u.name):'Create staff user'}</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field"><label>Name</label><input id="usrName" value="${attr(u?.name||'')}" placeholder="Staff name"></div><div class="field"><label>Email / User ID</label><input id="usrEmail" value="${attr(u?.email||'')}" placeholder="name@aehran.com"></div><div class="field"><label>Role</label><select id="usrRole">${['Admin','Manager','Employee'].map(r=>`<option ${u?.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Password ${u?'(leave blank to keep current)':''}</label><input id="usrPass" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"></div><div class="field wide"><label class="check"><input id="usrActive" type="checkbox" ${u?.active===false?'':'checked'}> Account active</label></div></div><div class="secret-note" style="margin:12px 0">Passwords are stored as one-way hashes and synced to Firebase Realtime Database. The plain password is never saved.</div><button class="btn full" onclick="saveAdminUser('${id}')">${u?'Save user':'Create user'}</button>`)}
async function saveAdminUser(id=''){if(!userCanManageAccounts())return;const name=document.getElementById('usrName').value.trim(),email=document.getElementById('usrEmail').value.trim().toLowerCase(),role=document.getElementById('usrRole').value,pass=document.getElementById('usrPass').value,active=document.getElementById('usrActive').checked;if(!name||!email){toast('Name and email are required');return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Enter a valid email');return}if(adminUsers.some(x=>x.id!==id&&String(x.email).toLowerCase()===email)){toast('A user with this email already exists');return}if(!id&&pass.length<8){toast('Password must be at least 8 characters');return}const existing=adminUsers.find(x=>x.id===id);if(existing&&existing.role==='Admin'&&(role!=='Admin'||!active)){const otherAdmins=adminUsers.filter(x=>x.id!==id&&x.role==='Admin'&&x.active);if(!otherAdmins.length){toast('Keep at least one active Admin account');return}}let u=existing;if(!u){u={id:'usr-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),createdAt:new Date().toISOString()};adminUsers.push(u)}u.name=name;u.email=email;u.role=role;u.active=active;if(pass){u.salt='salt-'+Math.random().toString(36).slice(2)+Date.now().toString(36);u.passwordHash=await passwordHash(pass,u.salt)}save('aehran_admin_users',adminUsers);audit.unshift({time:new Date().toISOString(),msg:(existing?'Updated':'Created')+' admin user '+email});audit=audit.slice(0,100);save('aehran_admin_audit',audit);try{if(typeof window.__aehranFirebaseAdminUsersSave!=='function')throw new Error('Firebase accounts sync is still connecting');await window.__aehranFirebaseAdminUsersSave(adminUsers)}catch(err){console.error('Admin account cloud save failed',err);toast('User saved locally but Firebase sync failed');return}closeModal();toast(existing?'User updated & synced':'User created & synced');renderApp();show('users')}
async function deleteAdminUser(id){if(!userCanManageAccounts())return;const me=currentAdminUser(),u=adminUsers.find(x=>x.id===id);if(!u||u.id===me?.id){toast('You cannot delete your current account');return}if(u.role==='Admin'&&adminUsers.filter(x=>x.role==='Admin'&&x.active&&x.id!==id).length===0){toast('Keep at least one active Admin account');return}if(!confirm('Delete '+(u.name||u.email)+'?'))return;adminUsers=adminUsers.filter(x=>x.id!==id);save('aehran_admin_users',adminUsers);try{await window.__aehranFirebaseAdminUsersSave?.(adminUsers)}catch(err){console.error('Admin account delete sync failed',err);toast('Deleted locally but Firebase sync failed');return}toast('User deleted & synced');show('users')}

function canConfigureDelivery(){return ['Admin','Manager'].includes(currentAdminUser()?.role)}
function deliveryPartnerById(id){return deliveryPartners.find(p=>p.id===id)}
function deliveryOrders(){return orders.slice().reverse().filter(o=>o.deliveryPartnerId||o.awb||o.trackingId||['Placed','Confirmed','Packed','Shipped'].includes(o.status))}
function deliveryPartnersPage(){const cfg=canConfigureDelivery(),active=deliveryPartners.filter(p=>p.enabled).length,auto=deliveryPartners.filter(p=>p.enabled&&p.autoAssign).length,assigned=orders.filter(o=>o.deliveryPartnerId||o.awb||o.trackingId).length;return `${head('Delivery Partners','Connect Shadowfax-style courier adapters, create deliveries automatically and track AWB status.',`${cfg?'<button class="btn ghost" onclick="openDeliveryPartner()">+ Add partner</button>':''}<button class="btn" onclick="autoAssignPendingDeliveries()">Run auto-delivery</button>`)}<div class="cards" style="margin-bottom:16px"><div class="stat"><label>Enabled partners</label><strong>${active}</strong><small>${auto} enabled for automatic assignment</small></div><div class="stat"><label>Assigned shipments</label><strong>${assigned}</strong><small>Orders with courier/AWB data</small></div><div class="stat"><label>Waiting</label><strong>${orders.filter(o=>['Placed','Confirmed','Packed'].includes(o.status)&&!o.deliveryPartnerId&&!o.awb&&!o.trackingId).length}</strong><small>Eligible for auto-delivery</small></div><div class="stat"><label>Tracking</label><strong>${orders.filter(o=>o.deliveryStatus&&!/delivered/i.test(o.deliveryStatus)).length}</strong><small>Active delivery updates</small></div></div><div class="secret-note" style="margin-bottom:14px"><b>API key safety:</b> this HTML never stores courier API keys. Set the key on your server using the shown secret name, then point each partner to a same-domain backend URL such as <span class="kbd">/api/delivery/shadowfax</span>. The included adapter template provides the normalized endpoints this page expects.</div><div class="delivery-grid">${deliveryPartners.sort((a,b)=>(a.priority||99)-(b.priority||99)).map(p=>`<div class="delivery-card ${p.enabled?'active':''}"><div class="user-meta"><h3>${esc(p.name)}</h3><span class="delivery-status ${p.enabled?'ok':'warn'}">${p.enabled?'Enabled':'Disabled'}</span></div><p>${p.autoAssign?'Automatic order assignment is on.':'Manual shipment creation only.'}</p><div class="meta">Backend: ${esc(p.backendUrl||'Not set')}<br>Secret: ${esc(p.secretName||'Server environment')}<br>Service: ${esc(p.serviceType||'standard')} · Priority ${Number(p.priority||99)}</div><div class="head-actions">${cfg?`<button class="btn ghost small" onclick="openDeliveryPartner('${p.id}')">Configure</button>`:''}<button class="btn ghost small" onclick="testDeliveryPartner('${p.id}')">Test</button>${p.trackingPortal?`<button class="btn ghost small" onclick="window.open('${attr(p.trackingPortal)}','_blank')">Tracking portal ↗</button>`:''}</div></div>`).join('')}</div><div class="section-card" style="margin-top:16px"><h2>Shipments & tracking</h2><p>Create a shipment, refresh courier tracking or open the courier tracking link returned by your adapter.</p><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Partner</th><th>AWB / Tracking</th><th>Delivery status</th><th>Updated</th><th></th></tr></thead><tbody>${deliveryOrders().map(o=>{const p=deliveryPartnerById(o.deliveryPartnerId);return `<tr><td><b>${esc(o.id)}</b><br><small>${esc(o.status||'')}</small></td><td>${esc(o.name||o.customer_name||'—')}<br><small>${esc(o.phone||'')}</small></td><td>${esc(o.courier||p?.name||'Not assigned')}</td><td>${esc(o.awb||o.trackingId||'—')}</td><td><span class="delivery-status ${/delivered/i.test(o.deliveryStatus||'')?'ok':o.deliveryStatus?'warn':''}">${esc(o.deliveryStatus||'Not created')}</span></td><td>${o.deliveryUpdatedAt?new Date(o.deliveryUpdatedAt).toLocaleString('en-IN'):'—'}</td><td><div class="head-actions">${!o.deliveryPartnerId&&!o.awb&&!o.trackingId?`<button class="btn small" onclick="createDeliveryForOrder('${o.id}')">Create delivery</button>`:`<button class="btn ghost small" onclick="refreshDeliveryTracking('${o.id}')">Refresh</button>`}${o.trackingUrl?`<button class="btn ghost small" onclick="window.open('${attr(o.trackingUrl)}','_blank')">Track ↗</button>`:''}</div></td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">No orders are waiting for delivery.</div></td></tr>'}</tbody></table></div></div>`}
function openDeliveryPartner(id=''){if(!canConfigureDelivery()){toast('Manager or Admin permission required');return}const p=deliveryPartnerById(id);openModal(`<div class="modal-head"><div><div class="label">${p?'DELIVERY PARTNER':'NEW PARTNER'}</div><h2>${p?esc(p.name):'Add delivery partner'}</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field"><label>Name</label><input id="dpName" value="${attr(p?.name||'')}" placeholder="Shadowfax"></div><div class="field"><label>Code</label><input id="dpCode" value="${attr(p?.code||'')}" placeholder="shadowfax"></div><div class="field wide"><label>Backend API URL</label><input id="dpUrl" value="${attr(p?.backendUrl||'/api/delivery/')}" placeholder="/api/delivery/shadowfax"></div><div class="field"><label>Server secret name</label><input id="dpSecret" value="${attr(p?.secretName||'COURIER_API_KEY')}" placeholder="SHADOWFAX_API_KEY"></div><div class="field"><label>Service type</label><input id="dpService" value="${attr(p?.serviceType||'standard')}" placeholder="standard"></div><div class="field"><label>Priority</label><input id="dpPriority" type="number" min="1" value="${Number(p?.priority||deliveryPartners.length+1)}"></div><div class="field"><label>Tracking portal (optional)</label><input id="dpPortal" value="${attr(p?.trackingPortal||'')}" placeholder="https://..."></div><div class="field wide"><label class="check"><input id="dpEnabled" type="checkbox" ${p?.enabled?'checked':''}> Enable this partner</label><label class="check"><input id="dpAuto" type="checkbox" ${p?.autoAssign?'checked':''}> Automatically create delivery for new eligible orders</label></div></div><div class="secret-note" style="margin:12px 0">Do not paste the courier API key into this HTML. Put the key in your backend environment under the secret name above. The admin calls your backend; your backend calls the courier.</div><button class="btn full" onclick="saveDeliveryPartner('${id}')">Save partner</button>`)}
function saveDeliveryPartner(id=''){if(!canConfigureDelivery())return;const name=document.getElementById('dpName').value.trim(),code=slug(document.getElementById('dpCode').value||name),backendUrl=document.getElementById('dpUrl').value.trim().replace(/\/+$/,''),secretName=document.getElementById('dpSecret').value.trim(),serviceType=document.getElementById('dpService').value.trim()||'standard',priority=Math.max(1,Number(document.getElementById('dpPriority').value)||99),trackingPortal=document.getElementById('dpPortal').value.trim(),enabled=document.getElementById('dpEnabled').checked,autoAssign=document.getElementById('dpAuto').checked;if(!name||!code||!backendUrl){toast('Name, code and backend URL are required');return}let p=deliveryPartnerById(id);if(!p){p={id:'dp-'+Date.now().toString(36)};deliveryPartners.push(p)}Object.assign(p,{name,code,backendUrl,secretName,serviceType,priority,trackingPortal,enabled,autoAssign});save('aehran_delivery_partners',deliveryPartners);closeModal();toast('Delivery partner saved');show('deliveryPartners');if(enabled&&autoAssign)scheduleAutoDeliveries()}
async function testDeliveryPartner(id){const p=deliveryPartnerById(id);if(!p?.backendUrl){toast('Configure the backend URL first');return}toast('Testing '+p.name+'…');try{const r=await fetch(p.backendUrl.replace(/\/+$/,'')+'/health',{headers:{'Accept':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'Server is reachable but courier credentials/endpoints are not fully configured');toast(p.name+' connection is ready')}catch(e){toast(p.name+' test failed: '+String(e.message||e).slice(0,90))}}
function shipmentPayload(o,p){return {provider:p.code,order:{id:o.id,date:o.date,name:o.name||o.customer_name,email:o.email,phone:o.phone,address:o.address||o.shippingAddress,total:Number(o.total??o.total_amount??0),payment:o.payment||o.payment_mode,items:o.items||o.products||[]},options:{serviceType:p.serviceType||'standard'}}}
function applyShipmentResult(o,p,d){o.deliveryPartnerId=p.id;o.courier=d.courier||d.partner||p.name;o.awb=d.awb||d.awbNumber||o.awb||'';o.trackingId=d.trackingId||d.shipmentId||d.id||o.trackingId||o.awb||'';o.trackingUrl=d.trackingUrl||d.trackUrl||o.trackingUrl||'';o.deliveryStatus=d.status||d.deliveryStatus||'Created';o.deliveryUpdatedAt=new Date().toISOString();o.deliveryError='';save('aehran_orders',orders);notify('delivery')}
async function createDeliveryForOrder(id,silent=false){const o=orders.find(x=>String(x.id)===String(id));if(!o)return false;if(o.deliveryPartnerId||o.awb||o.trackingId)return true;const p=deliveryPartners.filter(x=>x.enabled).sort((a,b)=>(a.priority||99)-(b.priority||99)).find(x=>x.autoAssign)||deliveryPartners.filter(x=>x.enabled).sort((a,b)=>(a.priority||99)-(b.priority||99))[0];if(!p){if(!silent)toast('Enable a delivery partner first');return false}if(!p.backendUrl){if(!silent)toast('Set '+p.name+' backend URL first');return false}o.deliveryAutoAttemptedAt=new Date().toISOString();save('aehran_orders',orders);try{const r=await fetch(p.backendUrl.replace(/\/+$/,'')+'/shipments',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(shipmentPayload(o,p))});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));applyShipmentResult(o,p,d);if(!silent)toast('Delivery created with '+p.name);if(current==='orders')renderOrdersTable();if(current==='deliveryPartners')show('deliveryPartners');return true}catch(e){o.deliveryError=String(e.message||e);o.deliveryUpdatedAt=new Date().toISOString();save('aehran_orders',orders);if(!silent)toast('Delivery creation failed: '+o.deliveryError.slice(0,90));return false}}
async function refreshDeliveryTracking(id,silent=false){const o=orders.find(x=>String(x.id)===String(id));if(!o)return false;const p=deliveryPartnerById(o.deliveryPartnerId)||deliveryPartners.find(x=>x.enabled);const key=o.trackingId||o.awb;if(!p?.backendUrl||!key){if(!silent)toast('Tracking data is not available yet');return false}try{const r=await fetch(p.backendUrl.replace(/\/+$/,'')+'/shipments/'+encodeURIComponent(key),{headers:{'Accept':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));applyShipmentResult(o,p,{...d,awb:d.awb||o.awb,trackingId:d.trackingId||o.trackingId,trackingUrl:d.trackingUrl||o.trackingUrl});if(/delivered/i.test(o.deliveryStatus||''))o.status='Delivered';else if(/out for delivery|in transit|shipped|picked/i.test(o.deliveryStatus||'')&&o.status!=='Delivered')o.status='Shipped';save('aehran_orders',orders);if(!silent)toast('Tracking updated');if(current==='orders')renderOrdersTable();if(current==='deliveryPartners')show('deliveryPartners');return true}catch(e){if(!silent)toast('Tracking refresh failed: '+String(e.message||e).slice(0,90));return false}}
async function autoAssignPendingDeliveries(silent=false){if(window.__aehranAutoDeliveryRunning)return;const p=deliveryPartners.filter(x=>x.enabled&&x.autoAssign).sort((a,b)=>(a.priority||99)-(b.priority||99))[0];if(!p){if(!silent)toast('No auto-delivery partner is enabled');return}const pending=orders.filter(o=>['Placed','Confirmed','Packed'].includes(o.status)&&!o.deliveryPartnerId&&!o.awb&&!o.trackingId&&!o.deliveryAutoAttemptedAt);if(!pending.length){if(!silent)toast('No new orders need automatic delivery');return}window.__aehranAutoDeliveryRunning=true;let ok=0;try{for(const o of pending){if(await createDeliveryForOrder(o.id,true))ok++}}finally{window.__aehranAutoDeliveryRunning=false}if(!silent)toast(ok+' of '+pending.length+' deliveries created');if(current==='deliveryPartners')show('deliveryPartners');if(current==='orders')renderOrdersTable()}
function scheduleAutoDeliveries(){clearTimeout(window.__aehranAutoDeliveryTimer);window.__aehranAutoDeliveryTimer=setTimeout(()=>autoAssignPendingDeliveries(true),650)}
function orderDeliveryCell(o){const p=deliveryPartnerById(o.deliveryPartnerId),name=o.courier||p?.name||'Not assigned',code=o.awb||o.trackingId||'';return `${esc(name)}${code?`<br><small>${esc(code)}</small>`:''}${o.deliveryStatus?`<br><span class="delivery-status ${/delivered/i.test(o.deliveryStatus)?'ok':'warn'}">${esc(o.deliveryStatus)}</span>`:''}`}

function ensureHeroSlides(){cms.hero=cms.hero||{};if(!Array.isArray(cms.hero.slides))cms.hero.slides=[];while(cms.hero.slides.length<3)cms.hero.slides.push({image:cms.hero.slides.length===0?LATEST_BANNER_KIDS:cms.hero.slides.length===1?LATEST_BANNER_WHITE:BUILTIN_HERO,link:cms.hero.slides.length===0?'kids':'new',label:'Banner '+(cms.hero.slides.length+1),active:true});return cms.hero.slides}
function bannersPage(){const slides=ensureHeroSlides();return `${head('Banner Slider','Control all hero banners from admin — image, destination, label, order and autoplay.',`<button class="btn ghost" onclick="addBanner()">+ Add slide</button><button class="btn" onclick="saveBanners()">Save slider</button>`)}<div class="section-card"><div class="split3"><div class="field"><label>Auto slide timing (seconds)</label><input id="bannerSeconds" type="number" min="1" max="20" step="1" value="${Math.max(1,Math.round(Number(cms.hero.autoplayMs||3000)/1000))}"></div><div class="field"><label>Banner fit</label><select id="bannerFit"><option value="cover" ${(cms.display?.bannerFit||'cover')==='cover'?'selected':''}>Cover</option><option value="contain" ${cms.display?.bannerFit==='contain'?'selected':''}>Contain</option></select></div><div class="field"><label>Slides</label><input disabled value="${slides.length} active/editable slots"></div></div><p class="mini-note">The current store is set for a 3-second automatic slider. You can change it here.</p></div><div class="banner-admin-grid">${slides.map((s,i)=>bannerAdminCard(s,i)).join('')}</div>`}
function bannerAdminCard(s,i){return `<div class="banner-admin-card"><div class="banner-preview" id="bannerPreview${i}">${s.image?`<img src="${attr(s.image)}">`:''}</div><div><div class="form-grid"><div class="field wide"><label>Banner ${i+1} image</label><input id="bannerImage${i}" value="${attr(s.image||'')}" oninput="bannerPreview(${i})"><div class="banner-actions"><button type="button" class="btn ghost small" onclick="pickMedia('bannerImage${i}')">Media library</button><label class="btn alt small">Upload banner<input hidden type="file" accept="image/*" onchange="uploadToInput(this,'bannerImage${i}',2000);setTimeout(()=>bannerPreview(${i}),30)"></label></div></div><div class="field"><label>Label / accessibility title</label><input id="bannerLabel${i}" value="${attr(s.label||'Banner '+(i+1))}"></div><div class="field"><label>Click destination</label><select id="bannerLink${i}">${COLLECTIONS.map(x=>`<option value="${x[0]}" ${x[0]===(s.link||'new')?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="bannerActive${i}"><option value="1" ${s.active!==false?'selected':''}>Active</option><option value="0" ${s.active===false?'selected':''}>Hidden</option></select></div></div><div class="banner-actions"><button class="btn ghost small" onclick="moveBanner(${i},-1)">↑ Move up</button><button class="btn ghost small" onclick="moveBanner(${i},1)">↓ Move down</button>${ensureHeroSlides().length>1?`<button class="btn danger small" onclick="removeBanner(${i})">Remove</button>`:''}</div></div></div>`}
function bannerPreview(i){const box=document.getElementById('bannerPreview'+i),v=document.getElementById('bannerImage'+i)?.value||'';if(box)box.innerHTML=v?`<img src="${attr(v)}">`:''}
function collectBannerForm(){const slides=ensureHeroSlides();return slides.map((s,i)=>({image:document.getElementById('bannerImage'+i)?.value.trim()||s.image,link:document.getElementById('bannerLink'+i)?.value||s.link||'new',label:document.getElementById('bannerLabel'+i)?.value.trim()||('Banner '+(i+1)),active:(document.getElementById('bannerActive'+i)?.value||'1')==='1'}))}
function saveBanners(){const slides=collectBannerForm();cms.hero.slides=slides;const active=slides.find(x=>x.active!==false&&x.image)||slides[0];cms.hero.image=active?.image||'';cms.hero.link=active?.link||'new';cms.hero.autoplayMs=Math.max(1000,Number(document.getElementById('bannerSeconds')?.value||3)*1000);cms.display=cms.display||{};cms.display.bannerFit=document.getElementById('bannerFit')?.value||'cover';commit('Banner slider updated')}
function moveBanner(i,d){cms.hero.slides=collectBannerForm();const j=i+d;if(j<0||j>=cms.hero.slides.length)return;[cms.hero.slides[i],cms.hero.slides[j]]=[cms.hero.slides[j],cms.hero.slides[i]];commit('Banner order updated');show('banners')}
function removeBanner(i){cms.hero.slides=collectBannerForm();cms.hero.slides.splice(i,1);commit('Banner removed');show('banners')}
function addBanner(){cms.hero.slides=collectBannerForm();cms.hero.slides.push({image:'',link:'new',label:'New banner',active:true});commit('Banner slot added');show('banners')}

function displayPage(){const d=cms.display||clone(DEFAULT_CMS.display);return `${head('Image Display','Control product framing so faces are not cut and product galleries stay clean.',`<button class="btn" onclick="saveDisplay()">Save display</button>`)}<div class="grid2"><div class="section-card"><h2>Product cards</h2><div class="field"><label>Image fit</label><select id="displayProductFit"><option value="cover" ${d.productFit==='cover'?'selected':''}>Cover</option><option value="contain" ${d.productFit==='contain'?'selected':''}>Contain</option></select></div><div class="field"><label>Vertical focus (%)</label><input id="displayProductY" type="range" min="0" max="100" value="${Number(d.productPositionY||7)}" oninput="document.getElementById('displayYValue').textContent=this.value+'%'"><small id="displayYValue">${Number(d.productPositionY||7)}%</small></div><p class="mini-note">Lower values keep the model's head nearer the top of the frame. Current recommended value: 7%.</p></div><div class="section-card"><h2>Product detail gallery</h2><div class="field"><label>Gallery fit</label><select id="displayGalleryFit"><option value="contain" ${d.galleryFit==='contain'?'selected':''}>Contain / full outfit</option><option value="cover" ${d.galleryFit==='cover'?'selected':''}>Cover</option></select></div><div class="field"><label>Banner fit</label><select id="displayBannerFit"><option value="cover" ${d.bannerFit==='cover'?'selected':''}>Cover</option><option value="contain" ${d.bannerFit==='contain'?'selected':''}>Contain</option></select></div></div></div>`}
function saveDisplay(){cms.display={productFit:document.getElementById('displayProductFit').value,productPositionY:Number(document.getElementById('displayProductY').value),galleryFit:document.getElementById('displayGalleryFit').value,bannerFit:document.getElementById('displayBannerFit').value};commit('Image display settings updated')}

function collectionsPage(){return `${head('Collections','Each category has its own product workspace, exactly separated for easy uploading.',`<button class="btn" onclick="openProduct()">+ Add product</button>`)}<div class="collection-grid">${COLLECTIONS.map(([s,n])=>{const c=products.filter(p=>(p.collections||[]).includes(s)||p.cat===s).length;return `<div class="collection-card" onclick="renderCollectionDetail('${s}')"><b>${n}</b><strong>${c}</strong><span>products · open category →</span></div>`}).join('')}</div>`}
function renderCollectionDetail(slugv){collectionCtx=slugv;current='collectionDetail';const c=document.getElementById('content');const name=COLLECTIONS.find(x=>x[0]===slugv)?.[1]||slugv;const list=products.filter(p=>(p.collections||[]).includes(slugv)||p.cat===slugv);c.innerHTML=`${head(name,'Upload and manage products only for this collection.',`<button class="btn ghost" onclick="show('collections')">← All collections</button><button class="btn" onclick="openProduct('', '${slugv}')">+ Add to ${name}</button>`)}${productTable(list)}`;document.getElementById('crumb').textContent='Collections / '+name}
function productsPage(){return `${head('All Products','Edit pricing, stock, images, product text and collection placement.',`<button class="btn" onclick="openProduct()">+ Add product</button>`)}<div class="search-row"><input id="prodSearch" class="input" placeholder="Search products..." oninput="renderProductSearch()"><select id="prodCat" onchange="renderProductSearch()"><option value="">All categories</option>${COLLECTIONS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div><div id="productTable">${productTable(products)}</div>`}
function productTable(list){return `<div class="table-wrap"><table><thead><tr><th>Product</th><th>Primary</th><th>Collections</th><th>Price</th><th>Stock</th><th>Rating</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="product-cell"><img class="thumb" src="${attr(p.img)}"><div><b>${esc(p.name)}</b><br><small>${esc(p.sku||p.id)}</small></div></div></td><td>${esc(p.cat)}</td><td><small>${(p.collections||[]).slice(0,4).map(esc).join(', ')}${(p.collections||[]).length>4?'…':''}</small></td><td>${money(p.price)}<br><small><s>${money(p.old)}</s></small></td><td><b>${p.stock}</b></td><td>★ ${p.rating||0}</td><td><button class="btn ghost small" onclick="openProduct('${p.id}')">Edit</button></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">No products in this category yet.</div></td></tr>`}</tbody></table></div>`}
function renderProductSearch(){const q=(document.getElementById('prodSearch')?.value||'').toLowerCase(),cat=document.getElementById('prodCat')?.value||'';const list=products.filter(p=>(!cat||(p.collections||[]).includes(cat)||p.cat===cat)&&(p.name+' '+p.sku+' '+p.cat+' '+p.tag).toLowerCase().includes(q));document.getElementById('productTable').innerHTML=productTable(list)}
function openProduct(id='',preset=''){const p=id?products.find(x=>x.id===id):null;const d=p||{id:'',name:'',sku:'',cat:preset||'kurta',collections:preset?[preset]:[],audience:preset&&preset.startsWith('kids')?'kids':'men',productType:preset==='kids-jacket'||preset==='men-jacket'||preset==='jacket'?'nehru-jacket-set':preset==='sherwani'?'sherwani':'kurta-set',price:'',old:'',stock:10,color:'Ivory',tag:'New',tags:[],rating:4.8,reviews:0,img:'',imgs:[],desc:'',galleryType:'multi-angle',variantGroup:'',colorVariants:[]};openModal(`<div class="modal-head"><div><div class="label">${p?'EDIT PRODUCT':'NEW PRODUCT'}</div><h2>${p?esc(p.name):'Create product'}</h2></div><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveProduct(event,'${p?.id||''}')"><div class="form-grid"><div class="field"><label>Product name</label><input id="pName" value="${attr(d.name)}" required></div><div class="field"><label>SKU</label><input id="pSku" value="${attr(d.sku||'')}" placeholder="AHR-001"></div><div class="field"><label>Audience</label><select id="pAudience"><option value="men" ${d.audience==='men'?'selected':''}>Men</option><option value="kids" ${d.audience==='kids'?'selected':''}>Kids</option><option value="unisex" ${d.audience==='unisex'?'selected':''}>Unisex</option></select></div><div class="field"><label>Product type</label><select id="pType"><option value="kurta-set" ${d.productType==='kurta-set'?'selected':''}>Kurta Set</option><option value="nehru-jacket-set" ${d.productType==='nehru-jacket-set'?'selected':''}>Nehru Jacket Set</option><option value="sherwani" ${d.productType==='sherwani'?'selected':''}>Sherwani</option><option value="bandhgala" ${d.productType==='bandhgala'?'selected':''}>Bandhgala</option><option value="indowestern" ${d.productType==='indowestern'?'selected':''}>Indo-Western</option><option value="ethnic-set" ${!['kurta-set','nehru-jacket-set','sherwani','bandhgala','indowestern'].includes(d.productType)?'selected':''}>Other Ethnic Set</option></select></div><div class="field"><label>Primary category</label><select id="pCat">${COLLECTIONS.filter(x=>!['new','men','kids','ready','groom','groomsman','father','father-son','brother','reception','festive','sale'].includes(x[0])).map(x=>`<option value="${x[0]}" ${x[0]===d.cat?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Badge / tag</label><input id="pTag" value="${attr(d.tag||'')}"></div><div class="field"><label>Selling price (₹)</label><input id="pPrice" type="number" min="0" value="${d.price}" required></div><div class="field"><label>MRP (₹)</label><input id="pOld" type="number" min="0" value="${d.old}" required></div><div class="field"><label>Stock</label><input id="pStock" type="number" min="0" value="${d.stock}" required></div><div class="field"><label>Colour</label><input id="pColor" value="${attr(d.color||'')}"></div><div class="field"><label>Rating</label><input id="pRating" type="number" min="0" max="5" step="0.1" value="${d.rating||4.8}"></div><div class="field"><label>Review count</label><input id="pReviews" type="number" min="0" value="${d.reviews||0}"></div><div class="field"><label>Gallery type</label><select id="pGalleryType"><option value="multi-angle" ${d.galleryType==='multi-angle'?'selected':''}>Multi-angle</option><option value="single" ${d.galleryType==='single'?'selected':''}>Single image</option></select></div><div class="field"><label>Variant group</label><input id="pVariantGroup" value="${attr(d.variantGroup||'')}" placeholder="e.g. kids-royal-buta"></div><div class="field wide"><label>Search / style tags (comma separated)</label><input id="pTags" value="${attr((d.tags||[]).join(', '))}" placeholder="Kids, Wedding, Brocade, Nehru Jacket"></div><div class="field wide"><label>Collections</label><div class="checks">${COLLECTIONS.map(x=>`<label class="check"><input type="checkbox" name="pCollection" value="${x[0]}" ${(d.collections||[]).includes(x[0])?'checked':''}> ${x[1]}</label>`).join('')}</div><p class="mini-note">Use Kids Kurta Sets only for kids. Use Men's Jackets / Kids' Jackets to keep jacket menus separate. Wedding can be selected independently.</p></div><div class="field wide"><label>Description</label><textarea id="pDesc" rows="4">${esc(d.desc||'')}</textarea></div><div class="field wide"><label>Primary image URL</label><div style="display:flex;gap:7px"><input id="pImg" value="${attr(d.img||'')}" oninput="previewProductImage()"><button type="button" class="btn ghost small" onclick="pickMedia('pImg')">Library</button></div><input type="file" accept="image/*" onchange="uploadToInput(this,'pImg',1400)" style="margin-top:7px"></div><div class="field wide"><label>Gallery image URLs · one per line</label><textarea id="pImgs" rows="5">${esc((d.imgs||[]).join('\n'))}</textarea><input type="file" accept="image/*" multiple onchange="uploadGallery(this)" style="margin-top:7px"></div><div class="field wide"><label>Colour variants JSON</label><textarea id="pVariants" rows="5" placeholder='[{"id":"product-red","color":"Crimson Red","hex":"#8f1f24"}]'>${esc(JSON.stringify(d.colorVariants||[],null,2))}</textarea><p class="mini-note">Link different colours of the same outfit here. Leave [] when there are no colour variants.</p></div><div class="wide preview" id="pPreview">${d.img?`<img src="${attr(d.img)}">`:'<span class="mini-note">Product preview</span>'}</div></div><div class="head-actions" style="margin-top:18px"><button class="btn" type="submit">${p?'Save product':'Publish product'}</button>${p?`<button type="button" class="btn danger" onclick="deleteProduct('${p.id}')">Delete product</button>`:''}</div></form>`)}
function previewProductImage(){const v=document.getElementById('pImg').value,box=document.getElementById('pPreview');box.innerHTML=v?`<img src="${attr(v)}">`:'<span class="mini-note">Product preview</span>'}
function saveProduct(e,id){e.preventDefault();let variants=[];try{variants=JSON.parse(document.getElementById('pVariants').value||'[]');if(!Array.isArray(variants))throw 0}catch(_){return toast('Colour variants JSON is invalid')}const obj={id:id||'product-'+Date.now(),name:document.getElementById('pName').value.trim(),sku:document.getElementById('pSku').value.trim()||'AHR-'+Date.now().toString().slice(-7),cat:document.getElementById('pCat').value,audience:document.getElementById('pAudience').value,productType:document.getElementById('pType').value,collections:[...document.querySelectorAll('input[name=pCollection]:checked')].map(x=>x.value),price:Number(document.getElementById('pPrice').value),old:Number(document.getElementById('pOld').value),stock:Number(document.getElementById('pStock').value),color:document.getElementById('pColor').value.trim(),tag:document.getElementById('pTag').value.trim()||'New',tags:parseMulti(document.getElementById('pTags').value),rating:Number(document.getElementById('pRating').value)||0,reviews:Number(document.getElementById('pReviews').value)||0,img:document.getElementById('pImg').value.trim(),imgs:document.getElementById('pImgs').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),desc:document.getElementById('pDesc').value.trim(),galleryType:document.getElementById('pGalleryType').value,variantGroup:document.getElementById('pVariantGroup').value.trim(),colorVariants:variants};if(!obj.collections.includes(obj.cat))obj.collections.push(obj.cat);if(obj.audience==='kids'&&!obj.collections.includes('kids'))obj.collections.push('kids');if(obj.audience==='men'&&!obj.collections.includes('men'))obj.collections.push('men');if(obj.productType.includes('jacket')){if(!obj.collections.includes('jacket'))obj.collections.push('jacket');const jc=obj.audience==='kids'?'kids-jacket':'men-jacket';if(!obj.collections.includes(jc))obj.collections.push(jc)}if(obj.audience==='kids'&&obj.productType==='kurta-set'&&!obj.collections.includes('kids-kurta'))obj.collections.push('kids-kurta');if(!obj.imgs.length&&obj.img)obj.imgs=[obj.img];if(obj.img&&!obj.imgs.includes(obj.img))obj.imgs.unshift(obj.img);if(!obj.img){toast('Please add a primary product image');return}const i=products.findIndex(x=>x.id===obj.id);if(i>=0)products[i]=obj;else products.unshift(obj);commit(i>=0?'Product updated':'Product published');closeModal();if(collectionCtx&&current==='collectionDetail')renderCollectionDetail(collectionCtx);else show('products')}
function deleteProduct(id){if(!confirm('Delete this product from the AEHRAN catalogue?'))return;products=products.filter(x=>x.id!==id);commit('Product deleted');closeModal();show('products')}
function mediaPage(){const all=getMedia();return `${head('Media Library','All product photos used on the website plus assets you upload here.',`<button class="btn" onclick="mediaUploadDialog()">+ Upload image</button><button class="btn ghost" onclick="addMediaUrl()">Add URL</button>`)}<div class="media-grid">${all.map((m,i)=>`<div class="media-card"><img src="${attr(m.url)}" loading="lazy"><div class="media-meta"><b>${esc(m.name||'AEHRAN image')}</b><small style="font-size:8px;color:var(--muted)">${esc(m.source)}</small><div class="media-actions"><button onclick="copyText('${i}')">Copy URL</button>${m.custom?`<button onclick="removeMedia('${attr(m.url)}')">Remove</button>`:''}</div></div></div>`).join('')}</div>`}
function getMedia(){const map=new Map();const add=(url,name,source,custom=false)=>{if(url&&!map.has(url))map.set(url,{url,name,source,custom})};products.forEach(p=>{add(p.img,p.name,'Product');(p.imgs||[]).forEach((u,i)=>add(u,p.name+' '+(i+1),'Gallery'))});add(cms.branding.logo,'Header logo','Branding');add(cms.branding.footerLogo,'Footer logo','Branding');add(cms.hero.image,'Hero banner','Homepage');(cms.hero?.slides||[]).forEach((x,i)=>add(x.image,'Hero slide '+(i+1),'Banner Slider'));(cms.home?.circles||[]).forEach(x=>add(x.image,x.label,'Circle'));(cms.home?.editorials||[]).forEach(x=>add(x.image,x.title,'Editorial'));(cms.home?.occasions||[]).forEach(x=>add(x.image,x.title,'Occasion'));(cms.home?.films||[]).forEach(x=>add(x.image,x.title,'Film'));media.forEach(x=>add(x.url,x.name||'Uploaded image','Uploaded',true));return [...map.values()]}
function mediaUploadDialog(){openModal(`<div class="modal-head"><div><div class="label">MEDIA</div><h2>Upload image</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Image file</label><input type="file" id="mediaFile" accept="image/*"></div><div class="field"><label>Name</label><input id="mediaName" placeholder="e.g. Wedding campaign 01"></div><button class="btn" onclick="saveMediaUpload()">Upload to library</button><p class="mini-note">Choose an image directly from this device. It is optimized in the browser and saved separately from normal store data, so product/order realtime updates stay lightweight.</p>`)}
async function saveMediaUpload(){const f=document.getElementById('mediaFile')?.files?.[0];if(!f)return toast('Choose an image first');try{toast('Optimizing image…');const data=await fileToData(f,1800);if(typeof window.__aehranUploadDbImage!=='function')throw new Error('Image service is still loading');toast('Uploading image…');const ref=await window.__aehranUploadDbImage(data,document.getElementById('mediaName')?.value||f.name);media.unshift({url:ref,name:document.getElementById('mediaName')?.value||f.name,source:'Admin upload',custom:true});commit('Image uploaded');closeModal();show('media')}catch(e){console.error(e);toast('Image upload failed — try again')}}
function addMediaUrl(){const url=prompt('Paste image URL');if(!url)return;media.unshift({url,name:'External image'});commit('Image URL added');show('media')}
function removeMedia(url){media=media.filter(x=>x.url!==url);commit('Media item removed');show('media')}
function copyText(i){const m=getMedia()[i];navigator.clipboard?.writeText(m.url);toast('Image URL copied')}
function pickMedia(target){document.getElementById('mediaPicker')?.remove();const all=getMedia(),wrap=document.createElement('div');wrap.id='mediaPicker';wrap.style.cssText='position:fixed;inset:0;z-index:160;background:rgba(5,12,19,.70);display:grid;place-items:center;padding:18px';wrap.innerHTML=`<div style="width:min(860px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 30px 100px rgba(0,0,0,.35)"><div class="modal-head"><div><div class="label">MEDIA LIBRARY</div><h2>Choose image</h2></div><button class="close" onclick="document.getElementById('mediaPicker').remove()">✕</button></div><div class="media-grid" style="grid-template-columns:repeat(4,1fr)">${all.map((m,i)=>`<button type="button" style="border:1px solid var(--line);background:#fff;border-radius:9px;overflow:hidden;padding:0" onclick="useMedia('${target}',${i})"><img src="${attr(m.url)}" style="aspect-ratio:1/1.1;object-fit:cover"><span style="display:block;padding:7px;font-size:8px">${esc(m.name)}</span></button>`).join('')}</div></div>`;document.body.appendChild(wrap)}

function useMedia(target,i){const m=getMedia()[i],el=document.getElementById(target);if(el){el.value=m.url;el.dispatchEvent(new Event('input'))}document.getElementById('mediaPicker')?.remove();toast('Image selected')}

async function uploadToInput(input,target,max=1400){const f=input.files?.[0];if(!f)return;try{toast('Optimizing image…');const data=await fileToData(f,max);if(typeof window.__aehranUploadDbImage!=='function')throw new Error('Image service is still loading');toast('Uploading image…');const ref=await window.__aehranUploadDbImage(data,f.name);const el=document.getElementById(target);if(el){el.value=ref;el.dispatchEvent(new Event('input',{bubbles:true}))}toast('Image ready — save your changes')}catch(e){console.error(e);toast('Image upload failed — try again')}finally{input.value=''}}
async function uploadGallery(input){const files=[...(input.files||[])];if(!files.length)return;try{if(typeof window.__aehranUploadDbImage!=='function')throw new Error('Image service is still loading');const refs=[];for(let i=0;i<files.length;i++){toast(`Uploading image ${i+1} of ${files.length}…`);const data=await fileToData(files[i],1400);refs.push(await window.__aehranUploadDbImage(data,files[i].name))}const box=document.getElementById('pImgs');if(box){const existing=box.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);box.value=[...existing,...refs].join('\n')}const primary=document.getElementById('pImg');if(primary&&!primary.value&&refs[0]){primary.value=refs[0];primary.dispatchEvent(new Event('input',{bubbles:true}))}toast('Gallery images ready — save product')}catch(e){console.error(e);toast('Gallery upload failed — try again')}finally{input.value=''}}
function fileToData(file,max=1600,quality=.82){return new Promise((resolve,reject)=>{if(!file||!String(file.type||'').startsWith('image/'))return reject(new Error('Choose an image file'));const reader=new FileReader();reader.onerror=()=>reject(reader.error||new Error('Could not read image'));reader.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('Could not decode image'));im.onload=()=>{let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;if(!w||!h)return reject(new Error('Invalid image'));const scale=Math.min(1,Number(max||1600)/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(im,0,0,w,h);let out='';try{out=c.toDataURL('image/webp',quality)}catch(_){out=c.toDataURL('image/jpeg',quality)}resolve(out)};im.src=reader.result};reader.readAsDataURL(file)})}
function homepagePage(){const h=cms.home;return `${head('Homepage Editor','Change the hero, circles, text, editorial blocks, occasions, films and reviews.',`<button class="btn" onclick="saveHomepage()">Save homepage</button>`)}<div class="section-card"><h2>Hero banner / slider</h2><p>The storefront now supports multiple hero slides. Use Banner Slider for full control; this field controls the primary/fallback hero.</p><button class="btn ghost small" type="button" onclick="show('banners')">Open Banner Slider →</button><div class="form-grid"><div class="field"><label>Hero image</label><input id="heroImage" value="${attr(cms.hero.image)}"><div class="head-actions"><button class="btn ghost small" type="button" onclick="pickMedia('heroImage')">Choose library</button><label class="btn alt small">Upload<input type="file" hidden accept="image/*" onchange="uploadToInput(this,'heroImage',1800)"></label></div></div><div class="field"><label>Click goes to collection</label><select id="heroLink">${COLLECTIONS.map(x=>`<option value="${x[0]}" ${x[0]===cms.hero.link?'selected':''}>${x[1]}</option>`).join('')}</select></div></div></div><div class="section-card"><h2>Circle categories</h2><p>Separate category shortcuts shown under the hero.</p>${h.circles.map((x,i)=>`<div class="repeat-row"><input id="circleLabel${i}" value="${attr(x.label)}" placeholder="Label"><select id="circleTarget${i}">${COLLECTIONS.map(c=>`<option value="${c[0]}" ${c[0]===x.target?'selected':''}>${c[1]}</option>`).join('')}</select><input id="circleImage${i}" value="${attr(x.image||'')}" placeholder="Optional image URL (falls back to product)"><button class="btn ghost small" onclick="pickMedia('circleImage${i}')">Image</button></div>`).join('')}</div><div class="section-card"><h2>Trending Styles</h2><div class="form-grid"><div class="field"><label>Eyebrow</label><input id="trendEye" value="${attr(h.trending.eyebrow)}"></div><div class="field"><label>Heading</label><input id="trendTitle" value="${attr(h.trending. function arrayEditor(key,title,arr,fields){return `<div class="section-card"><h2>${title}</h2><p>Edit every card independently.</p>${arr.map((x,i)=>`<div style="border-top:1px solid #edf0f2;padding:13px 0"><b style="font-size:10px">Block ${i+1}</b><div class="form-grid" style="margin-top:8px">${fields.map(f=>`<div class="field ${f==='image'?'wide':''}"><label>${f}</label>${f==='target'?`<select id="${key}_${f}_${i}">${COLLECTIONS.map(c=>`<option value="${c[0]}" ${c[0]===x[f]?'selected':''}>${c[1]}</option>`).join('')}</select>`:`<div style="display:flex;gap:6px"><input id="${key}_${f}_${i}" value="${attr(x[f]||'')}">${f==='image'?`<button class="btn ghost small" type="button" onclick="pickMedia('${key}_${f}_${i}')">Library</button>`:''}</div>`}</div>`).join('')}</div></div>`).join('')}</div>`}

function openDiscount(i=-1){const d=i>=0?cms.discounts[i]:{code:'',type:'percent',value:10,min:0,max:0,active:true};openModal(`<div class="modal-head"><div><div class="label">DISCOUNT</div><h2>${i>=0?'Edit code':'New code'}</h2></div><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveDiscount(event,${i})"><div class="field"><label>Code</label><input id="dCode" value="${attr(d.code)}" required></div><div class="field"><label>Type</label><select id="dType"><option value="percent" ${d.type==='percent'?'selected':''}>Percentage</option><option value="fixed" ${d.type==='fixed'?'selected':''}>Fixed amount</option></select></div><div class="form-grid"><div class="field"><label>Value</label><input id="dValue" type="number" value="${d.value}"></div><div class="field"><label>Minimum cart</label><input id="dMin" type="number" value="${d.min||0}"></div><div class="field"><label>Max discount</label><input id="dMax" type="number" value="${d.max||0}"></div><div class="field"><label>Status</label><select id="dActive"><option value="1" ${d.active?'selected':''}>Active</option><option value="0" ${!d.active?'selected':''}>Paused</option></select></div></div><div class="head-actions"><button class="btn">Save code</button>${i>=0?`<button type="button" class="btn danger" onclick="deleteDiscount(${i})">Delete</button>`:''}</div></form>`)}
function saveDiscount(e,i){e.preventDefault();const d={code:document.getElementById('dCode').value.trim().toUpperCase(),type:document.getElementById('dType').value,value:Number(document.getElementById('dValue').value),min:Number(document.getElementById('dMin').value),max:Number(document.getElementById('dMax').value),active:document.getElementById('dActive').value==='1'};if(i>=0)cms.discounts[i]=d;else cms.discounts.push(d);commit('Discount saved');closeModal();show('discounts')}
function deleteDiscount(i){cms.discounts.splice(i,1);commit('Discount deleted');closeModal();show('discounts')}
function uniqueCustomers(){const m=new Map();orders.forEach(o=>{const k=(o.email||o.phone||o.name||'guest').toLowerCase();if(!m.has(k))m.set(k,{name:o.name,email:o.email,phone:o.phone,orders:0,spend:0,last:o.date});const c=m.get(k);c.orders++;c.spend+=Number(o.total||0);if(new Date(o.date)>new Date(c.last))c.last=o.date});const p=load('aehran_profile',null);if(p){const k=(p.email||p.phone||p.name||'profile').toLowerCase();if(!m.has(k))m.set(k,{name:p.name,email:p.email,phone:p.phone,orders:0,spend:0,last:null})}return [...m.values()]}

function reviewsPage(){const list=[];Object.entries(reviewsDB).forEach(([pid,arr])=>(arr||[]).forEach((r,i)=>list.push({pid,i,...r})));return `${head('Reviews','Moderate customer-submitted product reviews.') }<div class="table-wrap"><table><thead><tr><th>Product</th><th>Reviewer</th><th>Rating</th><th>Review</th><th>Date</th><th></th></tr></thead><tbody>${list.map(r=>{const p=products.find(x=>x.id===r.pid);return `<tr><td>${esc(p?.name||r.pid)}</td><td><b>${esc(r.name)}</b><br><small>${esc(r.title||'')}</small></td><td>★ ${r.stars}</td><td style="max-width:340px">${esc(r.text)}</td><td>${r.date?new Date(r.date).toLocaleDateString('en-IN'):'—'}</td><td><button class="btn danger small" onclick="deleteReview('${r.pid}',${r.i})">Delete</button></td></tr>`}).join('')||`<tr><td colspan="6"><div class="empty">No submitted reviews yet.</div></td></tr>`}</tbody></table></div>`}
