arget:'sale',visible:true,mobileVisible:true}];}else{const targets=['home','new','waistcoat-sets','wedding','minimal','father-son','sale'];const labels=['Home','New','Waistcoat','Wedding','Collections','Father & Son','Sale'];const mobile=[true,true,false,true,true,false,true];cms.nav=cms.nav.map((x,i)=>({...x,label:labels[i],target:targets[i],visible:x?.visible!==false,mobileVisible:x?.mobileVisible!==false?mobile[i]:false}));}cms.display={...clone(DEFAULT_CMS.display),...(cms.display||{})};cms.categoryRules={...clone(DEFAULT_CMS.categoryRules),...(cms.categoryRules||{})};save('aehran_products',products);save('aehran_cms',cms)}migrate();

function fallbackPasswordHash(pass,salt){const raw=String(salt||'')+'|'+String(pass||'');let h=2166136261>>>0;for(let r=0;r<2500;r++){for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)>>>0}h^=r;h=Math.imul(h,2246822519)>>>0}return 'fallback-'+h.toString(16)}
async function passwordHash(pass,salt){const raw=String(salt||'')+'|'+String(pass||'');if(window.crypto?.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}return fallbackPasswordHash(pass,salt)}

der assignment is on.':'Manual shipment creation only.'}</p><div class="meta">Backend: ${esc(p.backendUrl||'Not set')}<br>Production key: ${esc(p.secretName||'Server environment')} (server-side)<br>Pickup: ${esc(p.pickup?.address||'Not set')}, ${esc(p.pickup?.city||'')} ${esc(p.pickup?.pincode||'')}<br>Return: ${esc(p.returnAddress?.sameAsPickup?'Same as pickup':(p.returnAddress?.address||'Not set'))}<br>Service: ${esc(p.serviceType||'standard')} · ${esc(p.environment||'production')} · Priority ${Number(p.priority||99)}</div><div class="head-actions">${cfg?`<button class="btn ghost small" onclick="openDeliveryPartner('${p.id}')">Configure</button>`:''}<button class="btn ghost small" onclick="testDeliveryPartner('${p.id}')">Test</button>${p.trackingPortal?`<button class="btn ghost small" onclick="window.open('${attr(p.trackingPortal)}','_blank')">Tracking portal ↗</button>`:''}</div></div>`).join('')}</div><div class="section-card" style="margin-top:16px"><h2>Shipments & tracking</h2><p>Create a shipment, refresh courier tracking or open the courier tracking link returned by your adapter.</p><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Partner</th><th>AWB / Tracking</th><th>Delivery status</th><th>Updated</th><th></th></tr></thead><tbody>${deliveryOrders().map(o=>{const p=deliveryPartnerById(o.deliveryPartnerId);return `<tr><td><b>${esc(o.id)}</b><br><small>${esc(o.status||'')}</small></td><td>${esc(o.name||o.customer_name||'—')}<br><small>${esc(o.phone||'')}</small></td><td>${esc(o.courier||p?.name||'Not assigned')}</td><td>${esc(o.awb||o.trackingId||'—')}</td><td><span class="delivery-status ${/delivered/i.test(o.deliveryStatus||'')?'ok':o.deliveryStatus?'warn':''}">${esc(o.deliveryStatus||'Not created')}</span></td><td>${o.deliveryUpdatedAt?new Date(o.deliveryUpdatedAt).toLocaleString('en-IN'):'—'}</td><td><div class="head-actions">${!o.deliveryPartnerId&&!o.awb&&!o.trackingId?`<button class="btn small" onclick="createDeliveryForOrder('${o.id}')">Create delivery</button>`:`<button class="btn ghost small" onclick="refreshDeliveryTracking('${o.id}')">Refresh</button>`}${o.trackingUrl?`<button class="btn ghost small" onclick="window.open('${attr(o.trackingUrl)}','_blank')">Track ↗</button>`:''}</div></td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">No orders are waiting for delivery.</div></td></tr>'}</tbody></table></div></div>`}
function openDeliveryPartner(id=''){if(!canConfigureDelivery()){toast('Manager or Admin permission required');return}const p=deliveryPartnerById(id),pu=p?.pickup||{},ra=p?.returnAddress||{};openModal(`<div class="modal-head"><div><div class="label">${p?'DELIVERY PARTNER':'NEW PARTNER'}</div><h2>${p?esc(p.name):'Add delivery partner'}</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field"><label>Name</label><input id="dpName" value="${attr(p?.name||'')}" placeholder="Shadowfax"></div><div class="field"><label>Code</label><input id="dpCode" value="${attr(p?.code||'')}" placeholder="shadowfax"></div><div class="field wide"><label>Backend API URL</label><input id="dpUrl" value="${attr(p?.backendUrl||'/api/delivery/')}" placeholder="/api/delivery/shadowfax"></div><div class="field"><label>Production token / secret name</label><input id="dpSecret" value="${attr(p?.secretName||'SHADOWFAX_PRODUCTION_TOKEN')}" placeholder="SHADOWFAX_PRODUCTION_TOKEN"></div><div class="field"><label>Environment</label><select id="dpEnvironment"><option value="production" ${(p?.environment||'production')==='production'?'selected':''}>Production</option><option value="staging" ${p?.environment==='staging'?'selected':''}>Staging</option></select></div><div class="field"><label>Service type</label><input id="dpService" value="${attr(p?.serviceType||'standard')}" placeholder="standard"></div><div class="field"><label>Priority</label><input id="dpPriority" type="number" min="1" value="${Number(p?.priority||deliveryPartners.length+1)}"></div><div class="field wide"><label>Tracking portal (optional)</label><input id="dpPortal" value="${attr(p?.trackingPortal||'')}" placeholder="Tracking portal"></div><div class="field wide"><h3 style="margin:8px 0 0">Pickup / Warehouse</h3></div><div class="field"><label>Name / Business</label><input id="dpPickupName" value="${attr(pu.name||'AEHRAN')}"></div><div class="field"><label>Phone</label><input id="dpPickupContact" inputmode="tel" value="${attr(pu.contact||'')}" placeholder="Required before live shipment"></div><div class="field wide"><label>Address</label><input id="dpPickupAddress" value="${attr(pu.address||'Husnain Masjid')}"></div><div class="field"><label>City</label><input id="dpPickupCity" value="${attr(pu.city||'Kolkata')}"></div><div class="field"><label>State</label><input id="dpPickupState" value="${attr(pu.state||'West Bengal')}"></div><div class="field"><label>Pincode</label><input id="dpPickupPincode" inputmode="numeric" maxlength="6" value="${attr(pu.pincode||'700039')}"></div><div class="field wide"><h3 style="margin:8px 0 0">Return Address</h3><label class="check"><input id="dpReturnSame" type="checkbox" ${ra.sameAsPickup!==false?'checked':''} onchange="toggleDeliveryReturnFields()"> Same as pickup address</label></div><div id="dpReturnFields" class="form-grid field wide" style="padding:0;border:0;${ra.sameAsPickup!==false?'display:none':''}"><div class="field"><label>Name / Business</label><input id="dpReturnName" value="${attr(ra.name||pu.name||'AEHRAN')}"></div><div class="field"><label>Phone</label><input id="dpReturnContact" inputmode="tel" value="${attr(ra.contact||pu.contact||'')}"></div><div class="field wide"><label>Address</label><input id="dpReturnAddress" value="${attr(ra.address||pu.address||'Husnain Masjid')}"></div><div class="field"><label>City</label><input id="dpReturnCity" value="${attr(ra.city||pu.city||'Kolkata')}"></div><div class="field"><label>State</label><input id="dpReturnState" value="${attr(ra.state||pu.state||'West Bengal')}"></div><div class="field"><label>Pincode</label><input id="dpReturnPincode" inputmode="numeric" maxlength="6" value="${attr(ra.pincode||pu.pincode||'700039')}"></div></div><div class="field wide"><label class="check"><input id="dpEnabled" type="checkbox" ${p?.enabled?'checked':''}> Enable this partner</label><label class="check"><input id="dpAuto" type="checkbox" ${p?.autoAssign?'checked':''}> Automatically create delivery for new eligible orders</label></div></div><div class="secret-note" style="margin:12px 0"><b>Production key:</b> kept server-side under the secret name above. Pickup and return settings can be changed here anytime.</div><button class="btn full" onclick="saveDeliveryPartner('${id}')">Save partner</button>`)}
function toggleDeliveryReturnFields(){const same=document.getElementById('dpReturnSame')?.checked,box=document.getElementById('dpReturnFields');if(box)box.style.display=same?'none':''}
function saveDeliveryPartner(id=''){if(!canConfigureDelivery())return;const name=document.getElementById('dpName').value.trim(),code=slug(document.getElementById('dpCode').value||name),backendUrl=document.getElementById('dpUrl').value.trim().replace(/\/+$/,''),secretName=document.getElementById('dpSecret').value.trim(),environment=document.getElementById('dpEnvironment').value,serviceType=document.getElementById('dpService').value.trim()||'standard',priority=Math.max(1,Number(document.getElementById('dpPriority').value)||99),trackingPortal=document.getElementById('dpPortal').value.trim(),enabled=document.getElementById('dpEnabled').checked,autoAssign=document.getElementById('dpAuto').checked;const pickup={name:document.getElementById('dpPickupName').value.trim(),contact:document.getElementById('dpPickupContact').value.trim(),address:document.getElementById('dpPickupAddress').value.trim(),city:document.getElementById('dpPickupCity').value.trim(),state:document.getElementById('dpPickupState').value.trim(),pincode:document.getElementById('dpPickupPincode').value.trim()};const sameAsPickup=document.getElementById('dpReturnSame').checked;const returnAddress=sameAsPickup?{...pickup,sameAsPickup:true}:{sameAsPickup:false,name:document.getElementById('dpReturnName').value.trim(),contact:document.getElementById('dpReturnContact').value.trim(),address:document.getElementById('dpReturnAddress').value.trim(),city:document.getElementById('dpReturnCity').value.trim(),state:document.getElementById('dpReturnState').value.trim(),pincode:document.getElementById('dpReturnPincode').value.trim()};if(!name||!code||!backendUrl){toast('Name, code and backend URL are required');return}if(!pickup.address||!pickup.city||!/^[1-9][0-9]{5}$/.test(pickup.pincode)){toast('Enter a valid pickup address, city and 6-digit pincode');return}if(!returnAddress.address||!returnAddress.city||!/^[1-9][0-9]{5}$/.test(returnAddress.pincode)){toast('Enter a valid return address, city and 6-digit pincode');return}let p=deliveryPartnerById(id);if(!p){p={id:'dp-'+Date.now().toString(36)};deliveryPartners.push(p)}Object.assign(p,{name,code,backendUrl,secretName,environment,serviceType,priority,trackingPortal,enabled,autoAssign,pickup,returnAddress});save('aehran_delivery_partners',deliveryPartners);closeModal();toast('Delivery partner saved');show('deliveryPartners');if(enabled&&autoAssign)scheduleAutoDeliveries()}
function shipmentPayload(o,p){const pickup=p.pickup||{},ret=p.returnAddress?.sameAsPickup?{...pickup,sameAsPickup:true}:(p.returnAddress||pickup);return {provider:p.code,order:{id:o.id,date:o.date,name:o.name||o.customer_name,email:o.email,phone:o.phone,address:o.address||o.shippingAddress,total:Number(o.total??o.total_amount??0),payment:o.payment||o.payment_mode,items:o.items||o.products||[]},pickup:{...pickup},returnAddress:{...ret},options:{serviceType:p.serviceType||'standard',environment:p.environment||'production'}}}
function applyShipmentResult(o,p,d){o.deliveryPartnerId=p.id;o.courier=d.courier||d.partner||p.name;o.awb=d.awb||d.awbNumber||o.awb||'';o.trackingId=d.trackingId||d.shipmentId||d.id||o.trackingId||o.awb||'';o.trackingUrl=d.trackingUrl||d.trackUrl||o.trackingUrl||'';o.deliveryStatus=d.status||d.deliveryStatus||'Created';o.deliveryUpdatedAt=new Date().toISOString();o.deliveryError='';save('aehran_orders',orders);notify('delivery')}
async function createDeliveryForOrder(id,silent=false){const o=orders.find(x=>String(x.id)===String(id));if(!o)return false;if(o.deliveryPartnerId||o.awb||o.trackingId)return true;const p=deliveryPartners.filter(x=>x.enabled).sort((a,b)=>(a.priority||99)-(b.priority||99)).find(x=>x.autoAssign)||deliveryPartners.filter(x=>x.enabled).sort((a,b)=>(a.priority||99)-(b.priority||99))[0];if(!p){if(!silent)toast('Enable a delivery partner first');return false}if(!p.backendUrl){if(!silent)toast('Set '+p.name+' backend URL first');return false}o.deliveryAutoAttemptedAt=new Date().toISOString();save('aehran_orders',orders);try{const r=await fetch(p.backendUrl.replace(/\/+$/,'')+'/shipments',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(shipmentPayload(o,p))});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));applyShipmentResult(o,p,d);if(!silent)toast('Delivery created with '+p.name);if(current==='orders')renderOrdersTable();if(current==='deliveryPartners')show('deliveryPartners');return true}catch(e){o.deliveryError=String(e.message||e);o.deliveryUpdatedAt=new Date().toISOString();save('aehran_orders',orders);if(!silent)toast('Delivery creation failed: '+o.deliveryError.slice(0,90));return false}}
async function refreshDeliveryTracking(id,silent=false){const o=orders.find(x=>String(x.id)===String(id));if(!o)return false;const p=deliveryPartnerById(o.deliveryPartnerId)||deliveryPartners.find(x=>x.enabled);const key=o.trackingId||o.awb;if(!p?.backendUrl||!key){if(!silent)toast('Tracking data is not available yet');return false}try{const r=await fetch(p.backendUrl.replace(/\/+$/,'')+'/shipments/'+encodeURIComponent(key),{headers:{'Accept':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));applyShipmentResult(o,p,{...d,awb:d.awb||o.awb,trackingId:d.trackingId||o.trackingId,trackingUrl:d.trackingUrl||o.trackingUrl});if(/delivered/i.test(o.deliveryStatus||''))o.status='Delivered';else if(/out for delivery|in transit|shipped|picked/i.test(o.deliveryStatus||'')&&o.status!=='Delivered')o.status='Shipped';save('aehran_orders',orders);if(!silent)toast('Tracking updated');if(current==='orders')renderOrdersTable();if(current==='deliveryPartners')show('deliveryPartners');return true}catch(e){if(!silent)toast('Tracking refresh failed: '+String(e.message||e).slice(0,90));return false}}
async function autoAssignPendingDeliveries(silent=false){if(window.__aehranAutoDeliveryRunning)return;const p=deliveryPartners.filter(x=>x.enabled&&x.autoAssign).sort((a,b)=>(a.priority||99)-(b.priority||99))[0];if(!p){if(!silent)toast('No auto-delivery partner is enabled');return}const pending=orders.filter(o=>['Placed','Confirmed','Packed'].includes(o.status)&&!o.deliveryPartnerId&&!o.awb&&!o.trackingId&&!o.deliveryAutoAttemptedAt);if(!pending.length){if(!silent)toast('No new orders need automatic delivery');return}window.__aehranAutoDeliveryRunning=true;let ok=0;try{for(const o of pending){if(await createDeliveryForOrder(o.id,true))ok++}}finally{window.__aehranAutoDeliveryRunning=false}if(!silent)toast(ok+' of '+pending.length+' deliveries created');if(current==='deliveryPartners')show('deliveryPartners');if(current==='orders')renderOrdersTable()}
function scheduleAutoDeliveries(){clearTimeout(window.__aehranAutoDeliveryTimer);window.__aehranAutoDeliveryTimer=setTimeout(()=>autoAssignPendingDeliveries(true),650)}
function orderDeliveryCell(o){const p=deliveryPartnerById(o.deliveryPartnerId),name=o.courier||p?.name||'Not assigned',code=o.awb||o.trackingId||'';return `${esc(name)}${code?`<br><small>${esc(code)}</small>`:''}${o.deliveryStatus?`<br><span class="delivery-status ${/delivered/i.test(o.deliveryStatus)?'ok':'warn'}">${esc(o.deliveryStatus)}</span>`:''}`}
function orderDeliveryActions(o){return !o.deliveryPartnerId&&!o.awb&&!o.trackingId?`<button class="btn ghost small" onclick="createDeliveryForOrder('${o.id}')">Create delivery</button>`:`<button class="btn ghost small" onclick="refreshDeliveryTracking('${o.id}')">Track delivery</button>${o.trackingUrl?`<button class="btn ghost small" onclick="window.open('${attr(o.trackingUrl)}','_blank')">Open tracking ↗</button>`:''}`}

function ordersPage(){ensureOrderLabels();return `${head('Orders','Every order gets an automatic label, with optional courier creation and live tracking through Delivery Partners.',`<button class="btn ghost" onclick="show('deliveryPartners')">Delivery partners</button><button class="btn ghost" onclick="exportOrders()">Export CSV</button>`)}<div class="section-card" style="margin-bottom:14px"><h2>Shipping document defaults</h2><p>Used when an order does not already contain courier/seller fields. Courier AWB and live status can be populated by the delivery partner adapter.</p><div class="form-grid"><div class="field"><label>Seller / Sold By</label><input id="labelSeller" value="${attr(localStorage.getItem('aehran_label_seller')||'AEHRAN — THE ROYAL OF ETHNIC')}" onchange="localStorage.setItem('aehran_label_seller',this.value);toast('Seller saved')"></div><div class="field"><label>Seller address</label><input id="labelSellerAddress" value="${attr(localStorage.getItem('aehran_label_seller_address')||'Kolkata, West Bengal, India')}" onchange="localStorage.setItem('aehran_label_seller_address',this.value);toast('Seller address saved')"></div><div class="field"><label>GSTIN (optional)</label><input id="labelGstin" value="${attr(localStorage.getItem('aehran_label_gstin')||'')}" placeholder="GSTIN if applicable" onchange="localStorage.setItem('aehran_label_gstin',this.value);toast('GSTIN saved')"></div><div class="field"><label>Default courier</label><input id="labelCourier" value="${attr(localStorage.getItem('aehran_label_courier')||'AEHRAN Logistics')}" onchange="localStorage.setItem('aehran_label_courier',this.value);toast('Courier default saved')"></div><div class="field"><label>Sorting hub</label><input id="labelHub" value="${attr(localStorage.getItem('aehran_label_hub')||'KOL')}" onchange="localStorage.setItem('aehran_label_hub',this.value);toast('Sorting hub saved')"></div><div class="field"><label>Class / route code</label><input id="labelClass" value="${attr(localStorage.getItem('aehran_label_class')||'E')}" maxlength="6" onchange="localStorage.setItem('aehran_label_class',this.value);toast('Class code saved')"></div></div></div><div class="search-row"><input class="input" id="orderSearch" placeholder="Search order, name, email..." oninput="renderOrdersTable()"><select id="orderStatus" onchange="renderOrdersTable()"><option value="">All statuses</option>${['Placed','Confirmed','Packed','Shipped','Delivered','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select><button class="btn ghost small" onclick="autoAssignPendingDeliveries()">Run auto-delivery</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th><th>Delivery</th><th></th></tr></thead><tbody id="ordersTbody"></tbody></table></div><script>setTimeout(renderOrdersTable,0)<\/script>`}
function renderOrdersTable(){const tb=document.getElementById('ordersTbody');if(!tb)return;const q=(document.getElementById('orderSearch')?.value||'').toLowerCase(),st=document.getElementById('orderStatus')?.value||'';const list=orders.slice().reverse().filter(o=>(!st||o.status===st)&&JSON.stringify(o).toLowerCase().includes(q));tb.innerHTML=list.map(o=>`<tr><td><b>${esc(o.id)}</b><br><small>${o.items?.length||o.products?.length||0} items</small><br><span class="label-ready">Label ready</span></td><td>${esc(o.name||o.customer_name||'—')}<br><small>${esc(o.email||'')}</small></td><td>${new Date(o.date||Date.now()).toLocaleDateString('en-IN')}</td><td><b>${money(o.total??o.total_amount??0)}</b></td><td>${esc(o.payment||o.payment_mode||'')}</td><td><select onchange="setOrderStatus('${o.id}',this.value)">${['Placed','Confirmed','Packed','Shipped','Delivered','Cancelled'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${orderDeliveryCell(o)}</td><td><div class="order-actions"><button class="btn ghost small" onclick="orderDetails('${o.id}')">View</button>${orderDeliveryActions(o)}<button class="btn small gold" onclick="downloadOrderPack('${o.id}')">Download PDF & Label</button><button class="btn ghost small" onclick="previewOrderPack('${o.id}')">Preview A4</button><button class="btn ghost small" onclick="printOrderPack('${o.id}')">Print A4</button><button class="btn small" onclick="downloadOrderPDF('${o.id}')">Order PDF</button><button class="btn ghost small" onclick="downloadOrderLabel('${o.id}')">Label only</button></div></td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">No matching orders.</div></td></tr>`}
function setOrderStatus(id,status){const o=orders.find(x=>x.id===id);if(o){o.status=status;commit('Order '+id+' updated');renderOrdersTable()}}
function orderDetails(id){const o=orders.find(x=>x.id===id);if(!o)return;const rr=returnsDB.find(r=>r.orderId===o.id),p=deliveryPartnerById(o.deliveryPartnerId);openModal(`<div class="modal-head"><div><div class="label">ORDER ${esc(o.id)}</div><h2>${esc(o.name||'Customer')}</h2></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${orderDeliveryActions(o)}<button class="btn small gold" onclick="downloadOrderPack('${o.id}')">Download PDF & Label</button><button class="btn ghost small" onclick="previewOrderPack('${o.id}')">Preview A4</button><button class="btn ghost small" onclick="printOrderPack('${o.id}')">Print A4</button><button class="btn small" onclick="downloadOrderPDF('${o.id}')">Order PDF</button><button class="btn ghost small" onclick="downloadOrderLabel('${o.id}')">Label only</button><button class="close" onclick="closeModal()">✕</button></div></div><div class="section-card"><h2>Customer & delivery address</h2><p>${esc(o.email||'')} · ${esc(o.phone||'')}</p><div style="font-size:11px;line-height:1.7">${esc(o.address||'')}</div></div><div class="section-card"><h2>Courier delivery</h2><div class="list-row"><div><b>${esc(o.courier||p?.name||'Not assigned')}</b><small>AWB / Tracking: ${esc(o.awb||o.trackingId||'—')}</small></div><span class="delivery-status ${/delivered/i.test(o.deliveryStatus||'')?'ok':o.deliveryStatus?'warn':''}">${esc(o.deliveryStatus||'Not created')}</span></div>${o.deliveryError?`<div class="backend-note" style="margin-top:10px">Last courier error: ${esc(o.deliveryError)}</div>`:''}</div><div class="section-card"><h2>Items</h2>${(o.items||[]).map(i=>`<div class="list-row"><div><b>${esc(i.name)}</b><small>${i.fatherSize?`Father Size: ${esc(i.fatherSize)} · Son Size: ${esc(i.sonSize)} · `:`Size ${esc(i.size||'')} · `}${esc(i.color||'')} · Qty ${i.qty}</small></div><b>${money(i.price*i.qty)}</b></div>`).join('')}</div><div class="section-card"><h2>Payment & total</h2><div class="list-row"><div><b>${esc(o.payment||'')}</b><small>Coupon: ${esc(o.coupon||'None')}</small></div><strong>${money(o.total)}</strong></div></div>${rr?`<div class="section-card"><h2>Return / refund</h2><div class="list-row"><div><b>${esc(rr.status||'Requested')}</b><small>${esc(rr.reason||'')}</small></div><strong>${money(rr.amount||0)}</strong></div></div>`:''}`)}
function __aehranPdfMoney(n){return 'INR '+Math.round(Number(n)||0).toLocaleString('en-IN')}
function __aehranWrap(ctx,text,maxWidth){text=String(text??'—');const words=text.split(/\s+/),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines.length?lines:['—']}
function __aehranDrawWrapped(ctx,text,x,y,maxWidth,lineHeight,maxLines){const lines=__aehranWrap(ctx,text,maxWidth).slice(0,maxLines||99);lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));return y+lines.length*lineHeight}
function __aehranPdfSafeDate(v){try{return new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}catch(e){return String(v||'—')}}

async function hydrateBannerV2Images(retries=8){
  try{
    const imgs=[...document.querySelectorAll('.banner-v2-preview img[data-dbimg]')];
    if(!imgs.length)return;
    const resolver=window.__aehranResolveDbImage;
    if(typeof resolver!=='function'){
      if(retries>0)setTimeout(()=>hydrateBannerV2Images(retries-1),250);
      return;
    }
    await Promise.all(imgs.map(async im=>{
      const raw=im.getAttribute('data-dbimg')||'';
      if(!raw.startsWith('dbimg:'))return;
      const resolved=await resolver(raw);
      const box=im.closest('.banner-v2-preview');
      if(resolved){
        im.onerror=null;
        im.src=resolved;
        im.style.display='block';
        box?.classList.remove('failed');
        box?.querySelector(':scope > span')?.remove();
      }else{
        im.style.display='none';
        box?.classList.add('failed');
      }
    }));
  }catch(e){console.warn('Banner preview hydration failed',e)}
}

}
async function deleteCollection(key){
  const item=COLLECTIONS.find(x=>x[0]===key);if(!item)return;
  if(COLLECTIONS.length<=1)return toast('At least one collection must remain');
  if(!confirm(`Delete collection “${item[1]}”? Products will be moved to New Arrivals.`))return;
  const previousCollections=COLLECTIONS.map(x=>x.slice());
  const previousProducts=products.map(p=>({...p,collections:Array.isArray(p.collections)?p.collections.slice():[]}));
  try{
    const nextCollections=COLLECTIONS.filter(x=>x[0]!==key);
    const fallback=nextCollections.find(x=>x[0]==='new')?.[0]||nextCollections[0]?.[0]||'';
    const nextProducts=products.map(p=>{
      const copy={...p,collections:Array.isArray(p.collections)?p.collections.filter(x=>x!==key):[]};
      if(copy.cat===key)copy.cat=fallback;
      if(fallback&&!copy.collections.includes(fallback))copy.collections.push(fallback);
      return copy;
    });
    COLLECTIONS=nextCollections;
    products=nextProducts;
    save('aehran_collections',COLLECTIONS);save('aehran_products',products);notify();
    __aehranCollectionsWritePending=true;
    show('collections');
    toast('Collection deleted — tap Save changes to sync it');
  }catch(err){
    console.error('Collection delete failed',err);
    COLLECTIONS=previousCollections;products=previousProducts;
    save('aehran_collections',COLLECTIONS);save('aehran_products',products);
    __aehranCollectionsWritePending=false;toast('Delete failed — changes were not applied');show('collections');
  }
}
async function saveCollectionsChanges(){
  const btn=document.getElementById('saveCollectionsBtn');
  const old=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent='Saving…'}
  try{
    save('aehran_collections',COLLECTIONS);
    save('aehran_products',products);
    __aehranCollectionsWritePending=true;
    let ok=false;
    try{
      if(typeof __aehranSaveCollectionsReliable==='function'){await __aehranSaveCollectionsReliable(COLLECTIONS);ok=true}
      else if(typeof window.__aehranFirebaseCollectionsSave==='function'){await window.__aehranFirebaseCollectionsSave(COLLECTIONS);ok=true}
    }catch(e){console.warn('Primary collection save failed',e)}
    try{
      if(typeof window.__aehranFirebaseAdminSave==='function' && window.AEHRAN_ADMIN_BRIDGE?.snapshot){
        await window.__aehranFirebaseAdminSave(window.AEHRAN_ADMIN_BRIDGE.snapshot());
        ok=true;
      }
    }catch(e){console.warn('Full admin sync failed while saving collections',e)}
    try{
      const r=await fetch('https://aehran123-default-rtdb.asia-southeast1.firebasedatabase.app/aehran_store_v3/collections.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(COLLECTIONS),cache:'no-store'});
      if(r.ok)ok=true; else console.warn('Collection REST save returned',r.status)
    }catch(e){console.warn('Collection REST save failed',e)}
    if(!ok)throw new Error('No collection cloud save method succeeded');
    __aehranCollectionsWritePending=false;
    status?.('Firebase Live');
    toast('Collection changes saved');
    show('collections');
  }catch(e){
    console.error('Collection Save Changes failed',e);
    __aehranCollectionsWritePending=false;
    toast('Save failed — local changes are kept. Please try again.');
  }finally{
    if(btn){btn.disabled=false;btn.textContent=old||'Save changes'}
  }
}

function saveProduct(e,id){e.preventDefault();let variants=[];try{variants=JSON.parse(document.getElementById('pVariants').value||'[]');if(!Array.isArray(variants))throw 0}catch(_){return toast('Colour variants JSON is invalid')}const slots={front:document.getElementById('pImg_front')?.value.trim()||'',back:document.getElementById('pImg_back')?.value.trim()||'',angle1:document.getElementById('pImg_angle1')?.value.trim()||'',angle2:document.getElementById('pImg_angle2')?.value.trim()||'',angle3:document.getElementById('pImg_angle3')?.value.trim()||''};const customImages=[...document.querySelectorAll('[data-product-image-slot^="custom_"]')].map(x=>x.value.trim()).filter(Boolean);const gallery=[slots.front,slots.back,slots.angle1,slots.angle2,slots.angle3,...customImages,...document.getElementById('pImgs').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)].filter(Boolean);const obj={id:id||'product-'+Date.now(),name:document.getElementById('pName').value.trim(),sku:document.getElementById('pSku').value.trim()||'AHR-'+Date.now().toString().slice(-7),cat:document.getElementById('pCat').value,audience:document.getElementById('pAudience').value,productType:document.getElementById('pType').value,collections:[...document.querySelectorAll('input[name=pCollection]:checked')].map(x=>x.value),price:Number(document.getElementById('pPrice').value),old:Number(document.getElementById('pOld').value),stock:Number(document.getElementById('pStock').value),color:document.getElementById('pColor').value.trim(),sizes:[...document.querySelectorAll('input[name=pSize]:checked')].map(x=>x.value),isCombo:!!document.getElementById('pIsCombo')?.checked,fatherSizes:[...document.querySelectorAll('input[name=fatherSize]:checked')].map(x=>x.value),sonSizes:[...document.querySelectorAll('input[name=sonSize]:checked')].map(x=>x.value),tag:document.getElementById('pTag').value.trim()||'New',tags:parseMulti(document.getElementById('pTags').value),rating:Number(document.getElementById('pRating').value)|| function getMedia(){const map=new Map();const add=(url,name,source,custom=false)=>{if(url&&!map.has(url))map.set(url,{url,name,source,custom})};products.forEach(p=>{add(p.img,p.name,'Product');(p.imgs||[]).forEach((u,i)=>add(u,p.name+' '+(i+1),'Gallery'))});add(cms.branding.logo,'Header logo','Branding');add(cms.branding.footerLogo,'Footer logo','Branding');bannerList('desktop').concat(bannerList('mobile')).forEach((x)=>add(x.image,x.label,'Banner Manager'));(cms.home?.circles||[]).forEach(x=>add(x.image,x.label,'Circle'));(cms.home?.editorials||[]).forEach(x=>add(x.image,x.title,'Editorial'));(cms.home?.occasions||[]).forEach(x=>add(x.image,x.title,'Occasion'));(cms.home?.films||[]).forEach(x=>add(x.image,x.title,'Film'));media.forEach(x=>add(x.url,x.name||'Uploaded image','Uploaded',true));return [...map.values()]}
function mediaUploadDialog(){openModal(`<div class="modal-head"><div><div class="label">MEDIA</div><h2>Upload images</h2></div><button class="close" id="mediaUploadClose" onclick="closeModal()">✕</button></div><div class="field"><label>Image files <span style="font-weight:700;color:var(--gold)">(up to 100 at once)</span></label><input type="file" id="mediaFile" accept="image/*" multiple onchange="mediaFilesChanged(this)"><small id="mediaFileCount" style="display:block;margin-top:6px;color:var(--muted)">No files selected</small></div><div class="field"><label>Name / prefix <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="mediaName" placeholder="e.g. Wedding campaign"></div><button class="btn" id="mediaUploadBtn" onclick="saveMediaUpload()">Upload to library</button><p class="mini-note">Select up to 100 images in one go. Images are optimized in the browser and uploaded in small parallel batches so the upload is faster and more reliable. If one image fails, the successful images are still added to the library.</p>`)}
function mediaFilesChanged(input){const files=[...(input?.files||[])];const count=document.getElementById('mediaFileCount');if(files.length>100){if(input)input.value='';if(count)count.textContent='Maximum 100 images can be selected at once.';toast('Maximum 100 images per upload');return}if(count)count.textContent=files.length?`${files.length} image${files.length===1?'':'s'} selected`:'No files selected'}
function waitForMediaUploader(timeout=15000){return new Promise((resolve,reject)=>{const started=Date.now();const check=()=>{if(typeof window.__aehranUploadDbImage==='function')return resolve();if(Date.now()-started>=timeout)return reject(new Error('Image service is still loading'));setTimeout(check,150) };check()})}
async function saveMediaUpload(){const input=document.getElementById('mediaFile');const files=[...(input?.files||[])];if(!files.length)return toast('Choose at least one image first');if(files.length>100){if(input)input.value='';return toast('Maximum 100 images per upload')};const btn=document.getElementById('mediaUploadBtn'),closeBtn=document.getElementById('mediaUploadClose');if(btn)btn.disabled=true;if(closeBtn)closeBtn.disabled=true;window.__aehranMediaUploadActive=true;try{toast('Connecting to image service…');await waitForMediaUploader();const prefix=(document.getElementById('mediaName')?.value||'').trim();const results=new Array(files.length);let next=0;const persistOne=(item)=>{if(!item?.ok)return;const byUrl=new Map(media.map(x=>[x.url,x]));byUrl.set(item.url,{url:item.url,name:item.name,source:'Admin upload',custom:true});media=[...byUrl.values()];save('aehran_media',media)};const uploadOne=async(i)=>{const f=files[i];let lastErr=null;for(let attempt=1;attempt<=3;attempt++){try{toast(`Uploading image ${i+1} of ${files.length}…`);const data=await fileToData(f,1400,.78);const name=prefix?(files.length===1?prefix:`${prefix} ${String(i+1).padStart(2,'0')}`):f.name;const ref=await window.__aehranUploadDbImage(data,name);const item={url:ref,name,ok:true};results[i]=item;persistOne(item);return}catch(e){lastErr=e;if(attempt<3)await new Promise(r=>setTimeout(r,500*attempt))}}console.error('Media upload failed',f?.name,lastErr);results[i]={name:f?.name||`Image ${i+1}`,ok:false,error:lastErr}};const worker=async()=>{while(true){const i=next++;if(i>=files.length)return;await uploadOne(i)}};await Promise.all(Array.from({length:Math.min(8,files.length)},()=>worker()));const uploaded=results.filter(x=>x?.ok),failed=results.filter(x=>x&&!x.ok);if(!uploaded.length)throw new Error('No images could be uploaded');commit(uploaded.length===1?'Image uploaded':`${uploaded.length} images uploaded`);closeModal();show('media');if(failed.length)toast(`${uploaded.length} uploaded, ${failed.length} failed — retry the failed files`)}catch(e){console.error(e);toast(e?.message==='No images could be uploaded'?'Image upload failed — please try again':'Image upload failed — please try again')}finally{window.__aehranMediaUploadActive=false;if(btn)btn.disabled=false;if(closeBtn)closeBtn.disabled=false}}

async function uploadToInput(input,target,max=1400){const f=input.files?.[0];if(!f)return;try{toast('Optimizing image…');const data=await fileToData(f,max);if(typeof window.__aehranUploadDbImage!=='function')throw new Error('Image service is still loading');toast('Uploading image…');const ref=await window.__aehranUploadDbImage(data,f.name);const el=document.getElementById(target);if(el){el.value=ref;el.dispatchEvent(new Event('input',{bubbles:true}))}toast('Image ready — save your changes')}catch(e){console.error(e);toast('Image upload failed — try again')}finally{input.value=''}}
async function uploadGallery(input){const files=[...(input.files||[])];if(!files.length)return;try{if(typeof window.__aehranUploadDbImage!=='function')throw new Error('Image service is still loading');const refs=[];for(let i=0;i<files.length;i++){toast(`Uploading image ${i+1} of ${files.length}…`);const data=await fileToData(files[i],1400);refs.push(await window.__aehranUploadDbImage(data,files[i].name))}const box=document.getElementById('pImgs');if(box){const existing=box.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);box.value=[...existing,...refs].join('\n')}const primary=document.getElementById('pImg_front');if(primary&&!primary.value&&refs[0]){primary.value=refs[0];primary.dispatchEvent(new Event('input',{bubbles:true}))}toast('Gallery images ready — save product')}catch(e){console.error(e);toast('Gallery upload failed — try again')}finally{input.value=''}}
function fileToData(file,max=1400,quality=.78){return new Promise((resolve,reject)=>{if(!file||!String(file.type||'').startsWith('image/'))return reject(new Error('Choose an image file'));const reader=new FileReader();reader.onerror=()=>reject(reader.error||new Error('Could not read image'));reader.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('Could not decode image'));im.onload=()=>{let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;if(!w||!h)return reject(new Error('Invalid image'));const scale=Math.min(1,Number(max||1600)/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(im,0,0,w,h);let out='';try{out=c.toDataURL('image/webp',quality)}catch(_){out=c.toDataURL('image/jpeg',quality)}resolve(out)};im.src=reader.result};reader.readAsDataURL(file)})}

x" ${h.desktop?.wishlist!==false?'checked':''}> Wishlist</label><label class="check"><input id="hdrDBag" type="checkbox" ${h.desktop?.bag!==false?'checked':''}> Shopping Bag</label><label class="check"><input id="hdrDMore" type="checkbox" ${h.desktop?.more!==false?'checked':''}> More</label></div><div><b>Mobile</b><label class="check"><input id="hdrMSearch" type="checkbox" ${h.mobile?.search!==false?'checked':''}> Search</label><label class="check"><input id="hdrMAccount" type="checkbox" ${h.mobile?.account!==false?'checked':''}> Account</label><label class="check"><input id="hdrMWish" type="checkbox" ${h.mobile?.wishlist!==false?'checked':''}> Wishlist</label><label class="check"><input id="hdrMBag" type="checkbox" ${h.mobile?.bag!==false?'checked':''}> Shopping Bag</label><label class="check"><input id="hdrMMore" type="checkbox" ${h.mobile?.more!==false?'checked':''}> More / 3-dot</label><div class="field"><label>Mobile menu title</label><input id="hdrMenuTitle" value="${attr(h.mobileMenuTitle||'Menu')}"></div></div></div></div>`}
function collectNavForm(){const rows=[...document.querySelectorAll('[data-nav-row]')];return rows.map((r,i)=>{const label=document.getElementById('navLabel'+i)?.value.trim()||'Category';const slug=(document.getElementById('navSlug'+i)?.value.trim()||'all').replace(/^#collection\//,'');const target=(document.getElementById('navTarget'+i)?.value.trim()||slug).replace(/^#collection\//,'');return {id:(cms.nav?.[i]?.id||'nav-'+Date.now()+'-'+i),label,slug,target,visible:!!document.getElementById('navVisible'+i)?.checked,mobileVisible:!!document.getElementById('navMobile'+i)?.checked}}).filter(x=>x.label&&x.target)}
function addNavItem(){cms.nav=Array.isArray(cms.nav)?cms.nav:[];cms.nav.push({id:'nav-'+Date.now(),label:'New Category',slug:'new-category',target:'new-category',visible:true,mobileVisible:true});commit('Navigation category added');show('navigation')}
function removeNavItem(i){if(!Array.isArray(cms.nav)||!cms.nav[i])return;if(!confirm(`Remove navigation item “${cms.nav[i].label||'Category'}”?`))return;cms.nav.splice(i,1);commit('Navigation category removed');show('navigation')}
function moveNav(i,dir){cms.nav=collectNavForm();const j=i+Number(dir||0);if(j<0||j>=cms.nav.length)return;[cms.nav[i],cms.nav[j]]=[cms.nav[j],cms.nav[i]];commit('Navigation order updated');show('navigation')}
function saveNav(){cms.nav=collectNavForm();cms.header={desktop:{search:document.getElementById('hdrDSearch')?.checked!==false,account:document.getElementById('hdrDAccount')?.checked!==false,wishlist:document.getElementById('hdrDWish')?.checked!==false,bag:document.getElementById('hdrDBag')?.checked!==false,more:document.getElementById('hdrDMore')?.checked!==false},mobile:{search:document.getElementById('hdrMSearch')?.checked!==false,account:document.getElementById('hdrMAccount')?.checked!==false,wishlist:document.getElementById('hdrMWish')?.checked!==false,bag:document.getElementById('hdrMBag')?.checked!==false,more:document.getElementById('hdrMMore')?.checked!==false},mobileMenuTitle:(document.getElementById('hdrMenuTitle')?.value||'Menu').trim()||'Menu'};commit('Navigation and header updated');show('navigation')}
function brandingPage(){const b=cms.branding,t=cms.theme;return `${head('Branding & Theme','Control logo, brand text and the navy / cream / gold visual system.',`<button class="btn" onclick="saveBranding()">Save branding</button>`)}<div class="grid2"><div class="section-card"><h2>Brand identity</h2><div class="field"><label>Brand name</label><input id="brandName" value="${attr(b.brandName)}"></div><div class="field"><label>Tagline</label><input id="brandTag" value="${attr(b.tagline)}"></div><div class="field"><label>Header logo</label><input id="brandLogo" value="${attr(b.logo)}" oninput="brandPreview()"><div class="head-actions"><button class="btn ghost small" onclick="pickMedia('brandLogo')">Library</button><label class="btn alt small">Upload logo<input hidden type="file" accept="image/*" onchange="uploadToInput(this,'brandLogo',700)"></label></div></div><div class="preview" id="brandPreview"><img src="${attr(b.logo)}" style="max-height:180px;object-fit:contain"></div><div class="field"><label>Footer transparent logo</label><input id="footerLogo" value="${attr(b.footerLogo)}"><div class="head-actions"><button class="btn ghost small" onclick="pickMedia('footerLogo')">Library</button><label class="btn alt small">Upload PNG<input hidden type="file" accept="image/*" onchange="uploadToInput(this,'footerLogo',1000)"></label></div></div></div><div class="section-card"><h2>Theme palette</h2>${[['navy','Dark navy'],['navy2','Navy 2'],['navy3','Navy 3'],['cream','Cream'],['gold','Muted gold'],['background','Page background']].map(x=>`<div class="field"><label>${x[1]}</label><div class="color-field"><input id="color_${x[0]}" type="color" value="${t[x[0]]}"><input id="colorText_${x[0]}" value="${t[x[0]]}" oninput="document.getElementById('color_${x[0]}').value=this.value"></div></div>`).join('')}<button class="btn ghost small" onclick="resetTheme()">Reset premium palette</button></div></div>`}
function brandPreview(){document.getElementById('brandPreview').innerHTML=`<img src="${attr(document.getElementById('brandLogo').value)}" style="max-height:180px;object-fit:contain">`}
function saveBranding(){cms.branding.brandName=document.getElementById('brandName').value;cms.branding.tagline=document.getElementById('brandTag').value;cms.branding.logo=document.getElementById('brandLogo').value;cms.branding.footerLogo=document.getElementById('footerLogo').value;Object.keys(cms.theme).forEach(k=>{const el=document.getElementById('color_'+k);if(el)cms.theme[k]=el.value});commit('Branding and theme updated')}
function resetTheme(){cms.theme=clone(DEFAULT_CMS.theme);commit('Premium palette restored');show('branding')}
function discountsPage(){return `${head('Discounts','Create and manage coupon codes used at checkout.',`<button class="btn" onclick="openDiscount()">+ New discount</button>`)}<div class="table-wrap"><table><thead><tr><th>Code</th><th>Type</th><th>Value</th><th>Minimum</th><th>Maximum</th><th>Status</th><th></th></tr></thead><tbody>${cms.discounts.map((d,i)=>`<tr><td><b>${esc(d.code)}</b></td><td>${esc(d.type)}</td><td>${d.type==='percent'?d.value+'%':money(d.value)}</td><td>${money(d.min||0)}</td><td>${d.max?money(d.max):'—'}</td><td><span class="status">${d.active?'Active':'Paused'}</span></td><td><button class="btn ghost small" onclick="openDiscount(${i})">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function openDiscount(i=-1){const d=i>=0?cms.discounts[i]:{code:'',type:'percent',value:10,min:0,max:0,active:true};openModal(`<div class="modal-head"><div><div class="label">DISCOUNT</div><h2>${i>=0?'Edit code':'New code'}</h2></div><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveDiscount(event,${i})"><div class="field"><label>Code</label><input id="dCode" value="${attr(d.code)}" required></div><div class="field"><label>Type</label><select id="dType"><option value="percent" ${d.type==='percent'?'selected':''}>Percentage</option><option value="fixed" ${d.type==='fixed'?'selected':''}>Fixed amount</option></select></div><div class="form-grid"><div class="field"><label>Value</label><input id="dValue" type="number" value="${d.value}"></div><div class="field"><label>Minimum cart</label><input id="dMin" type="number" value="${d.min||0}"></div><div class="field"><label>Max discount</label><input id="dMax" type="number" value="${d.max||0}"></div><div class="field"><label>Status</label><select id="dActive"><option value="1" ${d.active?'selected':''}>Active</option><option value="0" ${!d.active?'selected':''}>Paused</option></select></div></div><div class="head-actions"><button class="btn">Save code</button>${i>=0?`<button type="button" class="btn danger" onclick="deleteDiscount(${i})">Delete</button>`:''}</div></form>`)}
function saveDiscount(e,i){e.preventDefault();const d={code:document.getElementById('dCode').value.trim().toUpperCase(),type:document.getElementById('dType').value,value:Number(document.getElementById('dValue').value),min:Number(document.getElementById('dMin').value),max:Number(document.getElementById('dMax').value),active:document.getElementById('dActive').value==='1'};if(i>=0)cms.discounts[i]=d;else cms.discounts.push(d);commit('Discount saved');closeModal();show('discounts')}
function deleteDiscount(i){cms.discounts.splice(i,1);commit('Discount deleted');closeModal();show('discounts')}
function uniqueCustomers(){const m=new Map();orders.forEach(o=>{const k=(o.email||o.phone||o.name||'guest').toLowerCase();if(!m.has(k))m.set(k,{name:o.name,email:o.email,phone:o.phone,orders:0,spend:0,last:o.date});const c=m.get(k);c.orders++;c.spend+=Number(o.total||0);if(new Date(o.date)>new Date(c.last))c.last=o.date});const p=load('aehran_profile',null);if(p){const k=(p.email||p.phone||p.name||'profile').toLowerCase();if(!m.has(k))m.set(k,{name:p.name,email:p.email,phone:p.phone,orders:0,spend:0,last:null})}return [...m.values()]}
function customersPage(){const c=uniqueCustomers();const sub=localStorage.getItem('aehran_newsletter');const subs=load('aehran_subscribers',[]);return `${head('Customers','Customer profiles are derived from account data and placed orders.') }<div class="cards" style="margin-bottom:15px"><div class="stat"><label>Customers</label><strong>${c.length}</strong></div><div class="stat"><label>Repeat buyers</label><strong>${c.filter(x=>x.orders>1).length}</strong></div><div class="stat"><label>Newsletter</label><strong>${new Set([sub,...subs].filter(Boolean)).size}</strong></div><div class="stat"><label>Customer revenue</label><strong>${money(c.reduce((s,x)=>s+x.spend,0))}</strong></div></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Total spend</th><th>Last order</th></tr></thead><tbody>${c.map(x=>`<tr><td><b>${esc(x.name||'Customer')}</b><br><small>${esc(x.email||'')}</small></td><td>${esc(x.phone||'—')}</td><td>${x.orders}</td><td>${money(x.spend)}</td><td>${x.last?new Date(x.last).toLocaleDateString('en-IN'):'—'}</td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">No customers yet.</div></td></tr>`}</tbody></table></div>`}
function reviewsPage(){const list=[];Object.entries(reviewsDB).forEach(([pid,arr])=>(arr||[]).forEach((r,i)=>list.push({pid,i,...r})));return `${head('Reviews','Moderate customer-submitted product reviews.') }<div class="table-wrap"><table><thead><tr><th>Product</th><th>Reviewer</th><th>Rating</th><th>Review</th><th>Date</th><th></th></tr></thead><tbody>${list.map(r=>{const p=products.find(x=>x.id===r.pid);return `<tr><td>${esc(p?.name||r.pid)}</td><td><b>${esc(r.name)}</b><br><small>${esc(r.title||'')}</small></td><td>★ ${r.stars}</td><td style="max-width:340px">${esc(r.text)}</td><td>${r.date?new Date(r.date).toLocaleDateString('en-IN'):'—'}</td><td><button class="btn danger small" onclick="deleteReview('${r.pid}',${r.i})">Delete</button></td></tr>`}).join('')||`<tr><td colspan="6"><div class="empty">No submitted reviews yet.</div></td></tr>`}</tbody></table></div>`}
function deleteReview(pid,i){if(!confirm('Delete this customer review permanently?'))return;if(!reviewsDB[pid])return;reviewsDB[pid].splice(i,1);if(!reviewsDB[pid].length)delete reviewsDB[pid];commit('Review removed');show('reviews')}

function returnsPage(){
 const pending=returnsDB.filter(r=>!['Refunded','Rejected'].includes(r.status)).length,refunded=returnsDB.filter(r=>r.status==='Refunded').reduce((a,r)=>a+Number(r.amount||0),0);
 return `${head('Returns','Track return, exchange and refund requests from one workspace.',`<button class="btn ghost" onclick="exportReturns()">Export CSV</button><button class="btn" onclick="openReturn()">+ New return</button>`)}
 <div class="cards"><div class="stat"><label>Total requests</label><strong>${returnsDB.length}</strong><small>All return cases</small></div><div class="stat"><label>Open cases</label><strong>${pending}</strong><small>Need action or pickup</small></div><div class="stat"><label>Refunded</label><strong>${returnsDB.filter(r=>r.status==='Refunded').length}</strong><small>Completed refunds</small></div><div class="stat"><label>Refund value</label><strong>${money(refunded)}</strong><small>Total marked refunded</small></div></div>
 <div class="search-row" style="margin-top:16px"><input class="input" id="returnSearch" placeholder="Search return, order, customer..." oninput="renderReturnsTable()"><select id="returnStatus" onchange="renderReturnsTable()"><option value="">All statuses</option>${['Requested','Approved','Pickup Scheduled','Received','Refunded','Rejected'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div class="table-wrap"><table><thead><tr><th>Return</th><th>Order</th><th>Customer</th><th>Reason</th><th>Amount</th><th>Status</th><th>Requested</th><th></th></tr></thead><tbody id="returnsTbody"></tbody></table></div>`
}
function renderReturnsTable(){const tb=document.getElementById('returnsTbody');if(!tb)return;const q=(document.getElementById('returnSearch')?.value||'').toLowerCase(),st=document.getElementById('returnStatus')?.value||'';const list=returnsDB.slice().reverse().filter(r=>(!st||r.status===st)&&JSON.stringify(r).toLowerCase().includes(q));tb.innerHTML=list.map(r=>`<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.orderId||'—')}</td><td><b>${esc(r.customer||'—')}</b><br><small>${esc(r.email||'')}</small></td><td style="max-width:260px">${esc(r.reason||'—')}</td><td><b>${money(r.amount)}</b></td><td><select onchange="setReturnStatus('${r.id}',this.value)">${['Requested','Approved','Pickup Scheduled','Received','Refunded','Rejected'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${r.date?new Date(r.date).toLocaleDateString('en-IN'):'—'}</td><td><button class="btn ghost small" onclick="returnDetails('${r.id}')">View</button></td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">No return requests yet. Use “New return” to create one.</div></td></tr>`}
function openReturn(){const options=orders.slice().reverse().map(o=>`<option value="${attr(o.id)}">${esc(o.id)} · ${esc(o.name||'Customer')} · ${money(o.total)}</option>`).join('');openModal(`<div class="modal-head"><div><div class="label">RETURNS</div><h2>Create return request</h2></div><button class="close" onclick="closeModal()">✕</button></div>${orders.length?`<form onsubmit="saveReturn(event)"><div class="field"><label>Order</label><select id="rOrder" onchange="fillReturnOrder()">${options}</select></div><div class="field"><label>Reason</label><select id="rReason"><option>Size / fit issue</option><option>Wrong item received</option><option>Damaged item</option><option>Quality issue</option><option>Changed mind</option><option>Exchange requested</option><option>Other</option></select></div><div class="form-grid"><div class="field"><label>Refund amount</label><input id="rAmount" type="number" min="0"></div><div class="field"><label>Status</label><select id="rStatus">${['Requested','Approved','Pickup Scheduled','Received','Refunded','Rejected'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>Internal note</label><textarea id="rNote" rows="4" placeholder="Pickup, exchange, refund reference, etc."></textarea></div><button class="btn" type="submit">Create return</button></form><script>setTimeout(fillReturnOrder,0)<\/script>`:'<div class="empty">No orders exist yet, so a return cannot be linked to an order.</div>'}`)}
function fillReturnOrder(){const o=orders.find(x=>x.id===document.getElementById('rOrder')?.value);const a=document.getElementById('rAmount');if(o&&a)a.value=Math.round(Number(o.total)||0)}
function saveReturn(e){e.preventDefault();const o=orders.find(x=>x.id===document.getElementById('rOrder').value);if(!o)return toast('Order not found');returnsDB.push({id:'RET-'+Date.now().toString().slice(-8),orderId:o.id,customer:o.name||'Customer',email:o.email||'',phone:o.phone||'',reason:document.getElementById('rReason').value,amount:Number(document.getElementById('rAmount').value)||0,status:document.getElementById('rStatus').value,note:document.getElementById('rNote').value.trim(),date:new Date().toISOString()});commit('Return request created');closeModal();show('returns')}
function setReturnStatus(id,status){const r=returnsDB.find(x=>x.id===id);if(!r)return;r.status=status;r.updatedAt=new Date().toISOString();commit('Return '+id+' updated');renderReturnsTable()}
function returnDetails(id){const r=returnsDB.find(x=>x.id===id);if(!r)return;openModal(`<div class="modal-head"><div><div class="label">${esc(r.id)}</div><h2>Return details</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="section-card"><h2>Order & customer</h2><div class="list-row"><div><b>${esc(r.orderId)}</b><small>${esc(r.customer)} · ${esc(r.email||'')}</small></div><strong>${money(r.amount)}</strong></div></div><div class="section-card"><h2>Request</h2><p><b>Reason:</b> ${esc(r.reason||'—')}</p><p><b>Status:</b> ${esc(r.status)}</p><p><b>Requested:</b> ${r.date?new Date(r.date).toLocaleString():'—'}</p><p><b>Internal note:</b> ${esc(r.note||'No note')}</p></div><div class="head-actions"><button class="btn danger" onclick="deleteReturn('${r.id}')">Delete return</button></div>`)}
function deleteReturn(id){if(!confirm('Delete this return record?'))return;returnsDB=returnsDB.filter(r=>r.id!==id);commit('Return record deleted');closeModal();show('returns')}
function exportReturns(){const rows=[['Return ID','Order ID','Customer','Email','Reason','Amount','Status','Requested','Note'],...returnsDB.map(r=>[r.id,r.orderId,r.customer,r.email,r.reason,r.amount,r.status,r.date,r.note])];downloadBlob('aehran-returns.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

function catalogUploadsPage(){return `${head('Catalog Uploads','Add many products quickly with CSV/JSON, or create a catalogue item from a compact form.',`<button class="btn ghost" onclick="downloadCatalogTemplate()">Download CSV template</button>`)}<div class="grid2"><div class="section-card"><h2>Bulk catalog import</h2><p>Upload a CSV or JSON file. Matching SKU or product ID is updated; new rows are added.</p><div class="field"><label>Catalog file</label><input id="catalogFile" type="file" accept=".csv,.json,text/csv,application/json"></div><button class="btn" onclick="importCatalogFile()">Upload catalog</button><p class="mini-note">Required for a new product: name, price and image. Recommended columns: id, name, sku, audience, product_type, category, collections, price, old_price, stock, color, tag, tags, image, gallery, variant_group, gallery_type, color_variants, description.</p></div><div class="section-card"><h2>Import rules</h2><div class="list"><div class="list-row"><div><b>Update safely</b><small>Rows match existing items by ID first, then SKU.</small></div><span class="status Delivered">On</span></div><div class="list-row"><div><b>Collections</b><small>Separate multiple collection slugs with | or commas.</small></div></div><div class="list-row"><div><b>Gallery images</b><small>Separate image URLs with |.</small></div></div><div class="list-row"><div><b>Local Bridge</b><small>Imported products are saved to the same storefront key.</small></div><span class="status Delivered">Connected</span></div></div></div></div><div class="section-card"><h2>Quick product upload</h2><p>Create one product without opening the full product editor.</p><form onsubmit="quickCatalogSave(event)"><div class="form-grid"><div class="field"><label>Product name</label><input id="cuName" required placeholder="Ivory Wedding Kurta Set"></div><div class="field"><label>SKU</label><input id="cuSku" placeholder="AHR-IVORY-01"></div><div class="field"><label>Category</label><select id="cuCat" catalog placements</small></div></div></div>`}
function quickCatalogSave(e){e.preventDefault();const cat=document.getElementById('cuCat').value,cols=parseMulti(document.getElementById('cuCollections').value);if(!cols.includes(cat))cols.push(cat);const name=document.getElementById('cuName').value.trim(),sku=document.getElementById('cuSku').value.trim()||'AHR-'+Date.now().toString().slice(-7),img=document.getElementById('cuImg').value.trim();const obj={id:slug(name)+'-'+Date.now().toString().slice(-5),name,sku,cat,collections:cols,price:Number(document.getElementById('cuPrice').value)||0,old:Number(document.getElementById('cuOld').value)||0,stock:Number(document.getElementById('cuStock').value)||0,color:document.getElementById('cuColor').value.trim(),sizes:[...document.querySelectorAll('input[name=cuSize]:checked')].map(x=>x.value),tag:'New',rating:0,reviews:0,img,imgs:[img],desc:document.getElementById('cuDesc').value.trim()};products.unshift(obj);commit('Product published from Catalog Uploads');show('catalogUploads')}
function parseMulti(v){return [...new Set(String(v||'').split(/[|,]/).map(x=>slug(x)).filter(Boolean))]}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);if(!rows.length)return[];const h=rows.shift().map(x=>String(x).trim().toLowerCase().replace(/\s+/g,'_'));return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}
function normalizeCatalogRow(r){const name=String(r.name||r.product_name||r.title||'').trim(),sku=String(r.sku||'').trim(),audience=slug(r.audience||'men')||'men',productType=slug(r.product_type||r.productType||'kurta-set')||'kurta-set',cat=slug(r.category||r.cat||'kurta')||'kurta',img=String(r.image||r.img||r.primary_image||'').trim(),id=slug(r.id||'')||slug(name);const collections=parseMulti(r.collections||r.collection||'');if(cat&&!collections.includes(cat))collections.push(cat);if(audience==='kids'&&!collections.includes('kids'))collections.push('kids');if(audience==='men'&&!collections.includes('men'))collections.push('men');if(productType.includes('jacket')){if(!collections.includes('jacket'))collections.push('jacket');const jc=audience==='kids'?'kids-jacket':'men-jacket';if(!collections.includes(jc))collections.push(jc)}if(audience==='kids'&&productType==='kurta-set'&&!collections.includes('kids-kurta'))collections.push('kids-kurta');const gallery=String(r.gallery||r.images||'').split('|').map(x=>x.trim()).filter(Boolean);if(img&&!gallery.includes(img))gallery.unshift(img);let colorVariants=[];try{colorVariants=typeof r.color_variants==='string'&&r.color_variants.trim()?JSON.parse(r.color_variants):[]}catch(e){}return {id:id||'product-'+Date.now()+Math.random().toString(36).slice(2,6),name,sku:sku||'AHR-'+Date.now().toString().slice(-7)+Math.random().toString(36).slice(2,4).toUpperCase(),audience,productType,cat,collections,price:Number(r.price||0),old:Number(r.old_price||r.old||r.mrp||0),stock:Number(r.stock||0),color:String(r.color||'').trim(),tag:String(r.tag||'New').trim()||'New',tags:parseMulti(r.tags||''),rating:Number(r.rating||0),reviews:Number(r.reviews||0),img,imgs:gallery.length?gallery:(img?[img]:[]),galleryType:String(r.gallery_type||r.galleryType||'multi-angle'),variantGroup:String(r.variant_group||r.variantGroup||''),colorVariants,sizes:(String(r.sizes||r.size||'').split(/[|,]/).map(x=>x.trim()).filter(Boolean)),desc:String(r.description||r.desc||'').trim()}}
function mergeCatalogRows(rows){let added=0,updated=0,skipped=0;rows.forEach(r=>{const obj=normalizeCatalogRow(r);if(!obj.name||!obj.img||!Number.isFinite(obj.price)){skipped++;return}let i=products.findIndex(p=>obj.id&&p.id===obj.id);if(i<0&&obj.sku)i=products.findIndex(p=>String(p.sku).toLowerCase()===obj.sku.toLowerCase());if(i>=0){products[i]={...products[i],...obj,id:products[i].id};updated++}else{products.unshift(obj);added++}});commit(`Catalog upload: ${added} added, ${updated} updated, ${skipped} skipped`);show('catalogUploads')}
function importCatalogFile(){const f=document.getElementById('catalogFile')?.files?.[0];if(!f)return toast('Choose a CSV or JSON catalog file');const rd=new FileReader();rd.onload=()=>{try{let rows=[];if(f.name.toLowerCase().endsWith('.json')){const d=JSON.parse(rd.result);rows=Array.isArray(d)?d:(Array.isArray(d.products)?d.products:[])}else rows=parseCSV(rd.result);if(!rows.length)return toast('No catalog rows found');mergeCatalogRows(rows)}catch(e){console.error(e);toast('Could not read this catalog file')}};rd.readAsText(f)}

function paymentsPage(){const valid=orders.filter(o=>o.status!=='Cancelled'),gross=valid.reduce((s,o)=>s+Number(o.total||0),0),refund=returnsDB.filter(r=>r.status==='Refunded').reduce((s,r)=>s+Number(r.amount||0),0),settled=valid.filter(o=>getSettlementStatus(o)==='Settled').reduce((s,o)=>s+paymentNet(o),0);return `${head('Payments','Track order payments, refunds and settlement status.',`<button class="btn ghost" onclick="exportPayments()">Export CSV</button>`)}<div class="cards"><div class="stat"><label>Gross collected</label><strong>${money(gross)}</strong><small>Non-cancelled orders</small></div><div class="stat"><label>Refunded</label><strong>${money(refund)}</strong><small>Returns marked Refunded</small></div><div class="stat"><label>Settled</label><strong>${money(settled)}</strong><small>Marked settled in admin</small></div><div class="stat"><label>Net payable</label><strong>${money(Math.max(0,gross-refund))}</strong><small>Gross minus refunds</small></div></div><div class="search-row" style="margin-top:16px"><input class="input" id="paymentSearch" placeholder="Search order, customer, method..." oninput="renderPaymentsTable()"><select id="paymentSettlement" onchange="renderPaymentsTable()"><option value="">All settlements</option>${['Pending','Settled','On Hold'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Method</th><th>Order status</th><th>Gross</th><th>Refund</th><th>Net</th><th>Settlement</th></tr></thead><tbody id="paymentsTbody"></tbody></table></div><div class="section-card" style="margin-top:16px"><h2>How this page works</h2><p>This build has no live payment gateway settlement API yet. Amounts come from AEHRAN orders and refunded return records; settlement status is an admin tracking field stored in Local Bridge.</p></div>`}
function returnRefundForOrder(id){return returnsDB.filter(r=>r.orderId===id&&r.status==='Refunded').reduce((s,r)=>s+Number(r.amount||0),0)}
function paymentNet(o){return Math.max(0,Number(o.total||0)-returnRefundForOrder(o.id))}
function getSettlementStatus(o){return paymentSettlements[o.id]||'Pending'}
function renderPaymentsTable(){const tb=document.getElementById('paymentsTbody');if(!tb)return;const q=(document.getElementById('paymentSearch')?.value||'').toLowerCase(),st=document.getElementById('paymentSettlement')?.value||'';const list=orders.slice().reverse().filter(o=>o.status!=='Cancelled').filter(o=>(!st||getSettlementStatus(o)===st)&&JSON.stringify(o).toLowerCase().includes(q));tb.innerHTML=list.map(o=>{const ref=returnRefundForOrder(o.id),ss=getSettlementStatus(o);return `<tr><td><b>${esc(o.id)}</b><br><small>${o.date?new Date(o.date).toLocaleDateString('en-IN'):'—'}</small></td><td>${esc(o.name||'—')}<br><small>${esc(o.email||'')}</small></td><td>${esc(o.payment||'—')}</td><td><span class="status ${esc(o.status)}">${esc(o.status)}</span></td><td>${money(o.total)}</td><td>${money(ref)}</td><td><b>${money(paymentNet(o))}</b></td><td><select onchange="setSettlementStatus('${o.id}',this.value)">${['Pending','Settled','On Hold'].map(x=>`<option ${x===ss?'selected':''}>${x}</option>`).join('')}</select></td></tr>`}).join('')||`<tr><td colspan="8"><div class="empty">No payment records yet.</div></td></tr>`}
function setSettlementStatus(id,status){paymentSettlements[id]=status;commit('Payment settlement '+id+' marked '+status);renderPaymentsTable()}
function exportPayments(){const rows=[['Order ID','Date','Customer','Email','Payment Method','Order Status','Gross','Refund','Net','Settlement'],...orders.filter(o=>o.status!=='Cancelled').map(o=>[o.id,o.date,o.name,o.email,o.payment,o.status,o.total,returnRefundForOrder(o.id),paymentNet(o),getSettlementStatus(o)])];downloadBlob('aehran-payments.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

      const want=[
        {label:'Boys Kurta Set',target:'kids-kurta',image:''},
        {label:'Waistcoat',target:'waistcoat-sets',image:''}
      ];
      want.forEach(w=>{
        if(!obj.home.circles.some(c=>c&&c.target===w.target)){obj.home.circles.push(w);added=true;}
      });
    }
    if(typeof cms==='object'&&cms)ensureCircles(cms);
    if(typeof DEFAULT_CMS==='object'&&DEFAULT_CMS)ensureCircles(DEFAULT_CMS);

    /* Give the product form a dedicated Waistcoat Set type without redesigning the form. */
    const baseOpen=typeof openProduct==='function'?openProduct:null;
    if(baseOpen&&!baseOpen.__aehranExtraWrapped){
      const wrappedOpen=function(id='',preset=''){
        baseOpen(id,preset);
        setTimeout(function(){
          const type=document.getElementById('pType');
          if(type&&!type.querySelector('option[value="waistcoat-set"]')){
            const o=document.createElement('option');o.value='waistcoat-set';o.textContent='Waistcoat Set';type.appendChild(o);
          }
          const cat=document.getElementById('pCat');
          if(cat&&cat.value==='waistcoat-sets'&&type)type.value='waistcoat-set';
          if(cat&&cat.value==='kids-kurta'){
            const aud=document.getElementById('pAudience');if(aud)aud.value='kids';
            const pt=document.getElementById('pType');if(pt)pt.value='kurta-set';
          }
        },0);
      };
      wrappedOpen.__aehranExtraWrapped=true;
      window.openProduct=wrappedOpen;
    }

    const baseSave=typeof saveProduct==='function'?saveProduct:null;
    if(baseSave&&!baseSave.__aehranExtraWrapped){
      const wrappedSave=function(e,id){
        const cat=document.getElementById('pCat')?.value||'';
        const type=document.getElementById('pType');
        if(cat==='waistcoat-sets'&&type&&type.value!=='waistcoat-set'){
          if(!type.querySelector('option[value="waistcoat-set"]')){const o=document.createElement('option');o.value='waistcoat-set';o.textContent='Waistcoat Set';type.appendChild(o)}
          type.value='waistcoat-set';
        }
        baseSave(e,id);
      };
      wrappedSave.__aehranExtraWrapped=true;
      window.saveProduct=wrappedSave;
    }

    /* Seed/migrate any already-present catalog items into the two new admin collection buckets. */
    if(Array.isArray(products)){
      let changedProducts=false;
      products.forEach(p=>{
        const name=String(p?.name||'').toLowerCase();
        const pt=String(p?.productType||p?.product_type||'').toLowerCase();
        if(!Array.isArray(p.collections))p.collections=[];
        if((/waistcoat|vest/.test(name)||pt.includes('waistcoat'))&&!p.collections.includes('waistcoat-sets')){p.collections.push('waistcoat-sets');changedProducts=true;}
        if((String(p?.audience||'').toLowerCase()==='kids'||p?.cat==='kids')&&(/kurta/.test(name)||pt.includes('kurta'))&&!p.collections.includes('kids-kurta')){p.collections.push('kids-kurta');changedProducts=true;}
      });
      if(changedProducts&&typeof save==='function')save('aehran_products',products);
    }

    if(added&&typeof save==='function'&&typeof cms==='object'&&cms)save('aehran_cms',cms);

    /* Refresh the visible admin page so the newly added categories appear immediately. */
    if(typeof show==='function'&&typeof current!=='undefined'&&sessionStorage.getItem('aehran_admin_panel')==='1'){
      setTimeout(function(){try{show(current||'categoryControl')}catch(e){}},0);
    }
  }catch(e){console.warn('AEHRAN extra category patch',e)}
})();
</script>

<script id="aehran-final-reliability-fix">
(function(){
  const DB='https://aehran123-default-rtdb.asia-southeast1.firebasedatabase.app';
  const ROOT='aehran_store_v3', IMAGE_ROOT='aehran_image_store_v1';
  const blank='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
  const cacheKey='aehran_dbimg_preview_cache_v2';
  function readCache(){try{return JSON.parse(localStorage.getItem(cacheKey)||'{}')||{}}catch(e){return {}}}
  function writeCache(key,data){try{const c=readCache();c[key]=data;const keys=Object.keys(c);while(keys.length>8)delete c[keys.shift()];localStorage.setItem(cacheKey,JSON.stringify(c))}catch(e){}}
  async function restGet(path){const r=await fetch(DB+'/'+path.replace(/^\//,'')+'.json',{cache:'no-store'});if(!r.ok)throw new Error('Firebase read '+r.status);return await r.json()}
  async function restPut(path,value){const r=await fetch(DB+'/'+path.replace(/^\//,'')+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});if(!r.ok)throw new Error('Firebase write '+r.status);return await r.json()}
  async function sha(data){try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(data));return 'img_'+Array.from(new Uint8Array(h)).slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('')+'_'+data.length.toString(36)}catch(e){return 'img_'+Date.now()+'_'+Math.random().toString(36).slice(2,10)}}
  async function restResolve(value){
    if(typeof value!=='string'||!value.startsWith('dbimg:'))return value||'';
    const key=value.slice(6),c=readCache();if(c[key])return c[key];
    try{const v=await restGet(IMAGE_ROOT+'/'+key);const d=typeof v==='string'?v:v?.data||'';if(d)writeCache(key,d);return d}catch(e){console.warn('AEHRAN REST image resolve failed',key,e);return ''}
  }
  window.__aehranResolveDbImageREST=restResolve;
  window.__aehranUploadDbImageREST=async function(data,name){
    if(typeof data!=='string'||!data.startsWith('data:image/'))throw new Error('Invalid image data');
    const key=await sha(data);await restPut(IMAGE_ROOT+'/'+key,{data,name:String(name||'AEHRAN image').slice(0,120),updatedAt:Date.now()});writeCache(key,data);return 'dbimg:'+key;
  };
  async function hydrateBannerV2ImagesFinal(){
    const imgs=[...document.querySelectorAll('.banner-v2-preview img[data-dbimg]')];
    await Promise.all(imgs.map(async im=>{
      const raw=im.getAttribute('data-dbimg')||'';if(!raw.startsWith('dbimg:'))return;
      let d='';try{d=await restResolve(raw)}catch(e){}
      if(!d&&typeof window.__aehranResolveDbImage==='function'){try{d=await window.__aehranResolveDbImage(raw)}catch(e){}}
      const box=im.closest('.banner-v2-preview');if(d){im.onerror=null;im.src=d;im.style.display='block';box?.classList.remove('failed');box?.querySelector(':scope > span')?.remove()}else{im.src=blank;im.style.display='block';box?.classList.add('failed');if(box&&!box.querySelector(':scope > span'))box.insertAdjacentHTML('beforeend','<span>Image unavailable — retrying…</span>')}
    }));
  }
  window.hydrateBannerV2Images=hydrateBannerV2ImagesFinal;
  if(typeof hydrateBannerV2Images==='function')hydrateBannerV2Images=hydrateBannerV2ImagesFinal;

  const originalUpload=window.uploadToInput;
  window.uploadToInput=async function(input,target,max=1400){
    const f=input?.files?.[0];if(!f)return;
    try{toast('Optimizing image…');const data=await fileToData(f,max);toast('Uploading image…');const ref=await window.__aehranUploadDbImageREST(data,f.name);const el=document.getElementById(target);if(el){el.value=ref;el.dataset.previewData=data;el.dispatchEvent(new Event('input',{bubbles:true}))}if(String(target).startsWith('bmImage_')){const img=document.querySelector('.banner-v2-card[data-banner-id="'+target.slice(8)+'"] .banner-v2-preview img');if(img){img.src=data;img.style.display='block';img.closest('.banner-v2-preview')?.classList.remove('failed')}}toast('Image uploaded — now tap Save')}catch(e){console.error(e);toast('Image upload failed — please try again')}finally{input.value=''}
  };
  function pushCollections(){return restPut(ROOT+'/collections',Array.isArray(COLLECTIONS)?COLLECTIONS:[]).catch(e=>console.warn('Collection cloud sync failed',e))}
  const originalCommit=window.commit;
  if(typeof originalCommit==='function'&&!originalCommit.__aehranRestSync){
    const wrappedCommit=function(msg){const r=originalCommit.apply(this,arguments);pushCollections();return r};wrappedCommit.__aehranRestSync=true;window.commit=wrappedCommit;try{commit=wrappedCommit}catch(e){}
  }
  const originalPersist=window.persistBannerV2;
  if(typeof originalPersist==='function'&&!originalPersist.__aehranRestSync){
    const wrappedPersist=function(message){const r=originalPersist.apply(this,arguments);restPut(ROOT+'/bannersV2',Array.isArray(bannerManager)?bannerManager:[]).catch(e=>console.warn('Banner REST sync failed',e));return r};wrappedPersist.__aehranRestSync=true;window.persistBannerV2=wrappedPersist;try{persistBannerV2=wrappedPersist}catch(e){}
  }
  const originalSaveBanner=window.saveBannerV2;
  if(typeof originalSaveBanner==='function'&&!originalSaveBanner.__aehranRestPreview){
    window.saveBannerV2=function(id){const el=document.getElementById('bmImage_'+id);if(el?.dataset.previewData){const c=readCache();c[id]=el.dataset.previewData;try{localStorage.setItem('aehran_banner_preview_'+id,el.dataset.previewData)}catch(e){}}return originalSaveBanner.apply(this,arguments)};
    try{saveBannerV2=window.saveBannerV2}catch(e){}
  }
  async function syncCollectionsFromCloud(){try{const v=await restGet(ROOT+'/collections');if(Array.isArray(v)&&v.length){COLLECTIONS=v;save('aehran_collections',COLLECTIONS);if(typeof current!=='undefined'&&current==='collections')show('collections')}}catch(e){}}
  syncCollectionsFromCloud();
  setTimeout(hydrateBannerV2ImagesFinal,100);setTimeout(hydrateBannerV2ImagesFinal,800);setTimeout(hydrateBannerV2ImagesFinal,2200);
  window.addEventListener('aehran-db-image-ready',()=>{hydrateBannerV2ImagesFinal();setTimeout(hydrateBannerV2ImagesFinal,600)});
  document.addEventListener('input',e=>{if(e.target?.id?.startsWith('bmImage_')){const raw=e.target.value.trim();if(raw.startsWith('dbimg:'))hydrateBannerV2ImagesFinal()}},true);
})();
</script>
