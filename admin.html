function returnsPage(){
 const pending=returnsDB.filter(r=>!['Refunded','Rejected'].includes(r.status)).length,refunded=returnsDB.filter(r=>r.status==='Refunded').reduce((a,r)=>a+Number(r.amount||0),0);
 return `${head('Returns','Track return, exchange and refund requests from one workspace.',`<button class="btn ghost" onclick="exportReturns()">Export CSV</button><button class="btn" onclick="openReturn()">+ New return</button>`)}
 <div class="cards"><div class="stat"><label>Total requests</label><strong>${returnsDB.length}</strong><small>All return cases</small></div><div class="stat"><label>Open cases</label><strong>${pending}</strong><small>Need action or pickup</small></div><div class="stat"><label>Refunded</label><strong>${returnsDB.filter(r=>r.status==='Refunded').length}</strong><small>Completed refunds</small></div><div class="stat"><label>Refund value</label><strong>${money(refunded)}</strong><small>Total marked refunded</small></div></div>
 <div class="search-row" style="margin-top:16px"><input class="input" id="returnSearch" placeholder="Search return, order, customer..." oninput="renderReturnsTable()"><select id="returnStatus" onchange="renderReturnsTable()"><option value="">All statuses</option>${['Requested','Approved','Pickup Scheduled','Received','Refunded','Rejected'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div class="table-wrap"><table><thead><tr><th>Return</th><th>Order</th><th>Customer</th><th>Reason</th><th>Amount</th><th>Status</th><th>Requested</th><th></th></tr></thead><tbody id="returnsTbody"></tbody></table></div>`
}
function renderReturnsTable(){const tb=document.getElementById('returnsTbody');if(!tb)return;const q=(document.getElementById('returnSearch')?.value||'').toLowerCase(),st=document.getElementById('returnStatus')?.value||'';const list=returnsDB.slice().reverse().filter(r=>(!st||r.status===st)&&JSON.stringify(r).toLowerCase().includes(q));tb.innerHTML=list.map(r=>`<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.orderId||'—')}</td><td><b>${esc(r.customer||'—')}</b><br><small>${esc(r.email||'')}</small></td><td style="max-width:260px">${esc(r.reason||'—')}</td><td><b>${money(r.amount)}</b></td><td><select onchange="setReturnStatus('${r.id}',this.value)">${['Requested','Approved','Pickup Scheduled','Received','Refunded','Rejected'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${r.date?new Date(r.date).toLocaleDateString('en-IN'):'—'}</td><td><button class="btn ghost small" onclick="returnDetails('${r.id}')">View</button></td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">No return requests yet. Use “New return” to create one.</div></td></tr>`}
function openReturn(){const options=orders.slice().reverse().map(o=>`<option value="${attr(o.id)}">${esc(o.id)} · ${esc(o.name||'Customer')} · ${money(o.total)}</option>`).join('');openModal(`<div class="modal-head"><div><div class="label">RETURNS</div><h2>Create return request</h2></div><button class="close" onclick="closeModal()">✕</button></div>${orders.length?`<form onsubmit="saveReturn(event)"><div class="field"><label>Order</label><select id="rOrder" onchange="fillReturnOrder()">${options}</select></div><div class="field"><label>Reason</label><select id="rReason"><option>Size / fit issue</option><option>Wrong item received</option><option>Damaged item</option><option>Quality issue</option><option>Changed mind</option><option>Exchange requested</option><option>Other</option></select></div><div class="form-grid"><div class="field"><label>Refund amount</label><input id="rAmount" type="number" min="0"></div><div class="field"><label>Status</label><select id="rStatus">${['Requested','Approved','Pickup Scheduled','Received','Refunded','Rejected'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>Internal note</label><textarea id="rNote" rows="4" placeholder="Pickup, exchange, refund reference, etc."></textarea></div><button class="btn" type="submit">Create return</button></form><script>setTimeout(fillReturnOrder,0)<\/script>`:'<div class="empty">No orders exist yet, so a return cannot be linked to an order.</div>'}`)}
function fillReturnOrder(){const o=orders.find(x=>x.id===document.getElementById('rOrder')?.value);const a=document.getElementById('rAmount');if(o&&a)a.value=Math.round(Number(o.total)||0)}
function saveReturn(e){e.preventDefault();const o=orders.find(x=>x.id===document.getElementById('rOrder').value);if(!o)return toast('Order not found');returnsDB.push({id:'RET-'+Date.now().toString().slice(-8),orderId:o.id,customer:o.name||'Customer',email:o.email||'',phone:o.phone||'',reason:document.getElementById('rReason').value,amount:Number(document.getElementById('rAmount').value)||0,status:document.getElementById('rStatus').value,note:document.getElementById('rNote').value.trim(),date:new Date().toISOString()});commit('Return request created');closeModal();show('returns')}
function setReturnStatus(id,status){const r=returnsDB.find(x=>x.id===id);if(!r)return;r.status=status;r.updatedAt=new Date().toISOString();commit('Return '+id+' updated');renderReturnsTable()}
function returnDetails(id){const r=returnsDB.find(x=>x.id===id);if(!r)return;openModal(`<div class="modal-head"><div><div class="label">${esc(r.id)}</div><h2>Return details</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="section-card"><h2>Order & customer</h2><div class="list-row"><div><b>${esc(r.orderId)}</b><small>${esc(r.customer)} · ${esc(r.email||'')}</small></div><strong>${money(r.amount)}</strong></div></div><div class="section-card"><h2>Request</h2><p><b>Reason:</b> ${esc(r.reason||'—')}</p><p><b>Status:</b> ${esc(r.status)}</p><p><b>Requested:</b> ${r.date?new Date(r.date).toLocaleString():'—'}</p><p><b>Internal note:</b> ${esc(r.note||'No note')}</p></div><div class="head-actions"><button class="btn danger" onclick="deleteReturn('${r.id}')">Delete return</button></div>`)}
function deleteReturn(id){if(!confirm('Delete this return record?'))return;returnsDB=returnsDB.filter(r=>r.id!==id);commit('Return record deleted');closeModal();show('returns')}
function exportReturns(){const rows=[['Return ID','Order ID','Customer','Email','Reason','Amount','Status','Requested','Note'],...returnsDB.map(r=>[r.id,r.orderId,r.customer,r.email,r.reason,r.amount,r.status,r.date,r.note])];downloadBlob('aehran-returns.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

function catalogUploadsPage(){return `${head('Catalog Uploads','Add many products quickly with CSV/JSON, or create a catalogue item from a compact form.',`<button class="btn ghost" onclick="downloadCatalogTemplate()">Download CSV template</button>`)}<div class="grid2"><div class="section-card"><h2>Bulk catalog import</h2><p>Upload a CSV or JSON file. Matching SKU or product ID is updated; new rows are added.</p><div class="field"><label>Catalog file</label><input id="catalogFile" type="file" accept=".csv,.json,text/csv,application/json"></div><button class="btn" onclick="importCatalogFile()">Upload catalog</button><p class="mini-note">Required for a new product: name, price and image. Recommended columns: id, name, sku, audience, product_type, category, collections, price, old_price, stock, color, tag, tags, image, gallery, variant_group, gallery_type, color_variants, description.</p></div><div class="section-card"><h2>Import rules</h2><div class="list"><div class="list-row"><div><b>Update safely</b><small>Rows match existing items by ID first, then SKU.</small></div><span class="status Delivered">On</span></div><div class="list-row"><div><b>Collections</b><small>Separate multiple collection slugs with | or commas.</small></div></div><div class="list-row"><div><b>Gallery images</b><small>Separate image URLs with |.</small></div></div><div class="list-row"><div><b>Local Bridge</b><small>Imported products are saved to the same storefront key.</small></div><span class="status Delivered">Connected</span></div></div></div></div><div class="section-card"><h2>Quick product upload</h2><p>Create one product without opening the full product editor.</p><form onsubmit="quickCatalogSave(event)"><div class="form-grid"><div class="field"><label>Product name</label><input id="cuName" required placeholder="Ivory Wedding Kurta Set"></div><div class="field"><label>SKU</label><input id="cuSku" placeholder="AHR-IVORY-01"></div><div class="field"><label>Category</label><select id="cuCat">${COLLECTIONS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div><div class="field"><label>Collections</label><input id="cuCollections" placeholder="new, men, wedding"></div><div class="field"><label>Price</label><input id="cuPrice" type="number" min="0" required></div><div class="field"><label>MRP / old price</label><input id="cuOld" type="number" min="0"></div><div class="field"><label>Stock</label><input id="cuStock" type="number" min="0" value="10"></div><div class="field"><label>Color</label><input id="cuColor" placeholder="Ivory"></div><div class="field wide"><label>Primary image URL</label><input id="cuImg" required placeholder="https://..."></div><div class="field wide"><label>Description</label><textarea id="cuDesc" rows="3"></textarea></div></div><button class="btn" type="submit">Publish product</button></form></div><div class="section-card"><h2>Catalog status</h2><div class="cards"><div class="stat"><label>Total products</label><strong>${products.length}</strong><small>Currently live in Local Bridge</small></div><div class="stat"><label>With stock</label><strong>${products.filter(p=>Number(p.stock)>0).length}</strong><small>Available products</small></div><div class="stat"><label>Out of stock</label><strong>${products.filter(p=>Number(p.stock)<=0).length}</strong><small>Need inventory update</small></div><div class="stat"><label>Collections</label><strong>${COLLECTIONS.length}</strong><small>Available catalog placements</small></div></div></div>`}
function quickCatalogSave(e){e.preventDefault();const cat=document.getElementById('cuCat').value,cols=parseMulti(document.getElementById('cuCollections').value);if(!cols.includes(cat))cols.push(cat);const name=document.getElementById('cuName').value.trim(),sku=document.getElementById('cuSku').value.trim()||'AHR-'+Date.now().toString().slice(-7),img=document.getElementById('cuImg').value.trim();const obj={id:slug(name)+'-'+Date.now().toString().slice(-5),name,sku,cat,collections:cols,price:Number(document.getElementById('cuPrice').value)||0,old:Number(document.getElementById('cuOld').value)||0,stock:Number(document.getElementById('cuStock').value)||0,color:document.getElementById('cuColor').value.trim(),tag:'New',rating:0,reviews:0,img,imgs:[img],desc:document.getElementById('cuDesc').value.trim()};products.unshift(obj);commit('Product published from Catalog Uploads');show('catalogUploads')}
function parseMulti(v){return [...new Set(String(v||'').split(/[|,]/).map(x=>slug(x)).filter(Boolean))]}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);if(!rows.length)return[];const h=rows.shift().map(x=>String(x).trim().toLowerCase().replace(/\s+/g,'_'));return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}
function normalizeCatalogRow(r){const name=String(r.name||r.product_name||r.title||'').trim(),sku=String(r.sku||'').trim(),audience=slug(r.audience||'men')||'men',productType=slug(r.product_type||r.productType||'kurta-set')||'kurta-set',cat=slug(r.category||r.cat||'kurta')||'kurta',img=String(r.image||r.img||r.primary_image||'').trim(),id=slug(r.id||'')||slug(name);const collections=parseMulti(r.collections||r.collection||'');if(cat&&!collections.includes(cat))collections.push(cat);if(audience==='kids'&&!collections.includes('kids'))collections.push('kids');if(audience==='men'&&!collections.includes('men'))collections.push('men');if(productType.includes('jacket')){if(!collections.includes('jacket'))collections.push('jacket');const jc=audience==='kids'?'kids-jacket':'men-jacket';if(!collections.includes(jc))collections.push(jc)}if(audience==='kids'&&productType==='kurta-set'&&!collections.includes('kids-kurta'))collections.push('kids-kurta');const gallery=String(r.gallery||r.images||'').split('|').map(x=>x.trim()).filter(Boolean);if(img&&!gallery.includes(img))gallery.unshift(img);let colorVariants=[];try{colorVariants=typeof r.color_variants==='string'&&r.color_variants.trim()?JSON.parse(r.color_variants):[]}catch(e){}return {id:id||'product-'+Date.now()+Math.random().toString(36).slice(2,6),name,sku:sku||'AHR-'+Date.now().toString().slice(-7)+Math.random().toString(36).slice(2,4).toUpperCase(),audience,productType,cat,collections,price:Number(r.price||0),old:Number(r.old_price||r.old||r.mrp||0),stock:Number(r.stock||0),color:String(r.color||'').trim(),tag:String(r.tag||'New').trim()||'New',tags:parseMulti(r.tags||''),rating:Number(r.rating||0),reviews:Number(r.reviews||0),img,imgs:gallery.length?gallery:(img?[img]:[]),galleryType:String(r.gallery_type||r.galleryType||'multi-angle'),variantGroup:String(r.variant_group||r.variantGroup||''),colorVariants,desc:String(r.description||r.desc||'').trim()}}
function mergeCatalogRows(rows){let added=0,updated=0,skipped=0;rows.forEach(r=>{const obj=normalizeCatalogRow(r);if(!obj.name||!obj.img||!Number.isFinite(obj.price)){skipped++;return}let i=products.findIndex(p=>obj.id&&p.id===obj.id);if(i<0&&obj.sku)i=products.findIndex(p=>String(p.sku).toLowerCase()===obj.sku.toLowerCase());if(i>=0){products[i]={...products[i],...obj,id:products[i].id};updated++}else{products.unshift(obj);added++}});commit(`Catalog upload: ${added} added, ${updated} updated, ${skipped} skipped`);show('catalogUploads')}
function importCatalogFile(){const f=document.getElementById('catalogFile')?.files?.[0];if(!f)return toast('Choose a CSV or JSON catalog file');const rd=new FileReader();rd.onload=()=>{try{let rows=[];if(f.name.toLowerCase().endsWith('.json')){const d=JSON.parse(rd.result);rows=Array.isArray(d)?d:(Array.isArray(d.products)?d.products:[])}else rows=parseCSV(rd.result);if(!rows.length)return toast('No catalog rows found');mergeCatalogRows(rows)}catch(e){console.error(e);toast('Could not read this catalog file')}};rd.readAsText(f)}
function downloadCatalogTemplate(){const rows=[['id','name','sku','category','collections','price','old_price','stock','color','tag','image','gallery','description'],['ivory-kurta','Ivory Wedding Kurta Set','AHR-IVORY-01','kurta','new|men|wedding','4990','5990','12','Ivory','New','https://example.com/main.jpg','https://example.com/main.jpg|https://example.com/2.jpg','Premium festive kurta set']];downloadBlob('aehran-catalog-template.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

function paymentsPage(){const valid=orders.filter(o=>o.status!=='Cancelled'),gross=valid.reduce((s,o)=>s+Number(o.total||0),0),refund=returnsDB.filter(r=>r.status==='Refunded').reduce((s,r)=>s+Number(r.amount||0),0),settled=valid.filter(o=>getSettlementStatus(o)==='Settled').reduce((s,o)=>s+paymentNet(o),0);return `${head('Payments','Track order payments, refunds and settlement status.',`<button class="btn ghost" onclick="exportPayments()">Export CSV</button>`)}<div class="cards"><div class="stat"><label>Gross collected</label><strong>${money(gross)}</strong><small>Non-cancelled orders</small></div><div class="stat"><label>Refunded</label><strong>${money(refund)}</strong><small>Returns marked Refunded</small></div><div class="stat"><label>Settled</label><strong>${money(settled)}</strong><small>Marked settled in admin</small></div><div class="stat"><label>Net payable</label><strong>${money(Math.max(0,gross-refund))}</strong><small>Gross minus refunds</small></div></div><div class="search-row" style="margin-top:16px"><input class="input" id="paymentSearch" placeholder="Search order, customer, method..." oninput="renderPaymentsTable()"><select id="paymentSettlement" onchange="renderPaymentsTable()"><option value="">All settlements</option>${['Pending','Settled','On Hold'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Method</th><th>Order status</th><th>Gross</th><th>Refund</th><th>Net</th><th>Settlement</th></tr></thead><tbody id="paymentsTbody"></tbody></table></div><div class="section-card" style="margin-top:16px"><h2>How this page works</h2><p>This build has no live payment gateway settlement API yet. Amounts come from AEHRAN orders and refunded return records; settlement status is an admin tracking field stored in Local Bridge.</p></div>`}
function returnRefundForOrder(id){return returnsDB.filter(r=>r.orderId===id&&r.status==='Refunded').reduce((s,r)=>s+Number(r.amount||0),0)}
function paymentNet(o){return Math.max(0,Number(o.total||0)-returnRefundForOrder(o.id))}
function getSettlementStatus(o){return paymentSettlements[o.id]||'Pending'}
function renderPaymentsTable(){const tb=document.getElementById('paymentsTbody');if(!tb)return;const q=(document.getElementById('paymentSearch')?.value||'').toLowerCase(),st=document.getElementById('paymentSettlement')?.value||'';const list=orders.slice().reverse().filter(o=>o.status!=='Cancelled').filter(o=>(!st||getSettlementStatus(o)===st)&&JSON.stringify(o).toLowerCase().includes(q));tb.innerHTML=list.map(o=>{const ref=returnRefundForOrder(o.id),ss=getSettlementStatus(o);return `<tr><td><b>${esc(o.id)}</b><br><small>${o.date?new Date(o.date).toLocaleDateString('en-IN'):'—'}</small></td><td>${esc(o.name||'—')}<br><small>${esc(o.email||'')}</small></td><td>${esc(o.payment||'—')}</td><td><span class="status ${esc(o.status)}">${esc(o.status)}</span></td><td>${money(o.total)}</td><td>${money(ref)}</td><td><b>${money(paymentNet(o))}</b></td><td><select onchange="setSettlementStatus('${o.id}',this.value)">${['Pending','Settled','On Hold'].map(x=>`<option ${x===ss?'selected':''}>${x}</option>`).join('')}</select></td></tr>`}).join('')||`<tr><td colspan="8"><div class="empty">No payment records yet.</div></td></tr>`}
function setSettlementStatus(id,status){paymentSettlements[id]=status;commit('Payment settlement '+id+' marked '+status);renderPaymentsTable()}
function exportPayments(){const rows=[['Order ID','Date','Customer','Email','Payment Method','Order Status','Gross','Refund','Net','Settlement'],...orders.filter(o=>o.status!=='Cancelled').map(o=>[o.id,o.date,o.name,o.email,o.payment,o.status,o.total,returnRefundForOrder(o.id),paymentNet(o),getSettlementStatus(o)])];downloadBlob('aehran-payments.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

function shippingPage(){const c=cms.checkout;return `${head('Shipping & Payments','Control checkout labels and which payment methods customers can choose.',`<button class="btn" onclick="saveShipping()">Save settings</button>`)}<div class="grid2"><div class="section-card"><h2>Checkout</h2><div class="field"><label>Checkout title</label><input id="coTitle" value="${attr(c.title)}"></div><div class="field"><label>Shipping line</label><input id="coShip" value="${attr(c.shippingLabel)}"></div><div class="field"><label>Place order button</label><input id="coButton" value="${attr(c.orderButton)}"></div></div><div class="section-card"><h2>Payment methods</h2>${c.payments.map((x,i)=>`<div style="border-bottom:1px solid #eef0f2;padding:9px 0"><label class="check"><input id="payActive${i}" type="checkbox" ${x.active?'checked':''}> Enable ${esc(x.id)}</label><div class="field"><input id="payLabel${i}" value="${attr(x.label)}"></div><div class="field"><input id="payNote${i}" value="${attr(x.note)}"></div></div>`).join('')}</div></div>`}
function saveShipping(){cms.checkout.title=document.getElementById('coTitle').value;cms.checkout.shippingLabel=document.getElementById('coShip').value;cms.checkout.orderButton=document.getElementById('coButton').value;cms.checkout.payments.forEach((x,i)=>{x.active=document.getElementById('payActive'+i).checked;x.label=document.getElementById('payLabel'+i).value;x.note=document.getElementById('payNote'+i).value});commit('Checkout settings updated')}
function policiesPage(){return `${head('Policies','Edit the policy content shown from the storefront menu.',`<button class="btn" onclick="savePolicies()">Save policies</button>`)}${[['shipping','Shipping & Delivery'],['returns','Returns & Exchanges'],['privacy','Privacy Policy'],['terms','Terms & Conditions'],['size','Size Guide']].map(x=>`<div class="section-card"><h2>${x[1]}</h2><textarea class="input" id="policy_${x[0]}" rows="5">${esc(cms.policies[x[0]])}</textarea></div>`).join('')}`}
function savePolicies(){Object.keys(cms.policies).forEach(k=>cms.policies[k]=document.getElementById('policy_'+k).value);commit('Policies updated')}
function footerPage(){const f=cms.footer,s=cms.seo;return `${head('SEO & Footer','Control search metadata, newsletter copy and footer brand information.',`<button class="btn" onclick="saveFooter()">Save footer & SEO</button>`)}<div class="grid2"><div class="section-card"><h2>SEO</h2><div class="field"><label>Page title</label><input id="seoTitle" value="${attr(s.title)}"></div><div class="field"><label>Meta description</label><textarea id="seoDesc" rows="4">${esc(s.description)}</textarea></div></div><div class="section-card"><h2>Newsletter</h2><div class="field"><label>Heading</label><input id="footNewsTitle" value="${attr(f.newsletterTitle)}"></div><div class="field"><label>Text</label><textarea id="footNewsText">${esc(f.newsletterText)}</textarea></div></div></div><div class="section-card"><h2>Footer content</h2><div class="form-grid"><div class="field wide"><label>Brand about</label><textarea id="footAbout" rows="4">${esc(f.about)}</textarea></div><div class="field"><label>Contact email</label><input id="footEmail" value="${attr(f.contactEmail)}"></div><div class="field"><label>Instagram</label><input id="footIg" value="${attr(f.instagram)}"></div><div class="field wide"><label>Copyright</label><input id="footCopy" value="${attr(f.copyright)}"></div></div></div>`}
function saveFooter(){cms.seo.title=document.getElementById('seoTitle').value;cms.seo.description=document.getElementById('seoDesc').value;cms.footer.newsletterTitle=document.getElementById('footNewsTitle').value;cms.footer.newsletterText=document.getElementById('footNewsText').value;cms.footer.about=document.getElementById('footAbout').value;cms.footer.contactEmail=document.getElementById('footEmail').value;cms.footer.instagram=document.getElementById('footIg').value;cms.footer.copyright=document.getElementById('footCopy').value;commit('Footer and SEO updated')}
function backendPage(){return `${head('Data Sync','Store data sync is separate from admin login. User accounts in this build do not use Firebase Authentication.')}<div class="grid2"><div class="section-card"><h2>AEHRAN Local Bridge</h2><p>Products, banners, homepage copy, navigation, orders, returns and store settings use the same AEHRAN browser storage keys and BroadcastChannel.</p><div class="list-row"><div><b>Admin ↔ Storefront</b><small>Works when index.html and admin.html are hosted on the same domain/origin and opened in the same browser profile.</small></div><span class="status Delivered">Ready</span></div><div class="backend-note" style="margin-top:12px">No cloud SDK is included in this build. Cross-device syncing can be connected later when you decide which backend to use.</div></div><div class="section-card"><h2>Data controlled from Admin</h2><div class="collection-grid">${['Products & stock','Kids / Men / Jackets / Wedding categories','Hero banners','Homepage & Trending copy','Navigation','Branding & theme','Orders & labels','Returns / refunds','Payments tracking','Policies','SEO & footer'].map(x=>`<div class="collection-card"><b>${x}</b><small>AEHRAN local store data</small></div>`).join('')}</div></div></div>`}
function backupPage(){const size=(JSON.stringify({products,orders,reviewsDB,cms,media}).length/1024).toFixed(1);return `${head('Backup & Local Sync','Export or restore your store data and see the current local connection mode.')}<div class="grid2"><div class="section-card"><h2>AEHRAN Local Bridge</h2><p>Current data size: ${size} KB</p><div class="head-actions"><button class="btn" onclick="exportBackup()">Download full backup</button><label class="btn ghost">Import backup<input hidden type="file" accept="application/json" onchange="importBackup(this)"></label></div><p class="mini-note">Storefront and admin share AEHRAN browser-storage keys. Keep both files on the same domain/origin for local live control.</p></div><div class="section-card"><h2>Connection status</h2><div class="list-row"><div><b>Local Bridge</b><small>Products, orders, CMS, reviews, labels and media</small></div><span class="status Delivered">Ready</span></div><div class="list-row"><div><b>Cloud backend</b><small>Not included in this build</small></div><span class="status">Off</span></div></div></div><div class="section-card"><h2>Recent admin activity</h2><div class="list">${audit.slice(0,20).map(a=>`<div class="list-row"><div><b>${esc(a.msg)}</b><small>${new Date(a.time).toLocaleString()}</small></div></div>`).join('')||'<div class="empty">No admin changes yet.</div>'}</div></div><div class="section-card danger-zone"><h2>Reset demo store</h2><p>Restores seed products and default CMS. Existing orders are kept unless you choose the full reset.</p><div class="head-actions"><button class="btn danger" onclick="resetCatalogue()">Reset catalogue & CMS</button><button class="btn danger" onclick="fullReset()">Full reset including orders</button></div></div>`}
function exportBackup(){const data={version:3,exportedAt:new Date().toISOString(),aehran_products:products,aehran_orders:orders,aehran_reviews:reviewsDB,aehran_cms:cms,aehran_media:media,aehran_returns:returnsDB,aehran_payment_settlements:paymentSettlements,aehran_delivery_partners:deliveryPartners};downloadBlob('aehran-full-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json')}
function importBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);products=d.aehran_products||products;orders=d.aehran_orders||orders;reviewsDB=d.aehran_reviews||reviewsDB;cms=d.aehran_cms||cms;media=d.aehran_media||media;returnsDB=d.aehran_returns||returnsDB;paymentSettlements=d.aehran_payment_settlements||paymentSettlements;deliveryPartners=d.aehran_delivery_partners||deliveryPartners;commit('Backup imported');show('dashboard')}catch(e){toast('Invalid AEHRAN backup file')}};r.readAsText(f)}
function resetCatalogue(){if(!confirm('Reset products and CMS to the AEHRAN demo defaults?'))return;products=clone(SEED_PRODUCTS);cms=clone(DEFAULT_CMS);commit('Catalogue and CMS reset');show('dashboard')}
function fullReset(){if(!confirm('This will also delete all local orders, reviews, returns and payment settlement records. Continue?'))return;products=clone(SEED_PRODUCTS);orders=[];reviewsDB={};cms=clone(DEFAULT_CMS);media=[];returnsDB=[];paymentSettlements={};commit('Full demo store reset');show('dashboard')}
function downloadBlob(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openStorefront(){let url=localStorage.getItem('aehran_storefront_url');if(!url){url=prompt('Storefront URL or relative path','../AEHRAN-Final/index.html')||'';if(url)localStorage.setItem('aehran_storefront_url',url)}if(url)window.open(url,'_blank')}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalWrap').classList.add('open')}
function closeModal(){document.getElementById('modalWrap').classList.remove('open')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),2200)}
window.addEventListener('storage',e=>{if(['aehran_orders','aehran_products','aehran_reviews','aehran_returns','aehran_payment_settlements','aehran_cms','aehran_media','aehran_delivery_partners','aehran_admin_users'].includes(e.key)&&sessionStorage.getItem('aehran_admin_panel')==='1'){products=load('aehran_products',SEED_PRODUCTS);orders=load('aehran_orders',[]);ensureOrderLabels();reviewsDB=load('aehran_reviews',{});returnsDB=load('aehran_returns',[]);paymentSettlements=load('aehran_payment_settlements',{});cms=load('aehran_cms',DEFAULT_CMS);media=load('aehran_media',[]);deliveryPartners=load('aehran_delivery_partners',DEFAULT_DELIVERY_PARTNERS);adminUsers=load('aehran_admin_users',DEFAULT_ADMIN_USERS);if(e.key==='aehran_orders')scheduleAutoDeliveries();if(['dashboard','orders','returns','payments','products','categoryControl','banners','homepage','navigation','display','deliveryPartners','users'].includes(current))show(current)}});
renderApp();

const config={apiKey:"AIzaSyBmdVZbj1L6hF7mfsxI0XD3KoI3NrSuNjg",authDomain:"aehran123.firebaseapp.com",databaseURL:"https://aehran123-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"aehran123",storageBucket:"aehran123.firebasestorage.app",messagingSenderId:"1052165867764",appId:"1:1052165867764:web:638b4b01424ec6a4ee76a1",measurementId:"G-965R6T00TK"};
const app=getApps().length?getApp():initializeApp(config),db=getDatabase(app),IMAGE_ROOT='aehran_image_store_v1',cache=new Map(),pending=new Map();
const keyFor=async data=>{try{const bytes=new TextEncoder().encode(data);const hash=await crypto.subtle.digest('SHA-256',bytes);return 'img_'+[...new Uint8Array(hash)].slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('')+'_'+data.length.toString(36)}catch(e){return 'img_'+Date.now()+'_'+Math.random().toString(36).slice(2,10)}};
window.__aehranUploadDbImage=async(data,name='AEHRAN image')=>{if(typeof data!=='string'||!data.startsWith('data:image/'))throw new Error('Invalid image data');const key=await keyFor(data);await set(ref(db,`${IMAGE_ROOT}/${key}`),{data,name:String(name||'AEHRAN image').slice(0,120),updatedAt:Date.now()});cache.set(key,data);return 'dbimg:'+key};
async function resolveDbImage(value){if(typeof value!=='string'||!value.startsWith('dbimg:'))return value;const key=value.slice(6);if(cache.has(key))return cache.get(key);if(pending.has(key))return pending.get(key);const p=get(ref(db,`${IMAGE_ROOT}/${key}`)).then(s=>{const v=s.exists()?s.val():null,d=typeof v==='string'?v:v?.data||'';if(d)cache.set(key,d);pending.delete(key);return d}).catch(e=>{pending.delete(key);console.warn('AEHRAN image load failed',key,e);return ''});pending.set(key,p);return p}
window.__aehranResolveDbImage=resolveDbImage;
async function hydrate(root=document){const imgs=[...(root.querySelectorAll?.('img')||[])];for(const im of imgs){const raw=im.getAttribute('data-dbimg')||im.getAttribute('src')||'';if(!raw.startsWith('dbimg:'))continue;im.setAttribute('data-dbimg',raw);const d=await resolveDbImage(raw);if(d)im.src=d}}

</script>

(function(){

   })
 }
 function __aehranMergeCMS(base,remote,key=''){

   if(remote&&typeof remote==='object'){const out={...(base&&typeof base==='object'?base:{})};for(const [k,v] of Object.entries(remote))out[k]=__aehranMergeCMS(out[k],v,k);return out}

 if(typeof commit==='function'&&!commit.__fbWrapped){const old=commit;commit=function(msg='Changes saved'){old(msg);if(!window.__aehranApplyingRemote){const e=document.getElementById('syncText');if(e)e.textContent='Syncing Firebase…';window.__aehranFirebaseAdminSave?.(window.AEHRAN_ADMIN_BRIDGE.snapshot())}};commit.__fbWrapped=true}

<script type="module" id="aehran-firebase-admin-module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAnalytics,isSupported as analyticsSupported} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
import {getDatabase,ref,get,set,onValue,update} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBmdVZbj1L6hF7mfsxI0XD3KoI3NrSuNjg",
  authDomain:"aehran123.firebaseapp.com",
  databaseURL:"https://aehran123-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"aehran123",
  storageBucket:"aehran123.firebasestorage.app",
  messagingSenderId:"1052165867764",
  appId:"1:1052165867764:web:638b4b01424ec6a4ee76a1",
  measurementId:"G-965R6T00TK"
};
const ROOT='aehran_store_v3',ADMIN_USERS_ROOT='aehran_admin_accounts',app=getApps().length?getApp():initializeApp(firebaseConfig);
try{if(await analyticsSupported())getAnalytics(app)}catch(e){}
const db=getDatabase(app);
const arr=v=>Array.isArray(v)?v.filter(Boolean):(v&&typeof v==='object'?Object.values(v).filter(Boolean):[]);
const safe=s=>String(s).replace(/[.#$\[\]/]/g,'_');
const map=a=>Object.fromEntries((a||[]).filter(Boolean).map((x,i)=>[safe(x.id||x.labelId||x.url||('row_'+i)),x]));
const status=t=>{const e=document.getElementById('syncText');if(e)e.textContent=t;const b=document.getElementById('firebaseAdminBadge');if(b)b.textContent=t};
const cleanAdminUser=u=>({id:String(u?.id||''),name:String(u?.name||''),email:String(u?.email||'').trim().toLowerCase(),role:['Admin','Manager','Employee'].includes(u?.role)?u.role:'Employee',active:u?.active!==false,salt:String(u?.salt||''),passwordHash:String(u?.passwordHash||''),createdAt:String(u?.createdAt||''),lastLoginAt:String(u?.lastLoginAt||'')});
const packAdminUsers=users=>Object.fromEntries((users||[]).map(cleanAdminUser).filter(u=>u.id&&u.email&&u.passwordHash).map(u=>[safe(u.id),u]));
const unpackAdminUsers=v=>arr(v).map(cleanAdminUser).filter(u=>u.id&&u.email&&u.passwordHash);
let adminUsersQueue=Promise.resolve();
function saveAdminUsersCloud(users){adminUsersQueue=adminUsersQueue.then(async()=>{await set(ref(db,ADMIN_USERS_ROOT),packAdminUsers(users));window.__aehranAdminAccountsReady=true;return true});return adminUsersQueue}
window.__aehranFirebaseAdminUsersSave=saveAdminUsersCloud;
async function loadAdminUsersCloud(){const snap=await get(ref(db,ADMIN_USERS_ROOT));if(!snap.exists()){const seed=window.AEHRAN_ADMIN_BRIDGE?.adminUsersSnapshot?.()||[];await saveAdminUsersCloud(seed);window.AEHRAN_ADMIN_BRIDGE?.applyAdminUsers(seed)}else{const cloudUsers=unpackAdminUsers(snap.val());if(cloudUsers.length)window.AEHRAN_ADMIN_BRIDGE?.applyAdminUsers(cloudUsers)}window.__aehranAdminAccountsReady=true;return true}
window.__aehranAdminAccountsReadyPromise=loadAdminUsersCloud();

function clean(v){
  if(typeof v==='string'){
    if(v.startsWith('data:image/')||v.startsWith('blob:')||v.includes('firebasestorage.googleapis.com'))return '';
    return v;
  }
  if(Array.isArray(v))return v.map(clean);
  if(v&&typeof v==='object'){const o={};for(const [k,x] of Object.entries(v))o[k]=clean(x);return o}
  return v;
}
function pack(s){
  const c=clean(s);
  return {
    products:map(c.products),orders:map(c.orders),reviews:c.reviews||{},cms:c.cms||{},
    media:Array.isArray(c.media)?c.media:[],returns:map(c.returns),
    paymentSettlements:c.paymentSettlements||{}
  };
}
const unpack=v=>({
  products:arr(v?.products),
  orders:arr(v?.orders).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))),
  reviews:v?.reviews||{},cms:v?.cms||{},media:Array.isArray(v?.media)?v.media:arr(v?.media),
  returns:arr(v?.returns),paymentSettlements:v?.paymentSettlements||{}
});

let last={};
const fingerprint=v=>JSON.stringify(v??null);
function mark(data){
  for(const k of ['products','orders','reviews','cms','media','returns','paymentSettlements'])last[k]=fingerprint(data[k]);
}
let queue=Promise.resolve();
async function writeSnapshot(snapshot,force=false){
  const c=pack(snapshot),jobs=[];
  const write=(key,val)=>{
    const fp=fingerprint(val);
    if(force||fp!==last[key]){jobs.push(set(ref(db,`${ROOT}/${key}`),val));last[key]=fp}
  };
  write('products',c.products);
  write('orders',c.orders);
  write('reviews',c.reviews);
  write('cms',c.cms);
  write('media',c.media);
  write('returns',c.returns);
  write('paymentSettlements',c.paymentSettlements);
  await Promise.all(jobs);
  await update(ref(db,`${ROOT}/meta`),{
    schemaVersion:4,brand:'AEHRAN',updatedAt:Date.now(),
    lastWriteSource:'admin',imageMode:'realtime-media-refs'
  });
}
function saveAll(snapshot,force=false){
  queue=queue.then(async()=>{
    try{status('Syncing Firebase…');await writeSnapshot(snapshot,force);status('Firebase Live')}
    catch(e){console.error('AEHRAN Firebase admin save failed',e);status('Firebase error');try{toast('Firebase save failed')}catch(_){};throw e}
  });
  return queue;
}
window.__aehranFirebaseAdminSave=s=>saveAll(s,false);
window.__aehranFirebaseAdminForcePush=s=>saveAll(s,true);
window.__aehranFirebaseAdminReload=async()=>{
  try{status('Loading Firebase…');const s=await get(ref(db,ROOT));if(s.exists()){const d=unpack(s.val());mark(pack(d));window.AEHRAN_ADMIN_BRIDGE?.applyRemote(d)}status('Firebase Live')}
  catch(e){console.error(e);status('Firebase error')}
};

try{
  const b=window.AEHRAN_ADMIN_BRIDGE,s=await get(ref(db,ROOT));
  if(!s.exists()){await saveAll(b.snapshot(),true)}
  else{const d=unpack(s.val());mark(pack(d));b.applyRemote(d)}
  onValue(ref(db,ROOT),x=>{
    if(!x.exists())return;
    const d=unpack(x.val());mark(pack(d));b.applyRemote(d)
  },e=>{console.error('Admin realtime listener',e);status('Firebase blocked')});
  await window.__aehranAdminAccountsReadyPromise;
  onValue(ref(db,ADMIN_USERS_ROOT),x=>{if(!x.exists())return;const users=unpackAdminUsers(x.val());if(users.length)window.AEHRAN_ADMIN_BRIDGE?.applyAdminUsers(users)},e=>console.error('Admin accounts realtime listener',e));
  status('Firebase Live');
  console.log('AEHRAN admin: Realtime Database connected; Firebase Storage disabled; admin direct image upload enabled');
}catch(e){console.error(e);status('Firebase blocked')}
</script>
