function aeCurrentProductId(){try{return location.hash.startsWith('#product=')?decodeURIComponent(location.hash.slice('#product='.length)):''}catch(e){return ''}}
function aeProductSizeList(p){
  const raw=Array.isArray(p?.sizes)?p.sizes:(typeof p?.sizes==='string'?p.sizes.split(/[|,]/).map(x=>x.trim()).filter(Boolean):[]);
  if(raw.length)return raw.map(x=>String(x).trim()).filter(Boolean);
  const kids=p?.audience==='kids'||p?.cat==='kids'||p?.cat==='kids-kurta'||p?.cat==='kids-jacket';
  return kids?['3-4 years','5-6 years','7-8 years','9-10 years','11-12 years','13-14 years']:['XS','S','M','L','XL','XXL'];
}
function aeIsValidNormalSize(p,size){return aeProductSizeList(p).some(x=>String(x)===String(size))}
function chooseSize(el,s){
  const value=String(s??'').trim(),pId=aeCurrentProductId(),p=products.find(x=>String(x.id)===String(pId));
  if(!value||!p||!aeIsValidNormalSize(p,value))return;
  const variants=Array.isArray(p.sizeVariants)?p.sizeVariants:(Array.isArray(p.variants)?p.variants:[]);
  const v=variants.find(x=>String(x.size||x.name||x.variantSize||'')===value);
  if(v&&v.stock!=null&&Number(v.stock)<=0){toast('This size is out of stock');return}
  selectedSize=value;selectedSizeProductId=String(p.id);
  const scope=el?.closest?.('.pinfo')||document;
  scope.querySelectorAll('.sizes .size:not(.combo-father):not(.combo-son)').forEach(x=>{
    const active=String(x.dataset.size||x.textContent||'').trim()===value;
    x.classList.toggle('active',active);x.setAttribute('aria-pressed',active?'true':'false');x.dataset.selected=active?'true':'false';
  });
  if(v){
    const priceEl=scope.querySelector('[data-pdp-price]');
    if(priceEl&&Number.isFinite(Number(v.price)))priceEl.textContent=money(Number(v.price));
    const stockEl=scope.querySelector('[data-pdp-stock]');
    if(stockEl&&v.stock!=null)stockEl.textContent=Number(v.stock)>0?`${Number(v.stock)} left`:'Out of stock';
  }
  document.dispatchEvent(new CustomEvent('aehran:sizechange',{detail:{productId:String(p.id),size:value,variant:v||null}}));
}

function addCart(id){
  const p=products.find(x=>String(x.id)===String(id));if(!p)return false;
  if(Number(p.stock||0)<1){toast('This style is currently out of stock');return false}
  if(p.isCombo&&(!selectedFatherSize||!selectedSonSize)){toast('Please select both Father Size and Son Size');return false}
  if(!p.isCombo&&!aeIsValidNormalSize(p,selectedSize)){toast('Please select a valid size');return false}
  if(!p.isCombo){
    const variants=Array.isArray(p.sizeVariants)?p.sizeVariants:(Array.isArray(p.variants)?p.variants:[]);
    const v=variants.find(x=>String(x.size||x.name||x.variantSize||'')===String(selectedSize));
    if(v&&v.stock!=null&&Number(v.stock)<=0){toast('This size is out of stock');return false}
  }
  const cartSize=p.isCombo?'Combo':selectedSize, father=p.isCombo?selectedFatherSize:'', son=p.isCombo?selectedSonSize:'';
  const e=cart.find(x=>String(x.id)===String(id)&&x.size===cartSize&&x.color===selectedColor&&x.fatherSize===father&&x.sonSize===son);
  if(e)e.qty++;else cart.push({...p,qty:1,size:cartSize,color:selectedColor,fatherSize:father,sonSize:son});
  persist();syncBadges();toast('Added to your bag');return true;
}

function aeAuthPage(){const fc=sessionStorage.getItem('aeAfterLogin')==='#checkout';setTimeout(()=>aeAuthTab(aeAuthMode),0);return `<section class="page"><div class="wrap" style="max-width:520px"><div class="section-head"><div><div class="eyebrow">AEHRAN account</div><h2>${fc?'Sign in to place your order':'Sign in or create your account'}</h2></div></div><div class="check-card">${fc?'<p style="font-size:11px;color:var(--muted);margin:0 0 14px">Please sign in once before your first order. Your bag is saved.</p>':''}<button type="button" class="btn full" id="aeGoogleBtn" onclick="aeGoogleLogin()" style="background:#fff;color:#222;border:1px solid #dadce0;gap:10px"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button><div style="text-align:center;font-size:10px;color:var(--muted);margin:14px 0">or use email &amp; password</div><div style="display:flex;gap:8px;margin-bottom:12px"><button type="button" class="btn ghost" id="aeTabIn" onclick="aeAuthTab('in')" style="flex:1">Sign in</button><button type="button" class="btn ghost" id="aeTabUp" onclick="aeAuthTab('up')" style="flex:1">Create account</button></div><form class="loginform" onsubmit="aeEmailAuth(event)"><div id="aeUpFields" style="display:none"><input id="aeName" placeholder="Full name" autocomplete="name"><input id="aePhone" inputmode="tel" placeholder="Mobile number (optional)" autocomplete="tel"></div><input id="aeEmail" required type="email" placeholder="Email address" autocomplete="email"><input id="aePass" required type="password" minlength="6" placeholder="Password (min 6 characters)" autocomplete="current-password"><button class="btn" id="aeSubmit">Sign in</button><button type="button" class="text-link" onclick="aeForgot()" style="border:0;background:none;padding:8px 0;text-align:left">Forgot password?</button></form><div id="aeAuthMsg" style="font-size:11px;margin-top:10px;min-height:16px;color:#a53e3e"></div></div></div></section>${footer()}`}

async function aeHandleSecureOrderResult(result){const order=result?.order;if(!order)return;const aeIdx=orders.findIndex(x=>String(x.id)===String(order.id)),aeExisted=aeIdx>=0;if(aeExisted)orders[aeIdx]=Object.assign({},orders[aeIdx],order);else orders.push(order);if(!aeExisted&&Array.isArray(order.items)){order.items.forEach(it=>{const p=products.find(p=>String(p.id)===String(it.id));if(p)p.stock=Math.max(0,p.stock-Number(it.qty||0))})}if(document.getElementById('saveAddr')?.checked){profile=profile||{name:order.name,email:order.email,phone:order.phone};profile.address=order.address}cart=[];coupon=null;persist();syncBadges();openModal(`<div class="order-success"><div class="success-pop"><div class="success-mark"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="success-circle" cx="50" cy="50" r="41"></circle><path class="success-check" d="M29 51.5 43.5 66 72 36"></path></svg></div></div><div class="eyebrow">Order confirmed</div><h3>Thank you, ${escapeHTML(order.name||'Customer')}.</h3><div class="order-id-pill">${escapeHTML(order.id)}</div><p>Your order is confirmed. GST and the final payable amount have been saved with this order.</p><div class="modal-menu"><a href="#orders" onclick="closeModal()"><span>View Order History</span><span>→</span></a><a href="#home" onclick="closeModal()"><span>Continue shopping</span><span>→</span></a></div></div>`)}
function aeSecurePayload(){return {cart:cart.map(x=>({id:x.id,qty:x.qty,size:x.size||'',color:x.color||'',fatherSize:x.fatherSize||'',sonSize:x.sonSize||''})),couponCode:coupon?.code||'',paymentMethod:document.querySelector('input[name="pay"]:checked')?.value||'COD',customer:{name:document.getElementById('name')?.value||'',email:document.getElementById('email')?.value||'',phone:document.getElementById('phone')?.value||'',address:document.getElementById('address')?.value||'',city:document.getElementById('city')?.value||'',state:document.getElementById('state')?.value||'',pincode:document.getElementById('pincode')?.value||'',addressType:document.getElementById('addrtype')?.value||'Home'}}}
async function placeOrder(){if(!aeLoggedIn()){sessionStorage.setItem('aeAfterLogin','#checkout');toast('Please sign in to place your order');location.hash='#account';return}{const em=document.getElementById('email');if(em&&profile.email)em.value=profile.email}const ids=['name','phone','email','address','city','pincode','state'];for(const id of ids){const el=document.getElementById(id);if(!el?.value?.trim()){el?.focus();toast('Please complete your delivery details');return}}const phone=document.getElementById('phone').value.replace(/\D/g,'');if(!/^\d{10}$/.test(phone)){toast('Enter a valid 10-digit mobile number');return}if(!/^\d{6}$/.test(document.getElementById('pincode').value)){toast('Enter a valid 6-digit pincode');return}if(!cart.length)return toast('Your bag is empty');const selected=document.querySelector('input[name="pay"]:checked')?.value||'COD';const payload=aeSecurePayload();try{if(!window.__aehranSecureReady){toast('Secure checkout is still loading. Please try again.');return}if(selected==='COD'){const result=await window.__aehranCreateCodOrder(payload);await aeHandleSecureOrderResult(result);return}const result=await window.__aehranCreateRazorpayOrder(payload);if(!result?.orderId||!result?.amount){toast('Secure payment order could not be created');return}if(typeof Razorpay==='undefined'){toast('Payment gateway could not load');return}const rz=new Razorpay({key:result.keyId,amount:result.amount,currency:result.currency||'INR',name:cms.branding?.brandName||'AEHRAN',description:'AEHRAN order payment',order_id:result.orderId,prefill:{name:payload.customer.name,email:payload.customer.email,contact:phone},notes:{source:'AEHRAN Storefront',gstRate:String(result.calculation?.gstRate??''),gstAmount:String(result.calculation?.gstAmount??'')},theme:{color:'#0c1825'},handler:async function(resp){try{const verified=await window.__aehranVerifyRazorpayPayment({...payload,razorpayOrderId:resp.razorpay_order_id||result.orderId,razorpayPaymentId:resp.razorpay_payment_id||'',razorpaySignature:resp.razorpay_signature||''});await aeHandleSecureOrderResult(verified)}catch(e){console.error(e);toast(e?.message||'Payment verification failed. Your order was not created.')}}});rz.on('payment.failed',function(){toast('Payment was not completed. You can retry checkout safely.')});rz.open()}catch(e){console.error(e);toast(e?.message||'Secure checkout failed. Please try again.')}}
function trackOrderModal(){openModal(`<button class="icon-btn close" onclick="closeModal()">✕</button><div class="eyebrow">Order tracking</div><h3>Track your AEHRAN order</h3><form class="loginform" onsubmit="trackOrder(event)"><input id="trackId" required placeholder="Order ID e.g. AHR123456"><button class="btn">Track order</button></form><div id="trackResult"></div>`)}

function renderSearch(q){const term=q.toLowerCase().trim(),list=term?products.filter(p=>(p.name+' '+p.cat+' '+p.color+' '+p.tag+' '+p.desc).toLowerCase().includes(term)):products.slice(0,8);document.getElementById('searchResults').innerHTML=list.slice(0,10).map(p=>`<a class="s-item" href="#product=${p.id}" onclick="closeSearch()"><img src="${p.img}"><h4>${p.name}</h4><span>${money(p.price)}</span></a>`).join('');document.getElementById('searchHint').textContent=term?`${list.length} results for “${q}”`:'Popular right now';safeImg()}

function escapeHTML(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function escapeAttr(s=''){return escapeHTML(s)}

<script>
(function(){
  /* Normalize audience/category data so kids never leak into Men's Kurta Sets. */
  function classifyClientProduct(p){
    const name=String(p.name||'').toLowerCase();
    const id=String(p.id||'').toLowerCase();
    const cols=Array.isArray(p.collections)?p.collections:[];
    const isKids=p.cat==='kids'||cols.includes('kids')||id.startsWith('kids-');
    const isKidsJacket=isKids&&(cols.includes('kids-jacket')||/jacket|nehru|brocade/.test(name));
    const isKidsKurta=isKids&&!isKidsJacket;
    const isMenJacket=!isKids&&(p.cat==='jacket'||cols.includes('jacket'));
    return {isKids,isKidsJacket,isKidsKurta,isMenJacket};
  }

  /* Do not infer or write collection assignments on page load. */
  const originalCategoryMatch=categoryMatch;
  categoryMatch=function(p,type){
    const cols=Array.isArray(p.collections)?p.collections:[];
    const hasExplicitCollections=Array.isArray(p.collections);
    const c=classifyClientProduct(p);
    if(type==='all')return true;
    if(type==='sale')return Number(p.old)>Number(p.price);
    if(type==='ready')return Number(p.stock)>0;
    if(type==='kids')return c.isKids;
    if(type==='kids-kurta')return c.isKidsKurta;
    if(type==='kids-jacket')return c.isKidsJacket;
    if(type==='men-jacket')return c.isMenJacket;
    if(type==='jacket')return c.isMenJacket||c.isKidsJacket;
    /* Explicit admin-managed collection keys are authoritative. */
    if(hasExplicitCollections)return cols.includes(type);
    /* Older products with no collection field use their primary category only. */
    if(['new','father-son','waistcoat-sets','boys-kurta','mens-kurta','wedding','festive','haldi','sangeet','reception','minimal','indowestern','groom','groomsman','father','brother','men'].includes(type))return false;
    return originalCategoryMatch(p,type);
  };

  const originalCollection=collection;
  collection=function(type){
    let html=originalCollection(type);
    let switcher='';
    if(type==='jacket'){
      html=html.replace(/Kurta Jacket Sets/g,'Jackets — Men & Kids');
      switcher='<div class="client-cat-switch"><a class="active" href="#collection/jacket">All Jackets</a><a href="#collection/men-jacket">Men Jackets</a><a href="#collection/kids-jacket">Kids Jackets</a></div><div class="client-collection-note">This section now includes both men’s jacket sets and kids’ Nehru jacket sets, as requested.</div>';
    }else if(type==='men-jacket'){
      html=html.replace(/>Collection</g,'>Men Jackets<').replace(/\/ Collection</g,'/ Men Jackets<');
      switcher='<div class="client-cat-switch"><a href="#collection/jacket">All Jackets</a><a class="active" href="#collection/men-jacket">Men Jackets</a><a href="#collection/kids-jacket">Kids Jackets</a></div>';
    }else if(type==='kids-jacket'){
      html=html.replace(/>Collection</g,'>Kids Jackets<').replace(/\/ Collection</g,'/ Kids Jackets<');
      switcher='<div class="client-cat-switch"><a href="#collection/kids-kurta">Kids Kurta Sets</a><a class="active" href="#collection/kids-jacket">Kids Jackets</a></div>';
    }else if(type==='kids-kurta'){
      html=html.replace(/>Collection</g,'>Kids Kurta Sets<').replace(/\/ Collection</g,'/ Kids Kurta Sets<');
      switcher='<div class="client-cat-switch"><a class="active" href="#collection/kids-kurta">Kids Kurta Sets</a><a href="#collection/kids-jacket">Kids Jackets</a></div><div class="client-collection-note">Only kids’ kurta sets appear here — no men’s products are mixed into this collection.</div>';
    }else if(type==='kids'){
      switcher='<div class="client-cat-switch"><a href="#collection/kids-kurta">Kids Kurta Sets</a><a href="#collection/kids-jacket">Kids Jackets</a></div>';
    }else if(type==='wedding'){
      switcher='<div class="client-cat-switch"><a class="active" href="#collection/wedding">Wedding Edit</a><a href="#collection/jacket">Jackets</a><a href="#collection/sherwani">Sherwanis</a><a href="#collection/kids-jacket">Kids Wedding Jackets</a></div>';
    }
    if(switcher) html=html.replace('<div class="collection-tools">',switcher+'<div class="collection-tools">');
    return html;
  };

  function clientPatchNav(){
    document.querySelectorAll('.nav-item').forEach(item=>{
      const top=item.querySelector(':scope > a');
      const label=(top?.textContent||'').trim().toLowerCase();
      if(label==='kids'){
        const links=[...item.querySelectorAll('.mega a')];
        const kurta=links.find(a=>a.textContent.trim().toLowerCase()==='kurta sets');
        const jacket=links.find(a=>a.textContent.trim().toLowerCase()==='nehru jacket sets');
        if(kurta)kurta.href='#collection/kids-kurta';
        if(jacket)jacket.href='#collection/kids-jacket';
      }
    });
  }
  const originalApplyCMSStatic=applyCMSStatic;
  applyCMSStatic=function(){originalApplyCMSStatic();clientPatchNav()};

  /* AEHRAN DYNAMIC HERO — banner artwork is managed only from Admin > Banner Manager.
     No embedded/default banner images are shipped in the storefront. */
  let AEHRAN_LIVE_BANNERS=[];
  let AEHRAN_HERO_DEVICE=(window.matchMedia&&window.matchMedia('(max-width: 850px)').matches)?'mobile':'desktop';
  const AEHRAN_BANNER_ENDPOINT='https://aehran123-default-rtdb.asia-southeast1.firebasedatabase.app/aehran_store_v3/bannersV2.json';
  const AEHRAN_IMAGE_ENDPOINT='https://aehran123-default-rtdb.asia-southeast1.firebasedatabase.app/aehran_image_store_v1/';
  function fastMobileBannerFallback(index,raw){return String(raw||'').trim()}
  function clientHeroSlides(){
    const device=(window.matchMedia&&window.matchMedia('(max-width: 850px)').matches)?'mobile':'desktop';
    AEHRAN_HERO_DEVICE=device;
    return AEHRAN_LIVE_BANNERS.filter(b=>b&&b.active!==false&&b.deviceTarget===device&&String(b.image||'').trim()).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)).map((b,i)=>({desktopImage:b.image,mobileImage:b.image,image:b.image,link:b.link||'new',label:b.label||`${device==='mobile'?'Mobile':'Desktop'} banner ${i+1}`}));
  }
  function clientHeroHTML(){
    const slides=clientHeroSlides();
    if(!slides.length)return '';
    const slideHTML=slides.map((s,i)=>{
      const image=s.image||'';
      return `<div class="client-hero-slide ${i===0?'active':''}" data-index="${i}" data-desktop-image="${escapeAttr(image)}" data-mobile-image="${escapeAttr(image)}" data-link="${escapeAttr(s.link||'new')}"><div class="client-hero-skeleton" aria-hidden="true"></div><picture><img src="${escapeAttr(image.startsWith('dbimg:')?'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==':image)}" data-dbimg="${escapeAttr(image.startsWith('dbimg:')?image:'')}" alt="${escapeAttr(s.label)}" width="1536" height="658" loading="${i===0?'eager':'lazy'}" decoding="async" fetchpriority="${i===0?'high':'auto'}"></picture></div>`;
    }).join('');
    const controls=`${slides.length>1?'<button type="button" class="client-hero-arrow client-hero-prev" onclick="event.stopPropagation();clientHeroMove(-1)" aria-label="Previous banner">‹</button><button type="button" class="client-hero-arrow client-hero-next" onclick="event.stopPropagation();clientHeroMove(1)" aria-label="Next banner">›</button><div class="client-hero-nav">'+slides.map((_,i)=>`<button type="button" class="client-hero-dot ${i===0?'active':''}" onclick="event.stopPropagation();clientHeroGo(${i})" aria-label="Banner ${i+1}"></button>`).join('')+'</div>':''}`;

function clean(v){

    return v;
  }

  if(v&&typeof v==='object'){const o={};for(const [k,x] of Object.entries(v))o[k]=clean(x);return o}

function bindRealtime(){

  if(!b)throw new Error('Storefront bridge missing');

  let stopMine=[];

    if(u.email)stopMine.push(mine('orders','email',u.email,a=>({orders:a.sort((x,y)=>String(x.date||'').localeCompare(String(y.date||'')))})));
    stopMine.push(mine('returns','uid',u.uid,a=>({returns:a})))});
  onValue(ref(db,`${ROOT}/meta`),snap=>{

      window.__aehranFirebaseState={ready:true,root:ROOT,projectId:'aehran123',updatedAt:m.updatedAt||0,lastWriteSource:m.lastWriteSource||'',imageMode:m.imageMode||'realtime-media-refs'}

      id:aeText(p.id||p.sku||`aehran-${index}`),

  const aeSafePrice=v=>{const n=aeNum(v);return n==null?'':'₹'+Math.round(n).toLocaleString('en-IN')};

  const aeStrictCollectionAliases={'waistcoat':'waistcoat-sets','waistcoat-set':'waistcoat-sets','kids':'boys-kurta','kids-kurta':'boys-kurta','father':'father-son','new-arrivals':'new'};
  const aeStrictCollectionKeys=new Set(['new','boys-kurta','waistcoat-sets','sale','father-son','mens-kurta','wedding']);
  try{const saved=JSON.parse(localStorage.getItem('aehran_collections')||'[]');(Array.isArray(saved)?saved:[]).forEach(row=>{const key=Array.isArray(row)?row[0]:row?.key||row?.slug;if(key)aeStrictCollectionKeys.add(String(key).toLowerCase())})}catch(e){}
  categoryMatch=function(raw,type){
    const p=aeNormalizeProduct(raw),requested=String(type||'').toLowerCase(),key=aeStrictCollectionAliases[requested]||requested;
    const cols=Array.isArray(p.collections)?p.collections.map(x=>aeStrictCollectionAliases[String(x).toLowerCase()]||String(x).toLowerCase()):[];
    /* Known/admin-managed collections are strict: explicit assignment plus audience isolation. */

      if(key==='boys-kurta'){

        const category=String(p.cat||p.category||p.product_type||p.productType||'').toLowerCase();
        const title=String(p.name||p.title||'').toLowerCase();
        const sizes=Array.isArray(p.sizes)?p.sizes.map(x=>String(x).toLowerCase()):String(p.sizes||'').split(/[|,]/).map(x=>x.trim().toLowerCase());
        const kidSize=sizes.some(x=>/^(2-3y|3-4y|4-5y|5-6y|6-7y|7-8y|8-9y|9-10y|10-11y|11-12y|13-14y|\d+[-– ]\d+ years?)$/.test(x));
        const kidsEvidence=/(^|[\s_-])(kids?|boys?|child|children)([\s_-]|$)/.test(audience+' '+category+' '+title)||kidSize;
        const adultEvidence=/(waistcoat|nehru jacket|coat[- ]?pant|men'?s|mens|adult)/.test(title+' '+category+' '+audience);

      return cols.includes(key);

  const aeCollectionTitles={all:'Boys Kurta',new:'New Arrivals',men:'Men’s Occasionwear',kurta:'Kurta Sets',jacket:'Kurta Jacket Sets',sherwani:'Sherwanis',kids:'Kids Occasionwear',wedding:'Wedding Edit',minimal:'Minimal Edit',sale:'Sale Edit',haldi:'Haldi Edit',sangeet:'Sangeet Edit',reception:'Reception Edit',festive:'Festive / Wedding Collection',indowestern:'Indo-Western',groom:'Groom Edit',groomsman:'Groomsman Edit',father:'Father of the Bride / Groom',brother:'Brother Edit',ready:'Ready to Ship','men-jacket':'Men’s Jackets','kids-jacket':'Kids Waistcoat / Jacket Sets','kids-kurta':'Kids Kurta Pajama','nehru-jackets':'Men · Nehru Jackets','kurta-pajama':'Men · Kurta Pajama','waistcoat-sets':'Waistcoat','coat-pant':'Men · Coat-Pant','father-son':'Father & Son Matching'};

  };

  const AE_BLOG=[
    {id:'wedding-outfit-guide',cat:'Wedding Outfit Guides',title:'How to Build a Refined Wedding Wardrobe',excerpt:'A practical way to balance ceremony, comfort, colour and layering across wedding events.',body:'Start with the event and time of day, then choose the silhouette. Keep one statement element—such as a structured jacket or textured sherwani—and let the remaining pieces stay clean. Prioritise fit, movement and footwear comfort so the outfit works through a long celebration.'},
    {id:'kurta-styling-tips',cat:'Kurta Styling Tips',title:'Kurta Styling: Clean Layers, Better Proportions',excerpt:'Simple ways to make a kurta set feel more considered without over-accessorising.',body:'A strong kurta look depends on proportion. Keep the hem, trouser break and sleeve length tidy, then use one layer or accessory for contrast. Neutral footwear and a restrained pocket square can keep the overall look polished.'},
    {id:'nehru-jacket-styling',cat:'Nehru Jacket Styling',title:'Nehru Jackets for Day and Evening Functions',excerpt:'How colour, texture and contrast can change the mood of the same kurta base.',body:'For daytime functions, lighter neutrals and softer contrasts keep the look fresh. For evening events, deeper tones and richer texture add formality. The jacket should close comfortably without pulling across the chest.'},
    {id:'father-son-outfit-ideas',cat:'Father-Son Outfit Ideas',title:'Father & Son Matching Without Looking Identical',excerpt:'Coordinate colour families, fabrics and details while keeping age-appropriate silhouettes.',body:'Matching works best when the palette or fabric story is shared instead of copying every detail. A father can wear a structured jacket while a child wears a simpler kurta set in the same colour family.'},
    {id:'festival-outfit-guides',cat:'Festival Outfit Guides',title:'Festival Dressing That Stays Comfortable',excerpt:'Build festive outfits around breathable layers, movement and repeatable styling.',body:'Choose a silhouette that can be worn for several hours, then use colour and texture to create the festive mood. Keep accessories light and plan for temperature changes if celebrations move between indoor and outdoor spaces.'}

  function aeBlogPage(){const cats=[...new Set(AE_BLOG.map(x=>x.cat))];return `<section class="page ae-info-page"><div class="wrap"><div class="breadcrumbs"><a href="#home">Home</a> / Blog</div><div class="section-head"><div><div class="eyebrow">AEHRAN journal</div><h2>Style Notes & Occasion Guides</h2></div><p>Wedding, kurta, Nehru jacket, father-son and festival styling ideas.</p></div><div class="ae-blog-filters"><button class="active" onclick="aeFilterBlog('all',this)">All</button>${cats.map(c=>`<button onclick="aeFilterBlog('${escapeAttr(c)}',this)">${escapeHTML(c)}</button>`).join('')}</div><div class="ae-blog-grid">${AE_BLOG.map(x=>`<article class="ae-blog-card" data-blog-cat="${escapeAttr(x.cat)}"><div class="eyebrow">${escapeHTML(x.cat)}</div><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(x.excerpt)}</p><button class="text-link" onclick="aeOpenArticle('${escapeAttr(x.id)}')">Read guide</button></article>`).join('')}</div></div></section>${footer()}`}

  window.aeOpenArticle=function(id){const x=AE_BLOG.find(a=>a.id===id);if(!x)return;openModal(`<button class="icon-btn close" onclick="closeModal()">✕</button><div class="eyebrow">${escapeHTML(x.cat)}</div><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(x.body)}</p><button class="btn ghost" onclick="closeModal()">Close</button>`)};

  function aeAboutPage(){return `<section class="page ae-info-page"><div class="wrap"><div class="breadcrumbs"><a href="#home">Home</a> / About AEHRAN</div><div class="ae-story-hero"><div><div class="eyebrow">AEHRAN · THE ROYAL OF ETHNIC</div><h1>Indian occasionwear with a refined royal point of view.</h1><p>AEHRAN’s current storefront presents the brand around modern Indian occasionwear, clean tailoring and ceremonial dressing for men and kids.</p></div></div><div class="ae-info-grid"><article><h3>Brand Story</h3><p>AEHRAN is positioned as a contemporary ethnic-wear label for weddings, festivals and family celebrations, combining traditional silhouettes with a cleaner modern presentation.</p></article><article><h3>Manufacturing</h3><p>Verified factory, workshop and production-process details should be published here from AEHRAN’s operational records rather than guessed on the storefront.</p></article><article><h3>Craftsmanship</h3><p>The catalogue highlights tailoring, layering, embroidery and occasion-ready finishing. Product-specific craft claims should come directly from each verified product record.</p></article><article><h3>Quality Standards</h3><p>Published products should include complete title, price, image, size, fabric and care information before they are shown to customers.</p></article><article><h3>Vision</h3><p>Create an easy, premium shopping experience for Indian celebration wear while keeping styling polished, practical and consistent across devices.</p></article></div></div></section>${footer()}`}

  function aeTrackPage(){return `<section class="page ae-info-page"><div class="wrap"><div class="breadcrumbs"><a href="#home">Home</a> / Track Order</div><div class="ae-tool-card"><div class="eyebrow">Order tracking</div><h2>Track your AEHRAN order</h2><p>Enter an Order Number, Tracking ID or AWB saved with your order.</p><form onsubmit="aeTrackOrder(event)" class="ae-track-form"><input id="aeTrackInput" required placeholder="AHR123456 / Tracking ID"><button class="btn">Track Order</button></form><div id="aeTrackResult" aria-live="polite"></div></div></div></section>${footer()}`}
  window.aeTrackOrder=function(e){e.preventDefault();const q=aeText(document.getElementById('aeTrackInput')?.value).toLowerCase();const o=(orders||[]).find(x=>[x.id,x.internalTrackingId,x.trackingId,x.awb,x.awbNumber,x.shipmentId].some(v=>aeText(v).toLowerCase()===q));const out=document.getElementById('aeTrackResult');if(!out)return;if(!o){out.innerHTML='<div class="ae-track-result error"><b>Order not found</b><span>Check the number and try again.</span></div>';return}const tracking=aeText(o.internalTrackingId||o.trackingId||o.awb||o.awbNumber||o.shipmentId);out.innerHTML=`<div class="ae-track-result"><b>${escapeHTML(o.id||'AEHRAN order')}</b><strong>${escapeHTML(o.status||'Placed')}</strong>${tracking?`<span>Tracking: ${escapeHTML(tracking)}</span>`:''}<span>${o.date?new Date(o.date).toLocaleString('en-IN'):''}</span></div>`};

  function aeContactPage(){const f=cms.footer||{},email=aeText(f.contactEmail||'care@aehran.com'),address=aeText(f.address||localStorage.getItem('aehran_business_address')||''),map=address?`<iframe class="ae-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(address)}&output=embed" title="AEHRAN business location"></iframe>`:`<div class="ae-map ae-map-empty"><b>Business map</b><span>Add the verified business address to <code>cms.footer.address</code> or <code>aehran_business_address</code> to activate the embedded map.</span></div>`;return `<section class="page ae-info-page"><div class="wrap"><div class="breadcrumbs"><a href="#home">Home</a> / Contact Us</div><div class="ae-contact-grid"><form class="ae-contact-form" onsubmit="aeSubmitContact(event)"><div class="eyebrow">Customer care</div><h2>Contact AEHRAN</h2><label>Name<input id="ctName" required></label><label>Phone<input id="ctPhone" inputmode="tel" required></label><label>Email<input id="ctEmail" type="email" required></label><label>Query / Message<textarea id="ctMessage" rows="5" required></textarea></label><button class="btn">Continue on WhatsApp</button></form><aside class="ae-contact-aside"><h3>Direct support</h3><a class="ae-contact-action" href="${WA_URL}" target="_blank" rel="noopener"><b>WhatsApp</b><span>+91 98314 53419</span></a><a class="ae-contact-action" href="${aeInstaURL()}" target="_blank" rel="noopener"><b>Instagram</b><span>${escapeHTML(f.instagram||'@aehran')}</span></a><a class="ae-contact-action" href="mailto:${escapeAttr(email)}"><b>Email</b><span>${escapeHTML(email)}</span></a><div class="ae-address"><b>Business address</b><span>${address?escapeHTML(address):'Verified business address has not been supplied in this file.'}</span></div>${map}</aside></div></div></section>${footer()}`}

    shipping:{title:'Shipping Policy',fallback:'Orders are prepared and dispatched according to stock availability and the delivery service selected for the destination. Delivery estimates are indicative until a courier is allocated. Tracking information is shown when available.'},

  function aeCustomHash(hash){return hash==='#about'||hash==='#track'||hash==='#blog'||hash==='#contact'||hash.startsWith('#policy/')}

<script id="aehran-navigation-context-scroll-fix-v2-js">

    const map=[
      [['home','homepage','home page'],'home'],[['new','new arrivals','new arrival'],'new'],[['men','mens','men collection'],'men'],[['kids','kids collection','children'],'kids'],
      [["men's kurta sets",'mens kurta sets','kurta sets','kurta set'],'kurta'],[['kids kurta sets','boys kurta set','boys kurta sets','kids kurta set'],'kids-kurta'],
      [['jacket sets','jackets','jacket'],'jacket'],[["men's jackets",'mens jackets','men jackets'],'men-jacket'],[["kids' jackets",'kids jackets','kids jacket'],'kids-jacket'],
      [['sherwanis','sherwani'],'sherwani'],[['wedding','weddings','wedding edit'],'wedding'],[['collections','collections / minimal','minimal','minimal edit'],'minimal'],[['sale','sale edit'],'sale'],
      [['haldi','haldi edit'],'haldi'],[['sangeet','sangeet edit'],'sangeet'],[['reception','reception edit'],'reception'],[['festive','festive edit'],'festive'],[['indo-western','indo western'],'indowestern'],
      [['groom','groom edit'],'groom'],[['groomsman','groomsman edit'],'groomsman'],[['father edit','father'],'father'],[['father & son','father and son','father & son matching','father and son matching'],'father-son'],
      [['brother edit','brother'],'brother'],[['ready to ship','ready'],'ready'],[['nehru jackets','nehru jacket'],'nehru-jackets'],[['kurta pajama','kurta-pajama'],'kurta-pajama'],[['coat-pant','coat pant'],'coat-pant'],
      [['waistcoat','waistcoats','waistcoat sets','men waistcoat sets'],'waistcoat-sets']
    ];
    for(const [names,target] of map)if(names.includes(v))return target;
    return fallback||'';
  };
  const repairCmsNav=function(){
    if(!Array.isArray(cms?.nav))return;
    let changed=false;
    cms.nav.forEach(x=>{const t=routeForLabel(x?.label,x?.target||'');if(t&&t!==x.target){x.target=t;changed=true}});

      {label:'New',target:'new',visible:true,mobileVisible:true},
      {label:'Waistcoat',target:'waistcoat-sets',visible:true,mobileVisible:false},

      {label:'Father & Son',target:'father-son',visible:true,mobileVisible:false},
      {label:'Sale',target:'sale',visible:true,mobileVisible:true}
    ];
    const defaultsByTarget=Object.fromEntries(PRIMARY_NAV.map(x=>[x.target,x]));
    const current=Array.isArray(cms.nav)?cms.nav.filter(Boolean):[];

    /*
      Defaults are only created when navigation is absent.
      Existing CMS/Firebase navigation is preserved rather than reset on every load.
    */
    if(!current.length){
      cms.nav=PRIMARY_NAV.map(x=>({...x}));
      try{localStorage.setItem('aehran_cms',JSON.stringify(cms))}catch(e){}

      let changed=false;

        const target=String(item.target||'').trim();

          /* Preserve additional CMS/admin navigation items. */

          if(next.mobileVisible!==item.mobileVisible)changed=true;
          return next;

        const next={

          label:item.label||base.label,
          target:base.target,
          visible:item.visible!==false,
          mobileVisible:item.mobileVisible!==undefined?item.mobileVisible:base.mobileVisible
        };
        if(JSON.stringify(next)!==JSON.stringify(item))changed=true;
        return next;
      });

    if(list.length)return list.map((b,i)=>({image:b.image,desktopImage:device==='desktop'?b.image:'',mobileImage:device==='mobile'?b.image:'',link:b.link||'new',label:b.label||`Banner ${i+1}`}));
    return null;
  }
  const oldClientHeroSlides=window.clientHeroSlides;
  window.clientHeroSlides=function(){const v=currentV2Slides();return Array.isArray(v)?v:[]};
  try{clientHeroSlides=window.clientHeroSlides}catch(e){}
  async function loadCloudBanners(){
    try{
      const nextBanners=normalizeBanners(v);
      const signature=JSON.stringify(nextBanners.map(b=>({id:b.id||'',image:b.image||'',deviceTarget:b.deviceTarget||'desktop',active:b.active!==false,order:Number(b.order)||0,link:b.link||'',label:b.label||''})));
      const changed=signature!==lastCloudBannerSignature;
      cloudBanners=nextBanners;
      if(changed){
        lastCloudBannerSignature=signature;
        if(typeof route==='function'&&(!location.hash||location.hash==='#home'||location.hash==='#'))route(true);
      }
      setTimeout(()=>window.__aehranApplyHeroArtDirection?.(),50);
    }catch(e){console.warn('AEHRAN banner manager cloud read failed',e)}
  }
  async function refreshBannerImages(){
    const root=document.getElementById('clientHeroSlider');if(!root)return;
    const mobile=getDevice()==='mobile';
    for(const slide of [...root.querySelectorAll('.client-hero-slide')]){
      const raw=mobile?(slide.dataset.mobileImage||''):(slide.dataset.desktopImage||'');
      if(!raw.startsWith('dbimg:'))continue;
      const im=slide.querySelector('img');const d=await resolveImage(raw);if(d&&im){im.src=d;im.style.display='block';slide.classList.add('loaded')}
    }
  }
  window.__aehranCloudBannerRefresh=loadCloudBanners;
  loadCloudBanners();setInterval(loadCloudBanners,30000);setTimeout(refreshBannerImages,600);setTimeout(refreshBannerImages,1800);
  window.addEventListener('resize',()=>setTimeout(()=>{loadCloudBanners();refreshBannerImages()},100));
  async function syncCollections(){try{const v=await getJSON('aehran_store_v3/collections');if(Array.isArray(v)){window.__AEHRAN_COLLECTIONS=v;localStorage.setItem('aehran_collections',JSON.stringify(v))}}catch(e){}}
  syncCollections();setInterval(syncCollections,30000);
})();

<script id="aehran-final-payment-size-hardening">
(function(){
  'use strict';

  /* -----------------------------------------------------------
     1) PERMANENT SIZE SELECTION HARDENING
     - Never let stale/old catalogue data containing only one size
       make the PDP look like it has only one selectable size.
     - Keep combo Father/Son controls independent.
     - Only an explicitly zero-stock variant may be disabled.
  ----------------------------------------------------------- */
  const AE_SIZE_KIDS=['3-4 years','5-6 years','7-8 years','9-10 years','11-12 years','13-14 years'];
  const AE_SIZE_ADULT=['XS','S','M','L','XL','XXL'];

  function aeFullSizeList(raw){
    const p=raw||{};
    const kids=String(p.audience||'').toLowerCase()==='kids' ||
      ['kids','kids-kurta','kids-jacket'].includes(String(p.cat||p.category||'').toLowerCase());
    const fallback=kids?AE_SIZE_KIDS:AE_SIZE_ADULT;
    let list=Array.isArray(p.sizes)
      ? p.sizes.map(x=>String(x).trim()).filter(Boolean)
      : (typeof p.sizes==='string'
          ? p.sizes.split(/[|,]/).map(x=>x.trim()).filter(Boolean)
          : []);
    list=[...new Set(list)];
    /* A one-size/legacy bad record is the recurring bug on this site.
       For these products restore the complete standard size set. */
    if(list.length<2) list=fallback.slice();
    return list;
  }

  /* Repair the live catalogue too, so cart/PDP do not keep stale
     one-size records in localStorage after this file is opened. */
  try{
    if(typeof products!=='undefined'&&Array.isArray(products)){
      products.forEach(p=>{
        if(!p||p.isCombo)return;
        const list=aeFullSizeList(p);
        if(list.length>=2)p.sizes=list;
      });
      try{localStorage.setItem('aehran_products',JSON.stringify(products))}catch(e){}
    }
  }catch(e){console.warn('AEHRAN size catalogue repair skipped',e)}

  /* productPage is global in this storefront. Wrap the final renderer
     after all earlier product-page patches have loaded. */
  if(typeof window.productPage==='function' && !window.productPage.__aeFinalSizeHardened){
    const originalProductPage=window.productPage;
    const hardenedProductPage=function(raw){
      const p=raw&&typeof raw==='object'?{...raw}:raw;
      if(p&&typeof p==='object'&&!p.isCombo){
        const sizes=aeFullSizeList(p);
        if(sizes.length>=2)p.sizes=sizes;
      }
      return originalProductPage(p);
    };
    hardenedProductPage.__aeFinalSizeHardened=true;
    window.productPage=hardenedProductPage;
  }

  /* -----------------------------------------------------------
     FINAL SIZE-SELECTION HARDENING
     One source of truth. No wrappers, no stale closures, no capture
     listeners. Inline buttons and delegated touch/click both reach this.
  ----------------------------------------------------------- */
  window.aeSelectSizeFinal=function(el,size){
    const value=String(size==null?(el?.dataset?.size||el?.textContent||''):size).trim();
    if(!value)return false;
    let pid=aeCurrentProductId();
    let p=Array.isArray(products)?products.find(x=>String(x.id)===String(pid)):null;
    if(!p && el?.closest){
      const root=el.closest('.pinfo');
      const btns=root?.querySelectorAll('.size[data-size]')||[];
      if(btns.length){
        /* If the hash is unavailable, use the currently rendered product id. */
        pid=String(window.__aehranCurrentPdpId||'');
        p=Array.isArray(products)?products.find(x=>String(x.id)===pid):null;
      }
    }
    if(!p)return false;
    const valid=aeProductSizeList(p).map(String).includes(value);
    if(!valid)return false;
    const variants=Array.isArray(p.sizeVariants)?p.sizeVariants:(Array.isArray(p.variants)?p.variants:[]);
    const v=variants.find(x=>String(x?.size??x?.name??x?.variantSize??'')===value);
    if(v && v.stock!=null && Number.isFinite(Number(v.stock)) && Number(v.stock)<=0){
      toast('This size is out of stock');
      return false;
    }
    selectedSize=value;
    selectedSizeProductId=String(p.id);
    window.__aehranSelectedSize=value;
    window.__aehranSelectedSizeProductId=String(p.id);
    const scope=el?.closest?.('.pinfo')||document;
    scope.querySelectorAll('.sizes .size[data-size]').forEach(b=>{
      const active=String(b.dataset.size||'').trim()===value;
      b.classList.toggle('active',active);
      b.setAttribute('aria-pressed',active?'true':'false');
      b.dataset.selected=active?'true':'false';
    });
    const variantPrice=scope.querySelector('[data-pdp-price]');
    if(variantPrice&&v&&Number.isFinite(Number(v.price)))variantPrice.textContent=money(Number(v.price));
    const variantStock=scope.querySelector('[data-pdp-stock]');
    if(variantStock&&v&&v.stock!=null)variantStock.textContent=Number(v.stock)>0?`${Number(v.stock)} left`:'Out of stock';
    document.dispatchEvent(new CustomEvent('aehran:sizechange',{detail:{productId:String(p.id),size:value,variant:v||null}}));
    return true;
  };
  window.chooseSize=window.aeSelectSizeFinal;
  try{chooseSize=window.aeSelectSizeFinal}catch(e){}

  /* Store the product id before the markup is inserted. */
  const __aeOriginalProductPage=productPage;
  productPage=function(raw){
    const p=raw&&typeof raw==='object'?raw:null;
    if(p)window.__aehranCurrentPdpId=String(p.id||'');
    return __aeOriginalProductPage(raw);
  };

  /* Event delegation is the safety net for mobile/touch and any dynamic
     PDP markup. It intentionally runs in bubble phase and never prevents
     the normal button click. */
  if(!window.__aehranFinalSizeDelegation){
    window.__aehranFinalSizeDelegation=true;
    document.addEventListener('click',function(e){
      const b=e.target?.closest?.('.pinfo .sizes .size[data-size]');
      if(!b || b.disabled)return;
      window.aeSelectSizeFinal(b,b.dataset.size);
    },false);
  }

  /* -----------------------------------------------------------
     2) RAZORPAY CHECKOUT HARDENING
     - COD keeps a safe local fallback if callable is unavailable.
     - Online payment always uses a server-created Razorpay order.
     - Never create/pretend a paid order from the browser.
     - Fresh order is created each time Continue is pressed.
     - Better failure handling + retry without clearing cart.
  ----------------------------------------------------------- */
  function aePaymentErrorFinal(err,fallback){
    const code=String(err?.code||'').toLowerCase();
    const raw=String(err?.message||'');
    console.error('AEHRAN Razorpay error',{code,message:raw,error:err});
    if(code.includes('not-found')||code.includes('unavailable')||code.includes('deadline'))
      return fallback+' The secure payment service is temporarily unavailable.';
    if(code.includes('failed-precondition'))
      return fallback+' Razorpay server configuration needs attention.';
    if(code.includes('permission-denied'))
      return fallback+' Payment verification was rejected.';
    if(code.includes('invalid-argument'))
      return fallback+' The payment order data was rejected. Please retry.';
    return fallback+' Please retry checkout.';
  }

  function aeLocalCodFallbackFinal(){
    const t=typeof totals==='function'?totals():{total:0,sub:0,discount:0,taxableAmount:0,gstRate:0,gstAmount:0,mode:'exclusive'};
    const order={
      id:'AHR'+Date.now(),
      date:new Date().toISOString(),
      status:'Placed',
      payment:'COD',
      paymentStatus:'cod',
      name:document.getElementById('name')?.value||'',
      email:document.getElementById('email')?.value||'',
      phone:document.getElementById('phone')?.value||'',
      address:document.getElementById('address')?.value||'',
      addressArea:document.getElementById('addressArea')?.value||'',
      city:document.getElementById('city')?.value||'',
      state:document.getElementById('state')?.value||'',
      pincode:document.getElementById('pincode')?.value||'',
      addressType:document.getElementById('addrtype')?.value||'Home',
      items:(typeof cart!=='undefined'&&Array.isArray(cart)?cart:[]).map(x=>({
        id:x.id,name:x.name,price:Number(x.price)||0,old:Number(x.old)||Number(x.price)||0,
        qty:Number(x.qty)||1,size:x.size||'',color:x.color||'',
        fatherSize:x.fatherSize||'',sonSize:x.sonSize||'',img:x.img||''
      })),
      total:Number(t.total)||0,
      subtotal:Number(t.sub)||0,
      discount:Number(t.discount)||0,
      taxableAmount:Number(t.taxableAmount)||0,
      gstRate:Number(t.gstRate)||0,
      gstAmount:Number(t.gstAmount)||0,
      gstMode:t.mode||'exclusive',
      couponCode:typeof coupon!=='undefined'?(coupon?.code||''):''
    };
    if(typeof orders!=='undefined'&&Array.isArray(orders))orders.push(order);
    order.items.forEach(it=>{
      const p=typeof products!=='undefined'&&Array.isArray(products)?products.find(x=>String(x.id)===String(it.id)):null;
      if(p)p.stock=Math.max(0,Number(p.stock||0)-Number(it.qty||0));
    });
    try{window.persist?.();window.syncBadges?.();window.__aehranFirebasePushOrder?.(order,typeof products!=='undefined'?products:[])}catch(e){console.warn('COD local persistence warning',e)}
    return order;
  }

  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  async function withTimeout(promise,ms){
    let timer;
    try{
      return await Promise.race([
        Promise.resolve(promise),
        new Promise((_,reject)=>{timer=setTimeout(()=>reject(Object.assign(new Error('Payment service timeout'),{code:'deadline-exceeded'})),ms)})
      ]);
    }finally{clearTimeout(timer)}
  }

  function aeFinalizeLegacyRazorpayOrder(paymentId=''){
    const t=totals();
    const order={
      id:'AHR'+Math.floor(100000+Math.random()*900000),
      date:new Date().toISOString(),
      name:document.getElementById('name').value,
      email:document.getElementById('email').value,
      phone:document.getElementById('phone').value.replace(/\D/g,''),
      address:[
        document.getElementById('address').value,
        document.getElementById('city').value,
        document.getElementById('state').value,
        document.getElementById('pincode').value
      ].join(', '),
      payment:'Razorpay',
      status:'Placed',
      items:cart.map(x=>({
        id:x.id,name:x.name,qty:x.qty,size:x.size,color:x.color,
        fatherSize:x.fatherSize,sonSize:x.sonSize,price:x.price
      })),
      total:t.total,
      coupon:coupon?.code||null,
      razorpayPaymentId:paymentId||'',
      paymentStatus:'Captured'
    };
    return aeHandleSecureOrderResult({order});
  }

async function finalPlaceOrder(){
    if(window.__aehranPaymentBusy)return;
    if(!aeLoggedIn()){sessionStorage.setItem('aeAfterLogin','#checkout');toast('Please sign in to place your order');location.hash='#account';return}
    {const em=document.getElementById('email');if(em&&profile.email)em.value=profile.email}
    const ids=['name','phone','email','address','city','pincode','state'];
    for(const id of ids){
      const el=document.getElementById(id);
      if(!el?.value?.trim()){el?.focus();toast('Please complete your delivery details');return}
    }
    const phone=document.getElementById('phone').value.replace(/\D/g,'');
    if(!/^\d{10}$/.test(phone)){toast('Enter a valid 10-digit mobile number');return}
    if(!/^\d{6}$/.test(document.getElementById('pincode').value)){toast('Enter a valid 6-digit pincode');return}
    if(typeof cart==='undefined'||!Array.isArray(cart)||!cart.length){toast('Your bag is empty');return}

    const selected=document.querySelector('input[name="pay"]:checked')?.value||'COD';
    const payload=typeof aeSecurePayload==='function'?aeSecurePayload():null;
    if(!payload){toast('Checkout could not be prepared. Please refresh and try again.');return}

    window.__aehranPaymentBusy=true;
    const button=document.querySelector('.place-order-btn');
    const oldText=button?.textContent;
    if(button){button.disabled=true;button.textContent=selected==='COD'?'Placing order…':'Connecting to Razorpay…';button.style.opacity='.72'}

    try{
      /* Preserve the NEW WEBSITE's existing COD flow exactly. */
      if(selected==='COD'){
        if(typeof window.__aehranCreateCodOrder==='function'){
          try{
            const result=await withTimeout(window.__aehranCreateCodOrder(payload),8000);
            if(result?.order){await aeHandleSecureOrderResult(result);return}
          }catch(e){
            console.warn('Secure COD callable failed; using local COD fallback.',e);
          }
        }
        const localOrder=aeLocalCodFallbackFinal();
        await aeHandleSecureOrderResult({order:localOrder});
        return;
      }

      /*
       * Razorpay-only section restored from the OLD WORKING WEBSITE:
       * use the storefront's configured public Key ID, calculate the
       * current cart total locally, open Razorpay Checkout, and create
       * the local order only after Razorpay reports a successful payment.
       * No Razorpay Secret Key is used or exposed here.
       */
      const gateway=(typeof cms!=='undefined'&&cms?.checkout?.gateway)||{};
      const keyId=String(gateway.keyId||'').trim();
      if(gateway.enabled===false||!keyId){
        toast('Razorpay payment is not configured. Please choose another payment method.');
        return;
      }
      if(typeof window.Razorpay==='undefined'){
        toast('Payment gateway could not load. Please retry.');
        return;
      }

      const t=totals();
      const rz=new window.Razorpay({
        key:keyId,
        amount:Math.round(t.total*100),
        currency:'INR',
        name:(typeof cms!=='undefined'&&cms?.branding?.brandName)||'AEHRAN',
        description:'AEHRAN order payment',
        prefill:{
          name:document.getElementById('name').value,
          email:document.getElementById('email').value,
          contact:phone
        },
        notes:{source:'AEHRAN Storefront'},
        theme:{color:'#0c1825'},
        handler:async function(resp){
          try{
            if(!resp?.razorpay_payment_id){
              toast('Payment response was incomplete. Your order was not created.');
              return;
            }
            await aeFinalizeLegacyRazorpayOrder(resp.razorpay_payment_id);
          }catch(e){
            console.error('AEHRAN Razorpay order finalization failed',e);
            toast(e?.message||'Payment was received, but the order could not be confirmed. Please contact AEHRAN support.');
          }
        }
      });
      rz.on('payment.failed',function(resp){
        const er=resp?.error||{};
        console.error('AEHRAN Razorpay payment.failed',resp);
        toast(er.description||'Payment was not completed. You can retry checkout safely.');
      });
      rz.open();
    }catch(e){
      console.error('AEHRAN Razorpay checkout failed',e);
      toast(e?.message||'Razorpay checkout could not be started. No payment was charged.');
    }finally{
      window.__aehranPaymentBusy=false;
      if(button){button.disabled=false;button.textContent=oldText||'Continue';button.style.opacity=''}
    }
  }

  window.placeOrder=finalPlaceOrder;
  try{placeOrder=finalPlaceOrder}catch(e){}
  window.__aehranFinalPaymentSizeHardening=true;

  /* If this file is opened directly from Downloads/content://, the
     module can finish a moment after the page. Re-enable Continue once
     the DOM is ready and do not force any scroll/navigation. */
  window.addEventListener('load',()=>{try{window.__aehranPaymentBusy=false}catch(e){}},{once:true});
})();
</script>

<script id="aehran-permanent-strict-collection-guard">
(function(){
  // A collection page is a membership query, never a category/name/tag heuristic.
  const original=window.categoryMatch;
  window.categoryMatch=function(product,key){
    if(String(key||'')==='all') return true;
    const p=product&&typeof product==='object'?product:{};
    if(p.deleted===true||p.isDeleted===true||String(p.status||'').toLowerCase()==='deleted') return false;
    const requested=String(key||'').trim().toLowerCase();
    const assignments=Array.isArray(p.collections)?p.collections:[];
    return assignments.some(v=>String(v||'').trim().toLowerCase()===requested);
  };
  try { categoryMatch=window.categoryMatch; } catch(e) {}
  // Remove invalid/incomplete cards from global search; never inject sample products.
  const oldSearch=window.renderSearch;
  window.renderSearch=function(q){
    const term=String(q||'').trim().toLowerCase();
    const valid=(typeof products!=='undefined'&&Array.isArray(products)?products:[]).filter(p=>p&&p.id&&String(p.name||p.title||'').trim()&&Number.isFinite(Number(p.price))&&Number(p.price)>=0&&String(p.img||p.image||p.imageUrl||'').trim()&&!(p.deleted===true||p.isDeleted===true||p.status==='deleted'));
    const matches=term?valid.filter(p=>[p.name,p.title,p.cat,p.category,p.color,p.tag,p.desc,p.description].join(' ').toLowerCase().includes(term)):valid.slice(0,8);
    const root=document.getElementById('searchResults');
    if(root) root.innerHTML=matches.slice(0,10).map(p=>`<a class="s-item" href="#product=${String(p.id).replace(/["'<>]/g,'')}" onclick="closeSearch()"><img src="${String(p.img||p.image||p.imageUrl).replace(/["<>]/g,'&quot;')}" alt=""><h4>${String(p.name||p.title).replace(/[&<>]/g,'')}</h4><span>₹${Math.round(Number(p.price)).toLocaleString('en-IN')}</span></a>`).join('')||'<div class="ae-empty-state">No matching products found.</div>' ;
    const hint=document.getElementById('searchHint'); if(hint) hint.textContent=term?`${matches.length} results for “${String(q||'')}”`:'Popular right now';
    try{safeImg()}catch(e){}
  };
})();
</script>

<script id="aehran-father-son-size-fix">
(function(){
  const ADULT=['XS','S','M','L','XL','XXL'];
  const KIDS=['3-4 years','5-6 years','7-8 years','9-10 years','11-12 years','13-14 years'];
  function isFatherSon(p){
    const cols=Array.isArray(p&&p.collections)?p.collections:[];
    const cat=String(p&&(p.cat||p.category)||'').toLowerCase();
    return !!(p&&(p.isCombo===true || p.isCombo==='true' ||
      cols.some(x=>String(x).toLowerCase()==='father-son') ||
      cat==='father-son' || cat==='father & son' || cat==='father and son'));
  }
  function repair(){
    if(!Array.isArray(window.products))return;
    let changed=false;
    window.products.forEach(p=>{
      if(!p||!isFatherSon(p))return;
      if(p.isCombo!==true){p.isCombo=true;changed=true}
      if(!Array.isArray(p.fatherSizes)||!p.fatherSizes.length){p.fatherSizes=ADULT.slice();changed=true}
      if(!Array.isArray(p.sonSizes)||!p.sonSizes.length){p.sonSizes=KIDS.slice();changed=true}
    });
    if(changed){try{localStorage.setItem('aehran_products',JSON.stringify(window.products))}catch(e){}}
  }
  repair();
  window.chooseFatherSize=function(el,size){
    const value=String(size==null?((el&&el.dataset.size)||(el&&el.textContent)||''):size).trim();
    if(!el||!value)return;
    const scope=el.closest('.pinfo')||document;
    scope.querySelectorAll('.combo-father').forEach(b=>{
      const active=b===el;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active?'true':'false');
    });
    try{selectedFatherSize=value}catch(e){}
    window.__aehranFatherSize=value;
    el.dataset.selectedSize=value;
  };
  window.chooseSonSize=function(el,size){
    const value=String(size==null?((el&&el.dataset.size)||(el&&el.textContent)||''):size).trim();
    if(!el||!value)return;
    const scope=el.closest('.pinfo')||document;
    scope.querySelectorAll('.combo-son').forEach(b=>{
      const active=b===el;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active?'true':'false');
    });
    try{selectedSonSize=value}catch(e){}
    window.__aehranSonSize=value;
    el.dataset.selectedSize=value;
  };
  const oldRoute=window.route;
  if(typeof oldRoute==='function'&&!oldRoute.__aeFatherSonRepair){
    const wrappedRoute=function(){repair();return oldRoute.apply(this,arguments)};
    wrappedRoute.__aeFatherSonRepair=true;window.route=wrappedRoute;
    try{route=wrappedRoute}catch(e){}
  }
  document.addEventListener('click',function(e){
    const btn=e.target&&e.target.closest&&e.target.closest('.pinfo .combo-father,.pinfo .combo-son');
    if(!btn)return;
    const size=String(btn.textContent||'').trim();
    if(btn.classList.contains('combo-father'))window.chooseFatherSize(btn,size);
    else window.chooseSonSize(btn,size);
  },true);
})();
</script>

<script id="aehran-multi-size-chart-storefront-v2-collection-mapping">
(function(){
 const escv=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function norm(v){return String(v??'').trim().toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
 function currentProduct(explicitId){try{const h=String(location.hash||'');const m=h.match(/(?:product=|product\/)([^&/?#]+)/);let id=String(explicitId||'');if(!id)id=m?decodeURIComponent(m[1]):'';const pools=[window.products,typeof products!=='undefined'?products:null,window.allProducts,window.catalogProducts];for(const pool of pools){if(Array.isArray(pool)){const p=pool.find(x=>String(x.id)===id||String(x.productId||'')===id);if(p)return p}}for(const k of ['currentProduct','activeProduct','selectedProduct']){try{const p=window[k];if(p&&(!id||String(p.id)===id))return p}catch(e){}}}catch(e){}return null}
 window.aeOpenSizeChart=function(productId){
    const product=currentProduct(productId);
    const normKey=v=>String(v??'').toLowerCase().trim().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const aliases=v=>{const n=normKey(v);const out=new Set([n]);const map={
      'father-son':['father-son','father-and-son','father-son-matching','father-son-sets','father-son-collection'],
      'waistcoat':['waistcoat','waistcoat-sets','men-waistcoat','nehru-jacket'],
      'boys-kurta':['boys-kurta','kids-kurta','kids','boys-kurta-set'],
      'mens-kurta':['mens-kurta','men-s-kurta','men-kurta','mens-kurta-sets'],
      'new-arrivals':['new-arrivals','new','new-arrival'],
      'sales':['sales','sale','sale-edit']
    };
      for(const [key,vals] of Object.entries(map)){if(n===key||vals.includes(n)||vals.some(x=>x===n)){out.add(key);vals.forEach(x=>out.add(x));}}
      return [...out];
    };
    const rawCollections=[...(Array.isArray(product?.collections)?product.collections:[]),...(Array.isArray(product?.collectionKeys)?product.collectionKeys:[]),product?.collection,product?.collectionId,product?.collectionSlug,product?.cat,product?.category,product?.categorySlug].filter(Boolean);
    const productKeys=new Set(rawCollections.flatMap(v=>aliases(v)));if(product&&(product.isCombo||/father[\s&-]*(?:and|&)?[\s-]*son/i.test(String(product.name||''))))aliases('father-son').forEach(k=>productKeys.add(k));
    const all=Array.isArray(cms?.sizeCharts)?cms.sizeCharts.filter(c=>c&&typeof c==='object'&&typeof c.image==='string'&&c.image.trim()):[];
    const matched=all.filter(c=>{
      const keys=Array.isArray(c.collections)?c.collections:(Array.isArray(c.collectionKeys)?c.collectionKeys:[]);
      return keys.some(k=>aliases(k).some(alias=>productKeys.has(alias)));
    });
    let charts=matched;
    if(!charts.length){
      const general=all.filter(c=>!(Array.isArray(c.collections)&&c.collections.length)&&!(Array.isArray(c.collectionKeys)&&c.collectionKeys.length));
      charts=general.length?general:(!all.length&&cms?.sizeChartImage?[{title:'General Size Guide',image:cms.sizeChartImage,collections:[]}]:[]);
    }
    const esc=typeof escapeAttr==='function'?escapeAttr:(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const body=charts.length?`<div class="ae-size-chart-modal-list">${charts.map((c,i)=>`<section class="ae-size-chart-modal-item"><h4>${esc(c.title||('Size Chart '+(i+1)))}</h4><img src="${esc(c.image)}" alt="${esc(c.title||'AEHRAN Size Chart')}" loading="${i?'lazy':'eager'}" decoding="async" onerror="this.closest('section').style.display='none'"></section>`).join('')}</div>`:'<p>No size chart has been assigned to this product collection yet. Please contact AEHRAN for sizing help.</p>';
    openModal(`<button class="icon-btn close" onclick="closeModal()" aria-label="Close">✕</button><div class="eyebrow">AEHRAN</div><h3>Size Chart${product?' · '+esc(product.name||'Product'):''}</h3>${body}<button class="btn ghost" onclick="closeModal()">Close</button>`);
  };
})();
</script>
